<title>Novaforge</title><link rel="manifest" href="manifest.webmanifest?v=2"><link rel="icon" href="icon-192-nf.png"><link rel="apple-touch-icon" href="apple-touch-icon-nf.png"><meta name="theme-color" content="#14161b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{--ink:#eef1f4;--muted:#9aa3ad;--panel:rgba(20,23,28,.82);--line:rgba(255,255,255,.1);--orange:#f08a32;--teal:#3fc4ae;--red:#e0574a;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(240,138,50,.96),rgba(224,96,60,.96));color:#fff;padding:14px 22px;border-radius:20px;text-align:center;max-width:min(560px,86vw);box-shadow:0 10px 30px rgba(0,0,0,.35)}#banner b{display:block;font-size:19px;margin-bottom:4px}#banner span{font-size:13.5px;font-weight:600;opacity:.95}
.card{background:rgba(18,21,26,.78);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#ms{position:absolute;left:calc(10px + var(--safe-l));top:calc(10px + var(--safe-t));width:210px;padding:9px 12px;text-align:left}#ms small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--orange);font-weight:800}#ms b{display:block;font-size:14px;margin-bottom:4px}
.mr{position:relative;display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 0 4px}.mr span{flex:1;color:#d6dbe0}.mr em{font-style:normal;font-weight:800;font-size:11px}.mr i{position:absolute;left:0;bottom:0;height:2px;background:var(--teal);border-radius:2px}.mr u{text-decoration:none;color:#ffd27a;font-size:10px;font-weight:800}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.3);flex:none}
#tr{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;gap:8px;align-items:center}
.pill{background:rgba(18,21,26,.78);padding:8px 12px;border-radius:14px;font-weight:800;font-size:12.5px}.pill.bad{background:rgba(224,87,74,.9)}
.rb{width:44px;height:44px;border-radius:14px;background:rgba(18,21,26,.78);display:grid;place-items:center}.rb svg{width:22px;height:22px}.rb:active{background:var(--orange);color:#1a1006}
.rb.tier{width:auto;padding:0 12px;font-weight:800;font-size:12px}
#pad{position:absolute;right:calc(18px + var(--safe-r));bottom:calc(18px + var(--safe-b));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:12px;align-items:end;justify-items:center}
#modeBtns{grid-column:1/3;display:flex;gap:8px;justify-self:end}
#act{grid-column:2;grid-row:2;position:relative;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc07a,#f08a32 60%,#c8641a);color:#1a1006;font-weight:900;font-size:15px;letter-spacing:.04em;box-shadow:0 8px 22px rgba(240,138,50,.35),inset 0 -5px 0 rgba(0,0,0,.18)}
#act.red{background:radial-gradient(circle at 35% 30%,#ff9a8a,#e0574a 60%,#a83a30)}#act.on{transform:scale(.95)}
#act svg{position:absolute;inset:0;transform:rotate(-90deg)}#act circle{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:289;stroke-dashoffset:289;stroke-linecap:round;opacity:.9}
#jump{grid-column:1;grid-row:2;width:58px;height:58px;border-radius:50%;background:rgba(18,21,26,.7);display:grid;place-items:center;margin-bottom:6px}#jump svg{width:24px;height:24px}
body.pc #jump,body.pc #joyHint{display:none}body.pc #act{display:none}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}#joy i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55)}
#joyHint{position:absolute;left:calc(40px + var(--safe-l));bottom:calc(50px + var(--safe-b));width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:11px;font-weight:800;letter-spacing:.1em}
#sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);height:min(560px,88vh);background:rgba(22,25,31,.95);border-radius:22px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}#sheet .tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}#sheet .tabs::-webkit-scrollbar{display:none}
#sheet .tabs button{padding:8px 13px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}#sheet .tabs button.on{background:var(--orange);color:#1a1006}#sheet .ttl{font-size:17px;padding:4px 6px}
#sheet .x{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);font-size:16px;font-weight:900}
#sheet .body{flex:1;overflow-y:auto;padding:12px 16px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
h4{margin:14px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}h3{margin:4px 0}.mut{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bcard{background:rgba(255,255,255,.05);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}.bcard.sel{border-color:var(--orange)}.bcard.lock{opacity:.4}
.bcard .bi{height:74px;border-radius:10px;background:linear-gradient(160deg,#3a4a5a,#232a33);display:grid;place-items:center;overflow:hidden}.bcard .bi img{width:100%;height:100%;object-fit:contain}
.bcard b{font-size:13px}.bcard small{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;color:#cfd5db}.bcard small .no{color:#ff8a7a}.bcard small.lk{color:var(--muted)}.bcard p{margin:0;font-size:11px;color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}.slot{background:rgba(255,255,255,.06);border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:2px;text-align:left}.slot b{font-size:16px}.slot span{font-size:11px;color:var(--muted)}.slot .sw{width:18px;height:18px}
.crafts{display:flex;flex-direction:column;gap:6px}.craft{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}.craft.off{opacity:.55}.cr{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px}.cr i{color:var(--muted);font-style:normal;font-weight:900}.cb{display:flex;gap:6px}
.it{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;font-size:13px}.btn:disabled{opacity:.35}.btn.gold{background:var(--orange);color:#1a1006}.btn.red{background:var(--red)}.btn.big{padding:12px 18px;font-size:14px}.btn.sm{padding:5px 10px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.msh{background:linear-gradient(135deg,rgba(240,138,50,.18),rgba(63,196,174,.12));border-radius:16px;padding:12px 14px}.msh small{color:var(--orange);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}.msh p{margin:4px 0 0;font-size:12.5px;color:#d6dbe0}
.need{display:grid;grid-template-columns:1fr 1.4fr auto;align-items:center;gap:4px 10px;padding:8px 2px;border-bottom:1px solid var(--line)}.need small{grid-column:1/4;color:var(--muted);font-size:11px}.need em{font-style:normal;font-weight:800}
.bar,.prog{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.bar i,.prog i{display:block;height:100%;background:var(--teal);border-radius:4px}.prog{margin:8px 0}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);opacity:.55}.mrow.cur{opacity:1}.mrow.done{opacity:.8}.mrow b{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}.mrow.done b{background:#3a9a5a}.mrow.cur b{background:var(--orange);color:#1a1006}.mrow span{display:flex;flex-direction:column;font-weight:700}.mrow small{font-weight:500;color:var(--muted);font-size:11.5px}
.status{padding:8px 12px;border-radius:12px;font-weight:800;background:rgba(255,255,255,.08)}.status.good{background:rgba(90,208,106,.2);color:#9af0a8}.status.warn{background:rgba(240,180,50,.18);color:#ffd27a}.status.bad{background:rgba(224,87,74,.22);color:#ffaa9a}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.rec{text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;border:2px solid transparent;display:flex;flex-direction:column;gap:3px}.rec.on{border-color:var(--teal);background:rgba(63,196,174,.12)}.rec.lock{opacity:.35}.rec span{font-size:11.5px;color:#cfd5db;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.rec small{color:var(--muted);font-size:11px}
.bufs{display:flex;flex-direction:column;gap:6px}.buf{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:7px 10px}.buf .it{flex:1}
.st{width:100%;border-collapse:collapse;font-size:13px}.st th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;padding:4px}.st td{padding:6px 4px;border-bottom:1px solid var(--line)}.pos{color:#8af09a}.neg{color:#ff9a8a}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.set input{width:50%}
#mapc{width:100%;max-width:520px;aspect-ratio:1;border-radius:14px;display:block;margin:0 auto;touch-action:none}
@media (max-height:500px){#act{width:84px;height:84px}#ms{width:180px;padding:7px 10px}.mr{font-size:10.5px}#sheet{height:92vh;width:96vw}.rb{width:40px;height:40px}}
@media (orientation:portrait){#ms{width:170px}}
.ic{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.slot .ic{width:44px;height:44px}.mr .ic{width:18px;height:18px}.rec .ic{width:20px;height:20px}.need .ic,.buf .ic,.craft .ic{width:30px;height:30px}
.slot .ic{width:52px;height:52px}.need .ic,.buf .ic,.craft .ic{width:34px;height:34px}
/* ---- loading screen ---- */
#loading{background:radial-gradient(ellipse at 50% 120%,#3a2a4a 0%,#14161b 60%);overflow:hidden}
#loading .lgbg{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 80%,#fff5,transparent),radial-gradient(1.5px 1.5px at 60% 45%,#fff4,transparent);animation:drift 30s linear infinite}
#loading .lgbg::after{content:'';position:absolute;right:-8vw;top:-10vh;width:44vh;height:44vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0c8a8,#b07070 60%,#6a4a5a);opacity:.5;box-shadow:0 0 80px #f0a07a44}
@keyframes drift{to{transform:translateY(-40px)}}
.lgc{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(240,138,50,.45))}.logo .gear{transform-origin:60px 60px;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#loading .lt{font-weight:900;letter-spacing:.32em;font-size:26px;color:#ece6da;text-align:center;line-height:1.1}#loading .lt span{display:block;color:var(--orange);letter-spacing:.5em;font-size:15px;margin-top:4px}
.lbelt{position:relative;width:260px;height:26px;overflow:hidden}.lrail{position:absolute;left:0;right:0;bottom:2px;height:8px;background:repeating-linear-gradient(90deg,#2c3036 0 10px,#3a3f48 10px 12px);border-top:3px solid #d8a43a;border-radius:2px;animation:belt .5s linear infinite}
@keyframes belt{to{background-position:12px 0}}
.litems i{position:absolute;bottom:13px;width:16px;height:9px;border-radius:2px;background:#b8c0c8;box-shadow:inset 0 -2px 0 #8a929c;animation:ride 4s linear infinite}
.litems i:nth-child(2n){background:#e08a4a;box-shadow:inset 0 -2px 0 #b8683a;height:11px;border-radius:5px}.litems i:nth-child(3n){background:#8a4a3a;border-radius:6px 8px 4px 7px;width:13px}
.litems i:nth-child(1){animation-delay:0s}.litems i:nth-child(2){animation-delay:-.5s}.litems i:nth-child(3){animation-delay:-1s}.litems i:nth-child(4){animation-delay:-1.5s}.litems i:nth-child(5){animation-delay:-2s}.litems i:nth-child(6){animation-delay:-2.5s}.litems i:nth-child(7){animation-delay:-3s}.litems i:nth-child(8){animation-delay:-3.5s}
@keyframes ride{from{left:-20px}to{left:270px}}
#loading .lb{width:260px;height:6px;border-radius:3px;background:#2a2e36}#loading .lb i{transition:width .3s;background:linear-gradient(90deg,#f08a32,#ffc07a)}
#ltip{max-width:min(420px,80vw);text-align:center;color:#c8ced6;font-size:12.5px;min-height:34px;opacity:.85}

.prow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

const WORLD={half:320,step:2,n:0,h:null,nodes:[],flora:[],seed:7};
// lakes: bowls carved into the land with flat water on top
const LAKES=[{x:-135,z:70,r:40},{x:115,z:150,r:32},{x:70,z:-175,r:46},{x:-60,z:-215,r:28}];
function baseHeight(x,z){return rawHeight0(x,z);}
function lakeLevel(L){if(L.level==null){let m=1e9;for(let i=0;i<20;i++){const a=i/20*TAU;m=Math.min(m,rawHeight0(L.x+Math.cos(a)*L.r*1.05,L.z+Math.sin(a)*L.r*1.05));}L.level=m-.6;}return L.level;}
function rawHeight(x,z){let h=rawHeight0(x,z);for(const L of LAKES){const d=Math.hypot(x-L.x,z-L.z);if(d>L.r*1.35)continue;const lv=lakeLevel(L),t=d/L.r;const bowl=lv-.4-5*Math.max(0,1-t*t);const edge=smooth(1,1.35,t);h=lerp(Math.min(h,bowl),h,edge);}return h;}
function lakeAt(x,z){for(const L of LAKES){if(Math.hypot(x-L.x,z-L.z)<L.r*1.2&&ground(x,z)<lakeLevel(L))return L;}return null;}
function rawHeight0(x,z){
 const d=Math.hypot(x,z);
 let h=fbm(x*.0042,z*.0042,5)*34+ridged(x*.009+3,z*.009-7,4)*16-6;
 h+=Math.max(0,fbm(x*.002-11,z*.002+5,3))*60;// big plateaus
 const mesa=smooth(.18,.26,fbm(x*.006+40,z*.006-20,3));h=lerp(h,Math.max(h,22+fbm(x*.03,z*.03,2)*3),mesa*smooth(140,220,d));
 h=lerp(10+fbm(x*.02,z*.02,2)*1.2,h,smooth(46,120,d));// a broad flat landing zone around the HUB
 const e=Math.max(Math.abs(x),Math.abs(z));h+=smooth(WORLD.half-60,WORLD.half,e)*70;// ridges close the map
 return h;}
function buildHeights(){const W=WORLD,n=W.n=Math.round(W.half*2/W.step)+1;W.h=new Float32Array(n*n);
 for(let j=0;j<n;j++)for(let i=0;i<n;i++)W.h[j*n+i]=rawHeight(-W.half+i*W.step,-W.half+j*W.step);}
function ground(x,z){const W=WORLD,n=W.n;let fx=(x+W.half)/W.step,fz=(z+W.half)/W.step;fx=clamp(fx,0,n-1.001);fz=clamp(fz,0,n-1.001);const i=Math.floor(fx),j=Math.floor(fz),u=fx-i,v=fz-j;const H=W.h;
 const a=H[j*n+i],b=H[j*n+i+1],c=H[(j+1)*n+i],d=H[(j+1)*n+i+1];return u+v<1?a+(b-a)*u+(c-a)*v:d+(c-d)*(1-u)+(b-d)*(1-v);}
function groundNormal(x,z){const e=1;const hx=ground(x+e,z)-ground(x-e,z),hz=ground(x,z+e)-ground(x,z-e);return v3.norm([-hx,2*e,-hz]);}
const TERR_COL={grass:COL('#3e9c86'),moss:COL('#6b4f93'),sand:COL('#c9a77f'),rock:COL('#6c6474'),high:COL('#9a8aa8'),dust:COL('#b07a6a')};
function terrainColor(x,z,h,ny){const T=TERR_COL;let c=T.grass;const m=fbm(x*.012+9,z*.012,3);c=mixc(c,T.moss,smooth(.05,.25,m));
 const ds=fbm(x*.008-30,z*.008+12,3);c=mixc(c,T.dust,smooth(.15,.4,ds)*.8);c=mixc(c,T.sand,smooth(9,6,h)*.7);
 c=mixc(c,T.high,smooth(34,52,h));c=mixc(c,T.rock,smooth(.86,.7,ny));return c;}
function buildTerrainMeshes(){const W=WORLD,n=W.n,CH=40;
 for(let cj=0;cj<n-1;cj+=CH)for(let ci=0;ci<n-1;ci+=CH){const ni=Math.min(CH,n-1-ci),nj=Math.min(CH,n-1-cj);const pos=[],nrm=[],col=[],idx=[];
  for(let j=0;j<=nj;j++)for(let i=0;i<=ni;i++){const gi=ci+i,gj=cj+j,x=-W.half+gi*W.step,z=-W.half+gj*W.step,h=W.h[gj*n+gi];pos.push(x,h,z);
   const hl=W.h[gj*n+Math.max(0,gi-1)],hr=W.h[gj*n+Math.min(n-1,gi+1)],hd=W.h[Math.max(0,gj-1)*n+gi],hu=W.h[Math.min(n-1,gj+1)*n+gi];const N=v3.norm([hl-hr,2*W.step,hd-hu]);nrm.push(...N);
   const c=terrainColor(x,z,h,N[1]);col.push(c[0],c[1],c[2],0);}
  for(let j=0;j<nj;j++)for(let i=0;i<ni;i++){const a=j*(ni+1)+i,b=a+ni+1;idx.push(a,b,a+1,a+1,b,b+1);}
  R.terrain.push(makeMesh({pos:new Float32Array(pos),nrm:new Float32Array(nrm),col:new Float32Array(col),idx}));}}

 for(let k=0;k<4;k++)add('limestone',rnd()<.6?1:2,70,220);for(let k=0;k<6;k++)add('coal',k<2?2:rnd()<.5?1:0,120,250);for(let k=0;k<4;k++)add('aurite_ore',k<1?2:1,190,250);for(let k=0;k<5;k++)add('crude_oil',k<1?2:k<3?1:0,140,255);

  for(let k=0;k<10;k++){const a=k/10*TAU+rnd()*.3,r=2.7+rnd()*.5,s=.4+rnd()*.4;g.add(PRIM.ico(s,1,{noise:.35,seed:k+20}),T(Math.cos(a)*r,s*.3,Math.sin(a)*r,rnd()*6,0,0,1,.7,1),'#4a4048');}
  for(let k=0;k<5;k++)g.add(PRIM.sphere(.12+rnd()*.1,6,4),T((rnd()-.5)*3,.1,(rnd()-.5)*3,0,0,0,1,.4,1),COL('#5a4a6a',.3));return g.build();}
 g.add(PRIM.cyl(2.4,2.9,.5,10),T(0,-.2,0),'#4a4250');

 if(type==='aurite_ore'||type==='copper_ore')for(let k=0;k<5;k++){const a=rnd()*TAU;g.add(PRIM.cone(.18,1.2,5),T(Math.cos(a)*1.2,.2,Math.sin(a)*1.2,0,rnd()*.6-.3,rnd()*.6-.3),COL(c,.6));}

 const D=BUILDINGS[b.k];b.conn=(D.ports||[]).map(()=>null);
 const mesh=MODELS.b[b.k];b.obj={mesh,model:T(b.x,b.y,b.z,b.rot),bid:b.id};R.objects.push(b.obj);
 const A=MODELS.anim[b.k];if(A)b.animDef=A;
 FAC.b.set(b.id,b);return b;}
function removeBuilding(b){for(const bid of b.conn)if(bid!=null){const bl=FAC.belts.get(bid);if(bl)removeBelt(bl);const pp=FAC.pipes.get(bid);if(pp)removePipe(pp);}
 S.wires=S.wires.filter(w=>w[0]!==b.id&&w[1]!==b.id);FAC.powerDirty=true;const i=R.objects.indexOf(b.obj);if(i>=0)R.objects.splice(i,1);FAC.b.delete(b.id);}

 const c=isLift(pa.p,pb.p)?liftCurve(pa.p,pa.d,pb.p,[-pb.d[0],0,-pb.d[2]]):beltCurve(pa.p,pa.d,pb.p,[-pb.d[0],0,-pb.d[2]]);const bl={id:o.id??S.nextId++,tier:o.tier||'belt1',from:o.from,to:o.to,items:(o.items||[]).map(([t,d])=>({t,d})),c};
 bl.obj={mesh:beltMesh(c,bl.tier),model:M4.create(),belt:bl.id};R.objects.push(bl.obj);A.conn[o.from[1]]=bl.id;B.conn[o.to[1]]=bl.id;FAC.belts.set(bl.id,bl);return bl;}

// ---- what a building will take in ----
function accepts(b,pi,item){const D=BUILDINGS[b.k];
 if(D.machine){const r=RECIPE[b.recipe];if(!r||!r.in[item])return false;return (b.inb[item]||0)<inCap(r.in[item]);}
 if(b.k==='storage'){let t=0;for(const v of Object.values(b.store))t+=v;return t<D.cap;}
 if(D.pass==='fluid')return false;if(b.k==='splitter'||b.k==='merger'||D.pass)return b.buf.length<2;
 if(D.fuels){if(!D.fuels.includes(item))return false;let t=0;for(const v of Object.values(b.fuel))t+=v;return t<100;}
 if(b.k==='hub')return hubWants(item)>0;
 if(b.k==='skyhook')return skyWants(item)>0;
 return false;}
function give(b,pi,item){const D=BUILDINGS[b.k];if(D.machine)b.inb[item]=(b.inb[item]||0)+1;else if(b.k==='storage')b.store[item]=(b.store[item]||0)+1;else if(b.k==='splitter'||b.k==='merger'||D.pass)b.buf.push(item);else if(D.fuels)b.fuel[item]=(b.fuel[item]||0)+1;else if(b.k==='hub')hubDeliver(item,1);else if(b.k==='skyhook')skyDeliver(item,1);
 FAC.rateIn[item]=(FAC.rateIn[item]||0)+0;}
// ---- belts ----
const beltCanTake=bl=>!bl.items.length||bl.items[bl.items.length-1].d>=1;
function beltPush(bl,item){bl.items.push({t:item,d:0});}
function updateBelt(bl,dt){const v=BELTS[bl.tier].speed,L=bl.c.len,its=bl.items;if(!its.length)return;
 // deliver whatever has reached the end
 const dest=FAC.b.get(bl.to[0]);while(its.length&&its[0].d>=L-.001&&dest&&accepts(dest,bl.to[1],its[0].t)){give(dest,bl.to[1],its[0].t);its.shift();}
 let lim=L;for(const it of its){it.d=Math.min(it.d+v*dt,lim);lim=it.d-1;}}
// ---- one machine step ----
function machineReady(b){const r=RECIPE[b.recipe];if(!r)return false;for(const [k,n] of Object.entries(r.in))if((b.inb[k]||0)<n-1e-6)return false;for(const [k,n] of Object.entries(r.out))if((b.out[k]||0)+n>(isFluid(k)?fluidCap(b,k):outCap(n)))return false;return true;}
function wantsPower(b){const D=BUILDINGS[b.k];if(!D.power)return false;if(D.machine)return machineReady(b);if(b.k==='miner'||b.k==='miner2'){const tot=Object.values(b.out).reduce((a,c)=>a+c,0);return b.node!=null&&tot<50;}if(D.makes)return (b.out[D.makes]||0)<100;return false;}
function pushOut(b,pi,item){const bid=b.conn[pi];if(bid==null)return false;const bl=FAC.belts.get(bid);if(!bl||!beltCanTake(bl))return false;beltPush(bl,item);return true;}
function outPorts(b){const P=BUILDINGS[b.k].ports||[];const o=[];P.forEach((p,i)=>{if(p[3]==='out')o.push(i);});return o;}
function updateBuilding(b,dt){const D=BUILDINGS[b.k];b.run=0;
 if(D.machine){if(b.pf>0&&machineReady(b)){const r=RECIPE[b.recipe];b.prog+=dt*b.pf*(b.clock||1);b.run=1;if(b.prog>=r.t){b.prog-=r.t;for(const [k,n] of Object.entries(r.in)){b.inb[k]-=n;stat('cons',k,n);}for(const [k,n0] of Object.entries(r.out)){const n=n0*(b.amp?2:1);b.out[k]=(b.out[k]||0)+n;stat('prod',k,n);}}}
  for(const pi of outPorts(b))for(const [k,n] of Object.entries(b.out))if(n>=1&&!isFluid(k)&&pushOut(b,pi,k)){b.out[k]--;break;}}
 else if(BUILDINGS[b.k].makes)updateExtractor(b,dt);
 else if(b.k==='miner'||b.k==='miner2'){const nd=WORLD.nodes[b.node];if(nd&&b.pf>0){const rate=D.rate*PURITY[nd.purity].k;const tot=Object.values(b.out).reduce((a,c)=>a+c,0);if(tot<50){b.prog+=dt*b.pf*(b.clock||1);b.run=1;const iv=60/rate;while(b.prog>=iv){b.prog-=iv;b.out[nd.type]=(b.out[nd.type]||0)+1;stat('prod',nd.type,1);}}}
  for(const pi of outPorts(b))for(const [k,n] of Object.entries(b.out))if(n>0&&pushOut(b,pi,k)){b.out[k]--;break;}}
 else if(b.k==='storage'){const keys=Object.keys(b.store).filter(k=>b.store[k]>0);if(keys.length){const k=keys[b.rr++%keys.length];if(pushOut(b,1,k)){b.store[k]--;if(!b.store[k])delete b.store[k];}}}
 else if(b.k==='splitter'){if(b.buf.length){const outs=outPorts(b).filter(i=>b.conn[i]!=null);for(let n=0;n<outs.length&&b.buf.length;n++){const pi=outs[b.rr++%outs.length];if(pushOut(b,pi,b.buf[0])){b.buf.shift();break;}}}}
 else if(b.k==='merger'){if(b.buf.length&&pushOut(b,3,b.buf[0]))b.buf.shift();}
 else if(D.pass&&D.pass!=='fluid'){if(b.buf.length&&pushOut(b,1,b.buf[0]))b.buf.shift();}}
function stat(kind,k,n){const m=FAC.stats[kind];m[k]=(m[k]||0)+n;}
// ---- power ----
// grids: everything joined by power lines. An open power switch doesn't pass power through.
const connsOf=k=>BUILDINGS[k].conns||(k==='pole'?4:2);
const wiresOf=id=>S.wires.filter(w=>w[0]===id||w[1]===id).length;
function rebuildGrids(){const ids=[...FAC.b.keys()],par=new Map(ids.map(i=>[i,i]));const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
 for(const [a,c] of S.wires){const A=FAC.b.get(a),C=FAC.b.get(c);if(!A||!C)continue;if((A.k==='pswitch'&&!A.on)||(C.k==='pswitch'&&!C.on))continue;par.set(f(a),f(c));}
 const g=new Map();for(const id of ids){const r=f(id);if(!g.has(r))g.set(r,[]);g.get(r).push(FAC.b.get(id));}
 FAC.grids=[...g.values()].filter(l=>l.some(b=>BUILDINGS[b.k].gen||BUILDINGS[b.k].power||b.k==='battery'));for(const b of FAC.b.values())b.grid=null;FAC.grids.forEach((l,i)=>{for(const b of l)b.grid=i;});FAC.powerDirty=false;}
function genReady(b){if(b.energy>0)return true;return Object.values(b.fuel).some(v=>v>=1);}
// Satisfactory-style: if machines ask for more than your generators (and batteries) can give, the fuse blows and the whole grid stops
function updatePower(dt){if(FAC.powerDirty)rebuildGrids();FAC.power={use:0,cap:0,want:0,tripped:false};FAC.gridStat=[];
 for(const b of FAC.b.values())b.pf=0;
 FAC.grids.forEach((list,gi)=>{let want=0,cap=0,store=0,storeMax=0;const tripped=list.some(b=>b.tripped);
  for(const b of list){const D=BUILDINGS[b.k];if(D.power&&wantsPower(b))want+=D.power*Math.pow(b.clock||1,1.6)*(b.amp?2:1);if(D.gen&&genReady(b))cap+=D.gen;if(b.k==='battery'){store+=b.charge||0;storeMax+=D.store;}}
  const batt=list.filter(b=>b.k==='battery');const battOut=batt.reduce((a,b)=>a+((b.charge||0)>0?BUILDINGS.battery.rate:0),0);
  let ok=!tripped;FAC.overTs=FAC.overTs||{};if(ok&&want>cap+battOut+.001){FAC.overTs[gi]=(FAC.overTs[gi]||0)+dt;if(FAC.overTs[gi]>.6){for(const b of list)if(BUILDINGS[b.k].gen||b.k==='battery'||b.k==='pole'||b.k==='pole2'||b.k==='pswitch')b.tripped=true;ok=false;FAC.overTs[gi]=0;UI.toast('⚡ Fuse blown! Your machines need '+Math.round(want)+' MW but you only make '+Math.round(cap)+' MW. Add generators, then reset the fuse at a generator.','bad');AUDIO.fuse();}}else if(want<=cap+battOut)FAC.overTs[gi]=0;
  const load=ok&&cap>0?Math.min(1,want/cap):0;
  if(ok)for(const b of list){const D=BUILDINGS[b.k];if(D.power)b.pf=(cap+battOut>0)?1:0;}
  // generators burn only what's needed; spare power charges batteries, shortfalls drain them
  let surplus=ok?Math.max(0,cap-want):0,deficit=ok?Math.max(0,want-cap):0;
  for(const b of list){const D=BUILDINGS[b.k];if(D.gen){b.run=0;if(ok&&genReady(b)){const share=cap>0?D.gen/cap:0;const charge=Math.min(surplus,batt.reduce((a,x)=>a+((x.charge||0)<D.store?BUILDINGS.battery.rate:0),0));let need=(D.gen*load+charge*share)*dt;b.run=Math.min(1,load+(cap>0?charge/cap:0));
     while(need>0){if(b.energy<=0){const k=D.fuels.find(f=>(b.fuel[f]||0)>=1);if(!k)break;b.fuel[k]--;stat('cons',k,1);b.energy+=FUEL[k];}const u=Math.min(need,b.energy);b.energy-=u;need-=u;}}}}
  for(const b of batt){const D=BUILDINGS.battery;b.charge=b.charge||0;if(!ok){b.flow=0;continue;}if(deficit>0){const out=Math.min(deficit,D.rate,b.charge/dt);b.charge-=out*dt;deficit-=out;b.flow=-out;}else{const inn=Math.min(surplus,D.rate,(D.store-b.charge)/dt);b.charge+=inn*dt;surplus-=inn;b.flow=inn;}}
  const st={use:ok?want:0,cap,want,tripped:!ok&&tripped||list.some(b=>b.tripped),store,storeMax};FAC.gridStat[gi]=st;
  FAC.power.use+=st.use;FAC.power.cap+=cap;FAC.power.want+=want;if(st.tripped)FAC.power.tripped=true;});
 // a little history for the power graph
 FAC.histT=(FAC.histT||0)+dt;if(FAC.histT>=1){FAC.histT=0;(FAC.hist=FAC.hist||[]).push([FAC.power.use,FAC.power.cap,FAC.power.want]);if(FAC.hist.length>180)FAC.hist.shift();}}
function resetFuse(b){if(b.grid==null)return;for(const x of FAC.grids[b.grid]||[])x.tripped=false;FAC.overTs={};UI.toast('Fuse reset','good');AUDIO.place();}
// ---- one simulation step ----
function simStep(dt){updatePower(dt);for(const bl of FAC.belts.values())updateBelt(bl,dt);for(const pp of FAC.pipes.values())updatePipe(pp,dt);for(const b of FAC.b.values())updateBuilding(b,dt);

  for(const kind of ['prod','cons']){const m=FAC.stats[kind],r=kind==='prod'?FAC.rate:FAC.rateIn;for(const k of new Set([...Object.keys(m),...Object.keys(r)]))r[k]=lerp(r[k]||0,(m[k]||0)*60/FAC.statT,.5);FAC.stats[kind]={};}FAC.statT=0;}}

// ===== Fluids: pipes, extractors, tanks =====
FAC.pipes=new Map();
const isFluid=k=>!!(ITEMS[k]&&ITEMS[k].fluid);
const fluidCap=(b,k)=>{const D=BUILDINGS[b.k];if(b.k==='tank')return D.cap;if(D.machine){const r=RECIPE[b.recipe];if(!r)return 0;return Math.max(50,(r.in[k]||r.out[k]||0)*6);}if(D.gen)return 100;if(D.pass)return 20;if(D.makes)return 100;return 0;};
function fluidAccepts(b,k){const D=BUILDINGS[b.k];if(D.machine){const r=RECIPE[b.recipe];if(!r||!r.in[k])return 0;return Math.max(0,fluidCap(b,k)-(b.inb[k]||0));}
 if(D.gen){if(!D.fuels.includes(k))return 0;return Math.max(0,100-(b.fuel[k]||0));}
 if(b.k==='tank'||D.pass){const cur=Object.keys(b.store).find(x=>b.store[x]>.001);if(cur&&cur!==k)return 0;return Math.max(0,fluidCap(b,k)-(b.store[k]||0));}return 0;}
function fluidGive(b,k,n){const D=BUILDINGS[b.k];if(D.machine)b.inb[k]=(b.inb[k]||0)+n;else if(D.gen)b.fuel[k]=(b.fuel[k]||0)+n;else{b.store[k]=(b.store[k]||0)+n;}}
// what a building can push into a pipe right now
function fluidOut(b){const D=BUILDINGS[b.k];if(b.k==='tank'||D.pass){const k=Object.keys(b.store).find(x=>b.store[x]>.001);return k?[k,b.store[k]]:null;}for(const [k,v] of Object.entries(b.out))if(isFluid(k)&&v>.001)return [k,v];return null;}
function fluidTake(b,k,n){const D=BUILDINGS[b.k];if(b.k==='tank'||D.pass){b.store[k]-=n;if(b.store[k]<=.001)delete b.store[k];}else b.out[k]-=n;}
function newPipe(o){const A=FAC.b.get(o.from[0]),B=FAC.b.get(o.to[0]);if(!A||!B)return null;const pa=portWorld(A,o.from[1]),pb=portWorld(B,o.to[1]);
 const c=beltCurve(pa.p,pa.d,pb.p,[-pb.d[0],0,-pb.d[2]]);const pp={id:o.id??S.nextId++,tier:o.tier||'pipe1',from:o.from,to:o.to,c,flow:0,fluid:o.fluid||null,phase:0};
 pp.obj={mesh:pipeMesh(c,pp.tier),model:M4.create(),pipe:pp.id};R.objects.push(pp.obj);A.conn[o.from[1]]=pp.id;B.conn[o.to[1]]=pp.id;FAC.pipes.set(pp.id,pp);return pp;}
function removePipe(pp){const A=FAC.b.get(pp.from[0]),B=FAC.b.get(pp.to[0]);if(A)A.conn[pp.from[1]]=null;if(B)B.conn[pp.to[1]]=null;const i=R.objects.indexOf(pp.obj);if(i>=0)R.objects.splice(i,1);freeMesh(pp.obj.mesh);FAC.pipes.delete(pp.id);}
function updatePipe(pp,dt){const A=FAC.b.get(pp.from[0]),B=FAC.b.get(pp.to[0]);if(!A||!B){pp.flow=0;return;}const o=fluidOut(A);let moved=0;
 if(o){const [k,have]=o;const cap=PIPES[pp.tier].rate/60*dt;moved=Math.min(cap,have,fluidAccepts(B,k));if(moved>0){fluidTake(A,k,moved);fluidGive(B,k,moved);pp.fluid=k;}}
 pp.flow=lerp(pp.flow,moved/dt*60,Math.min(1,dt*3));pp.phase+=pp.flow/60*dt;}
// extractors pump like miners
function updateExtractor(b,dt){const D=BUILDINGS[b.k];b.run=0;const k=D.makes;let rate=D.rate;if(b.k==='oilx'){const nd=WORLD.nodes[b.node];if(!nd)return;rate*=PURITY[nd.purity].k;}
 if(b.pf>0&&(b.out[k]||0)<100){b.run=1;const add=rate/60*dt*b.pf*(b.clock||1);b.out[k]=(b.out[k]||0)+add;b.acc=(b.acc||0)+add;if(b.acc>=1){stat('prod',k,Math.floor(b.acc));b.acc-=Math.floor(b.acc);}}}
// glowing pulses riding the top of each pipe show what's flowing and how fast
function fillPulses(){const I=MODELS.pulseInst;if(!I)return;I.n=0;for(const pp of FAC.pipes.values()){if(pp.flow<1||!pp.fluid)continue;if(!inFrustum(pp.obj.mesh.center,pp.obj.mesh.radius+1))continue;if(Math.hypot(pp.obj.mesh.center[0]-R.cam[0],pp.obj.mesh.center[2]-R.cam[2])>150)continue;
  const c=COL(ITEMS[pp.fluid].c);const gap=1.2;const off=(pp.phase*1.5)%gap;for(let s=off;s<pp.c.len;s+=gap){if(I.n>=I.max)break;const q=curveAt(pp.c,s);const o=I.n*8,a=I.data;a[o]=q.p[0];a[o+1]=q.p[1]+.26;a[o+2]=q.p[2];a[o+3]=.5+Math.min(.6,pp.flow/600);a[o+4]=c[0]*1.6+.15;a[o+5]=c[1]*1.6+.15;a[o+6]=c[2]*1.6+.15;a[o+7]=q.yaw;I.n++;}}}

function bLocal(b,x,z){const c=Math.cos(b.rot),s=Math.sin(b.rot),dx=x-b.x,dz=z-b.z;return [c*dx-s*dz,s*dx+c*dz];}
// height of a building's walkable top at a local point (null = you can't stand there)
function bTop(b,lx,lz){const D=BUILDINGS[b.k];if(D.surf==='ramp')return b.y+D.rise*clamp(lz/D.d+.5,0,1);if(D.surf==='deck')return b.y+(D.top||D.h);if(b.k==='hub')return b.y+.5;if(b.k==='pole'||b.k==='cpole'||b.k==='cpoleT')return null;return b.y+D.h;}
function solidAt(x,z,y){let top=ground(x,z);{const L=lakeAt(x,z);if(L)top=Math.max(top,lakeLevel(L)-1.2);}for(const b of FAC.b.values()){const D=BUILDINGS[b.k];if(Math.abs(b.x-x)>10||Math.abs(b.z-z)>10)continue;const [lx,lz]=bLocal(b,x,z);const mg=D.tops?3.4:0;if(Math.abs(lx)>D.w/2+mg||Math.abs(lz)>D.d/2+mg)continue;if(D.tops){for(const t of D.tops)if(lx>=t[0]&&lx<=t[2]&&lz>=t[1]&&lz<=t[3]){const h=b.y+t[4];if(h<=y+(t[4]<=1?1.15:.6)&&h>top)top=h;}continue;}const h=bTop(b,lx,lz);if(h!=null&&h<=y+.6&&h>top)top=h;}return top;}
function blockedAt(x,z,y){for(const b of FAC.b.values()){const D=BUILDINGS[b.k];if(Math.abs(b.x-x)>10||Math.abs(b.z-z)>10)continue;const [lx,lz]=bLocal(b,x,z);if(D.walls){if(Math.abs(lx)>D.w/2+3.6||Math.abs(lz)>D.d/2+3.6)continue;for(const w of D.walls)if(Math.abs(lx-w[0])<w[2]+.3&&Math.abs(lz-w[1])<w[3]+.3&&y<b.y+w[4]-.5&&y+1.8>b.y+.4)return true;for(const t of D.tops)if(t[4]<=1&&lx>=t[0]-.3&&lx<=t[2]+.3&&lz>=t[1]-.3&&lz<=t[3]+.3&&b.y+t[4]>y+1.15&&y+1.8>b.y-4)return true;continue;}let hw=D.w/2+.3,hd=D.d/2+.3;if(b.k==='pole'||b.k==='cpole'||b.k==='cpoleT'){hw=hd=.45;}
  if(Math.abs(lx)>hw||Math.abs(lz)>hd)continue;
  if(D.surf==='ramp'||D.surf==='deck'){const h=bTop(b,clamp(lx,-D.w/2,D.w/2),clamp(lz,-D.d/2,D.d/2));const under=D.surf==='deck'&&D.top>2?b.y+D.top-.4:b.y;if(y<h-.6&&y+1.8>under)return true;continue;}
  const top=b.y+(b.k==='hub'?.5:D.h);if(y<top-.5&&y+1.8>b.y)return true;}
 for(const f of WORLD.flora)if(f.alive&&f.kind!=='bush'&&Math.abs(f.x-x)<2&&Math.abs(f.z-z)<2&&Math.hypot(f.x-x,f.z-z)<(f.kind==='rock'?1.1:.5)*f.s)return true;
 return false;}
function updatePlayer(dt){let mx=INPUT.jx,my=INPUT.jy;const k=INPUT.keys;if(k.KeyW||k.ArrowUp)my=1;if(k.KeyS||k.ArrowDown)my=-1;if(k.KeyA||k.ArrowLeft)mx=-1;if(k.KeyD||k.ArrowRight)mx=1;
 if(UI.panel){mx=my=0;}const run=k.ShiftLeft||Math.hypot(INPUT.jx,INPUT.jy)>.98;const sp=(run?9:5.2)*Math.min(1,Math.hypot(mx,my));

 const lim=WORLD.half-8;nx=clamp(nx,-lim,lim);nz=clamp(nz,-lim,lim);

 playerExtras(dt);if(zipStep(dt)){PL.speed=0;R.yaw=PL.yaw;R.pitch=PL.pitch;PL.camY=PL.y+PL.eye;R.cam=[PL.x,PL.camY,PL.z];return;}
 const wasGround=PL.ground;PL.vy-=24*dt;PL.y+=PL.vy*dt;const top=solidAt(PL.x,PL.z,PL.y);

 else if(wasGround&&PL.vy<=0&&PL.y-top<.6){PL.y=top;PL.vy=0;PL.ground=true;}// stick to the ground walking downhill instead of hopping

function rayGround(o,d,maxT=60){let t=0,prev=o[1]-ground(o[0],o[2]);for(let i=0;i<240&&t<maxT;i++){t+=.25+t*.02;const x=o[0]+d[0]*t,y=o[1]+d[1]*t,z=o[2]+d[2]*t,h=y-ground(x,z);if(h<0){// refine

function portUnderAim(fluid){fluid=!!fluid;const {o,d}=aimRay();let best=null;for(const b of FAC.b.values()){const P=BUILDINGS[b.k].ports||[];if(Math.hypot(b.x-o[0],b.z-o[2])>40)continue;for(let i=0;i<P.length;i++){if((P[i][3][0]==='f')!==fluid)continue;const w=portWorld(b,i);const c=[w.p[0],w.p[1]+.3,w.p[2]];const v=v3.sub(c,o),t=v3.dot(v,d);if(t<0||t>28)continue;const q=[o[0]+d[0]*t-c[0],o[1]+d[1]*t-c[1],o[2]+d[2]*t-c[2]];const e=Math.hypot(...q);if(e<1.1+t*.03&&(!best||e/(1+t*.05)<best.e))best={b,i,e:e/(1+t*.05),w,t};}}return best;}
function beltCheck(A,B){if(!A||!B)return 'Pick two ports';if(A.b===B.b)return 'Pick a port on another building';const a=A.w.io,b=B.w.io;if(a===b)return a==='in'?'Both are inputs: connect an output to an input':'Both are outputs: connect an output to an input';
 if(A.b.conn[A.i]!=null||B.b.conn[B.i]!=null)return 'That port is already connected';const o=a==='out'?A:B,i=a==='out'?B:A;const lift=isLift(o.w.p,i.w.p);const c=lift?liftCurve(o.w.p,o.w.d,i.w.p,[-i.w.d[0],0,-i.w.d[2]]):beltCurve(o.w.p,o.w.d,i.w.p,[-i.w.d[0],0,-i.w.d[2]]);
 if(c.len>60)return 'Too long: belts reach up to 60 m';const dy=Math.abs(i.w.p[1]-o.w.p[1]),dh=Math.hypot(i.w.p[0]-o.w.p[0],i.w.p[2]-o.w.p[2]);if(!lift&&dy>dh*.7+1)return 'Too steep: bring the ports closer together (within 3 m sideways) to make a conveyor lift';
 const B_=BELTS[BUILD.beltTier],n=Math.max(1,Math.ceil(c.len/B_.per));if(!canAfford(B_.cost,n))return 'Needs '+costText(B_.cost,n);return {o,i,c,n};}
// aiming at open ground while dragging a belt drops a conveyor pole there and carries on from it
function freePole(){const A=BUILD.beltA;if(!A)return null;const {o,d}=aimRay();const hg=rayGround(o,d,30);if(!hg)return null;const x=Math.round(hg.p[0]*2)/2,z=Math.round(hg.p[2]*2)/2;
 const fromOut=A.w.io==='out';const dx=x-A.w.p[0],dz=z-A.w.p[2];if(Math.hypot(dx,dz)<2)return null;const rot=Math.atan2(dx,dz)+(fromOut?0:Math.PI);
 const tall=BUILD.tallPole&&unlocked(BUILDINGS.cpoleT);const k=tall?'cpoleT':'cpole';const fake={k,x,y:ground(x,z),z,rot,conn:[null,null],id:-1};const P={b:fake,i:fromOut?0:1,w:portWorld(fake,fromOut?0:1)};return {fake,P,k};}
function beltAction(){const portUnderAim=()=>portUnderAimB();const P=portUnderAim();if(!BUILD.beltA){// upgrading an existing belt by building over it
  if(!P){const hb=rayBelts(aimRay().o,aimRay().d);if(hb)return upgradeBelt(hb.bl);UI.toast('Aim at a port (the framed openings on buildings)','info');return;}
  if(P.b.conn[P.i]!=null){const bl=FAC.belts.get(P.b.conn[P.i]);if(bl)return upgradeBelt(bl);}BUILD.beltA=P;AUDIO.click();UI.hint(touchMode?'Now aim at the other port and tap Connect':'Now click the other port');return;}
 if(!P){const fp_=freePole();if(!fp_){UI.toast('Aim at a port, or at open ground nearby to drop a conveyor pole','info');return;}const D=BUILDINGS[fp_.k];if(!unlocked(D)){UI.toast('Conveyor poles are not unlocked yet','warn');return;}
  const r=beltCheck(BUILD.beltA,fp_.P);if(typeof r==='string'){UI.toast(r,'warn');AUDIO.bad();return;}if(!canAfford(D.cost)||!canAfford(mergeCost(BELTS[BUILD.beltTier].cost,r.n,D.cost))){UI.toast('Needs '+costText(BELTS[BUILD.beltTier].cost,r.n)+' + '+costText(D.cost),'warn');AUDIO.bad();return;}
  pay(D.cost);const pb=newBuilding({k:fp_.k,x:fp_.fake.x,y:fp_.fake.y,z:fp_.fake.z,rot:fp_.fake.rot});clearFloraAround(pb);const fromOut=BUILD.beltA.w.io==='out';
  pay(BELTS[BUILD.beltTier].cost,r.n);if(fromOut)newBelt({tier:BUILD.beltTier,from:[BUILD.beltA.b.id,BUILD.beltA.i],to:[pb.id,0]});else newBelt({tier:BUILD.beltTier,from:[pb.id,1],to:[BUILD.beltA.b.id,BUILD.beltA.i]});
  BUILD.beltA={b:pb,i:fromOut?1:0,w:portWorld(pb,fromOut?1:0)};if(BUILD.ghostBelt){freeMesh(BUILD.ghostBelt.mesh);BUILD.ghostBelt=null;}AUDIO.place();saveSoon();return;}
 const r=beltCheck(BUILD.beltA,P);if(typeof r==='string'){UI.toast(r,'warn');AUDIO.bad();return;}const B_=BELTS[BUILD.beltTier];pay(B_.cost,r.n);
 newBelt({tier:BUILD.beltTier,from:[r.o.b.id,r.o.i],to:[r.i.b.id,r.i.i]});BUILD.beltA=null;if(BUILD.ghostBelt){freeMesh(BUILD.ghostBelt.mesh);BUILD.ghostBelt=null;}AUDIO.place();saveSoon();UI.hint(touchMode?'Belt built. Aim at another port to keep going':'Belt built. Click another port to keep going');}
function upgradeBelt(bl){const cur=BELTS[bl.tier].mk,nw=BELTS[BUILD.beltTier];if(nw.mk<=cur){UI.toast('Select a higher belt tier to upgrade this one','info');return;}const n=Math.max(1,Math.ceil(bl.c.len/nw.per));if(!canAfford(nw.cost,n)){UI.toast('Upgrade needs '+costText(nw.cost,n),'warn');return;}
 pay(nw.cost,n);refund(BELTS[bl.tier].cost,Math.max(1,Math.ceil(bl.c.len/BELTS[bl.tier].per)));const items=bl.items.map(it=>[it.t,it.d]);removeBelt(bl);newBelt({id:bl.id,tier:BUILD.beltTier,from:bl.from,to:bl.to,items});AUDIO.place();UI.toast('Upgraded to '+nw.n,'good');saveSoon();}

 if(A.b.conn[A.i]!=null||B.b.conn[B.i]!=null)return 'That connection is already used';const o=a==='fout'?A:B,i=a==='fout'?B:A;const c=pipeCurve(o,i);if(c.len>60)return 'Too long: pipes reach up to 60 m';
 const dy=Math.abs(i.w.p[1]-o.w.p[1]),dh=Math.hypot(i.w.p[0]-o.w.p[0],i.w.p[2]-o.w.p[2]);if(dy>dh*1.2+1)return 'Too steep for a pipe';const P_=PIPES[BUILD.pipeTier],n=Math.max(1,Math.ceil(c.len/P_.per));if(!canAfford(P_.cost,n))return 'Needs '+costText(P_.cost,n);return {o,i,c,n};}
function freeSupport(){const A=BUILD.pipeA;if(!A)return null;const {o,d}=aimRay();const hg=rayGround(o,d,30);if(!hg)return null;const x=Math.round(hg.p[0]*2)/2,z=Math.round(hg.p[2]*2)/2;const fromOut=A.w.io==='fout';const dx=x-A.w.p[0],dz=z-A.w.p[2];if(Math.hypot(dx,dz)<2)return null;
 const rot=Math.atan2(dx,dz)+(fromOut?0:Math.PI);const fake={k:'psupport',x,y:ground(x,z)+(BUILD.dy||0),z,rot,conn:[null,null],id:-1};return {fake,P:{b:fake,i:fromOut?0:1,w:portWorld(fake,fromOut?0:1)}};}

 if(!P){const f=freeSupport();if(!f){UI.toast('Aim at a pipe connection, or open ground to drop a support','info');return;}const r=pipeCheck(BUILD.pipeA,f.P);if(typeof r==='string'){UI.toast(r,'warn');AUDIO.bad();return;}const D=BUILDINGS.psupport;if(!canAfford(mergeCost(PIPES[BUILD.pipeTier].cost,r.n,D.cost))){UI.toast('Not enough parts','warn');return;}

function upgradePipe(pp){const cur=PIPES[pp.tier].mk,nw=PIPES[BUILD.pipeTier];if(nw.mk<=cur){UI.toast('Select a higher pipe tier to upgrade this one','info');return;}const n=Math.max(1,Math.ceil(pp.c.len/nw.per));if(!canAfford(nw.cost,n)){UI.toast('Upgrade needs '+costText(nw.cost,n),'warn');return;}pay(nw.cost,n);refund(PIPES[pp.tier].cost,Math.max(1,Math.ceil(pp.c.len/PIPES[pp.tier].per)));removePipe(pp);newPipe({id:pp.id,tier:BUILD.pipeTier,from:pp.from,to:pp.to,fluid:pp.fluid});AUDIO.place();UI.toast('Upgraded to '+nw.n,'good');saveSoon();}
function rayPipes(o,d,maxT=30){let best=null;for(const pp of FAC.pipes.values()){const m=pp.obj.mesh;const tc=v3.dot(v3.sub(m.center,o),d);if(tc<0||tc>maxT+m.radius)continue;for(let i=0;i<pp.c.pts.length;i+=2){const p=pp.c.pts[i];const t=v3.dot(v3.sub(p,o),d);if(t<0||t>maxT)continue;const q=[o[0]+d[0]*t-p[0],o[1]+d[1]*t-p[1],o[2]+d[2]*t-p[2]];if(Math.hypot(...q)<.6&&(!best||t<best.t))best={t,pp};}}return best;}

function dismantle(){const t=BUILD.target;if(!t){UI.toast('Aim at something to remove','info');return;}
 if(t.pipe){const pp=t.pipe;refund(PIPES[pp.tier].cost,Math.max(1,Math.ceil(pp.c.len/PIPES[pp.tier].per)));removePipe(pp);}
 else if(t.wire){const A=FAC.b.get(t.wire[0]),B=FAC.b.get(t.wire[1]);if(A&&B)refund(wireCost(wireLen(A,B)));S.wires=S.wires.filter(w=>w!==t.wire);FAC.powerDirty=true;}
 else if(t.belt){const bl=t.belt;refund(BELTS[bl.tier].cost,Math.max(1,Math.ceil(bl.c.len/BELTS[bl.tier].per)));for(const it of bl.items)addInv(it.t,1);removeBelt(bl);}
 else{const b=t.b,D=BUILDINGS[b.k];for(const bid of b.conn)if(bid!=null){const bl=FAC.belts.get(bid);if(bl){refund(BELTS[bl.tier].cost,Math.max(1,Math.ceil(bl.c.len/BELTS[bl.tier].per)));for(const it of bl.items)addInv(it.t,1);}}
  refund(D.cost);if(b.amp)addInv('res_core',1);for(const m of [b.inb,b.out,b.store,b.fuel])for(const [k,v] of Object.entries(m))if(v>0)addInv(k,v);for(const it of b.buf)addInv(it,1);
  // things standing on a foundation come down with it would be confusing: block instead

  removeBuilding(b);}
 AUDIO.remove();saveSoon();}

const HAND={t:0,what:null};
function handTarget(){const {o,d}=aimRay();const n=rayNodes(o,d,7),f=rayFlora(o,d,6),b=rayBuildings(o,d,9);let best=null;
 if(n)best={kind:'node',t:n.t,nd:n.nd};if(f&&(!best||f.t<best.t))best={kind:'flora',t:f.t,f:f.f};if(b&&(!best||b.t<best.t))best={kind:'building',t:b.t,b:b.b};
 const c=rayCreatures(o,d,7),pd=rayPods(o,d,9),cr=rayCores(o,d,7),sp=spotUnderAim(o,d);
 if(c&&(!best||c.t<best.t))best={kind:'creature',t:c.t,c:c.c};if(pd&&(!best||pd.t<best.t+.5))best={kind:'pod',t:pd.t,p:pd.p};if(cr&&(!best||cr.t<best.t+.5))best={kind:'core',t:cr.t,c:cr.c};
 if(sp&&(!best||best.kind==='building'||sp.t<best.t+.3))best={kind:'spot',t:sp.t,b:sp.b,s:sp.s};return best;}
function spotPos(b,s){const c=Math.cos(b.rot),sn=Math.sin(b.rot);return [b.x+c*s.x+sn*s.z,b.y+s.y,b.z-sn*s.x+c*s.z];}
function spotUnderAim(o,d){let best=null;for(const b of FAC.b.values()){const D=BUILDINGS[b.k];if(!D.spots||Math.abs(b.x-o[0])>16||Math.abs(b.z-o[2])>16)continue;for(const s of D.spots){const p=spotPos(b,s);const w=v3.sub(p,o);const t=v3.dot(w,d);if(t<0||t>3.6)continue;const q=[o[0]+d[0]*t-p[0],o[1]+d[1]*t-p[1],o[2]+d[2]*t-p[2]];if(Math.hypot(...q)<.95&&(!best||t<best.t))best={t,b,s};}}return best;}
function updateHand(dt,holding){const t=handTarget();HAND.what=t;if(holding&&t&&t.kind==='creature'){zap(t.c);HAND.t=0;return;}if(!holding||!t||t.kind==='building'||t.kind==='spot'||t.kind==='pod'||t.kind==='creature'){HAND.t=0;return;}
 if(t.kind==='core'){HAND.t+=dt;if(HAND.t>=1.2){HAND.t=0;takeCore(t.c);}return;}
 HAND.t+=dt;const need=t.kind==='node'?.55/(t.nd.purity===2?1.4:1):.9;if(HAND.t>=need){HAND.t=0;
  if(t.kind==='node'){addInv(t.nd.type,1);AUDIO.mine();FX.chips(t.nd,ITEMS[t.nd.type].c);UI.pop('+1 '+ITEMS[t.nd.type].n);}
  else{const f=t.f;f.alive=false;S.chopped.push(f.i);refreshFlora();if(f.kind==='slug'){addInv('slug',1);UI.pop('+1 Power slug');AUDIO.fanfare();FX.puff(f.x,f.y+.5,f.z,COL('#ffd04a',1));return;}if(f.kind==='bush'){addInv('leaves',6);UI.pop('+6 Leaves');}else{addInv('wood',4);addInv('leaves',10);UI.pop('+4 Wood · +10 Leaves');}AUDIO.chop();FX.puff(f.x,f.y+1,f.z,COL(f.pal[f.pal.length-1]));}}}

// ---- milestones ----
const curMilestone=()=>MILESTONES[S.tier]||null;
function hubWants(item){const M=curMilestone();if(!M||!M.need[item])return 0;return M.need[item]-(S.hub[item]||0);}
function hubDeliver(item,n){const M=curMilestone();if(!M)return 0;const k=Math.min(n,hubWants(item));if(k<=0)return 0;S.hub[item]=(S.hub[item]||0)+k;if(Object.entries(M.need).every(([i,v])=>(S.hub[i]||0)>=v))completeMilestone();return k;}
function completeMilestone(){const M=curMilestone();S.tier++;S.hub={};AUDIO.fanfare();UI.banner('Milestone complete: '+M.n,'Unlocked: '+M.unlock+'. '+M.msg);saveSoon();UI.refresh();}
const curPhase=()=>SKYHOOK_PHASES[S.sky.phase]||null;
function skyWants(item){const P=curPhase();if(!P||!P.need[item])return 0;return P.need[item]-(S.sky.got[item]||0);}
function skyDeliver(item,n){const P=curPhase();if(!P)return 0;const k=Math.min(n,skyWants(item));if(k<=0)return 0;S.sky.got[item]=(S.sky.got[item]||0)+k;
 if(Object.entries(P.need).every(([i,v])=>(S.sky.got[i]||0)>=v)){S.sky.phase++;S.sky.got={};AUDIO.fanfare();if(!curPhase()){S.won=true;UI.banner('Mission complete!','The Skyhook is up and the final shipment is in orbit. Your factory is yours to keep growing.');}else UI.banner(P.n+' complete','Next: '+curPhase().n);saveSoon();}return k;}
function deliverFromInv(to){let n=0;const want=to==='sky'?skyWants:hubWants,dl=to==='sky'?skyDeliver:hubDeliver;for(const k of Object.keys(S.inv)){const w=Math.min(want(k),S.inv[k]||0);if(w>0){dl(k,w);addInv(k,-w);n+=w;}}return n;}

 $('#sheet .tabs').innerHTML=UI.bld?`<b class="ttl">${esc(BUILDINGS[UI.bld.k].n)}</b>`:UI.tab==='pod'?'<b class="ttl">Crash site</b>':tabs.map(([k,n])=>`<button class="${UI.tab===k?'on':''}" data-a="tab" data-v="${k}">${n}</button>`).join('');
 const body=$('#sheet .body');body.innerHTML=UI.bld?UI.bldView(UI.bld):(UI.views[UI.tab]||(()=>''))();if(UI.tab==='map'&&!UI.bld)UI.drawMap();UI.drawGraphs();};
UI.liveRefresh=function(){if(UI.bld||UI.tab==='hub'||UI.tab==='stats'){const body=$('#sheet .body');const st=body.scrollTop;const h=UI.bld?UI.bldView(UI.bld):UI.views[UI.tab]();if(body._h!==h){body._h=h;body.innerHTML=h;body.scrollTop=st;}UI.drawGraphs();}};
UI.drawGraphs=function(){for(const c of document.querySelectorAll('.pgraph')){const x=c.getContext('2d'),W=c.width,H=c.height,h=FAC.hist||[];x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.04)';x.fillRect(0,0,W,H);if(h.length<2)continue;const mx=Math.max(10,...h.map(r=>Math.max(r[1],r[2])))*1.15;
 const line=(i,col,fill)=>{x.beginPath();h.forEach((r,j)=>{const px=j/(180-1)*W,py=H-r[i]/mx*H;j?x.lineTo(px,py):x.moveTo(px,py);});if(fill){x.lineTo((h.length-1)/179*W,H);x.lineTo(0,H);x.fillStyle=fill;x.fill();}else{x.strokeStyle=col;x.lineWidth=2.5;x.stroke();}};
 line(1,null,'rgba(63,196,174,.18)');line(1,'#3fc4ae');line(2,'#f2b440');line(0,'#f08a32');x.font='bold 12px system-ui';x.fillStyle='#3fc4ae';x.fillText('Capacity',8,16);x.fillStyle='#f2b440';x.fillText('Demand',80,16);x.fillStyle='#f08a32';x.fillText('Consumption',142,16);x.fillStyle='#9aa3ad';x.fillText(Math.round(mx)+' MW',W-60,16);x.fillText('last 3 min',W-70,H-6);}};
UI.views={
 pod(){return UI.podView();},
 build(){const cats=[['production','Production'],['logistics','Logistics'],['power','Power'],['structure','Structures'],['special','Special']];let h='<div class="cats">';
  h+=`<div class="cat"><h4>Conveyor belts</h4><div class="grid">`+Object.entries(BELTS).map(([k,B])=>card(k,B.n,B.desc,B.cost,unlocked(B),B.tier,BUILD.mode==='belt'&&BUILD.beltTier===k,B.col)).join('')+`</div></div>`;
  h+=`<div class="cat"><h4>Pipelines</h4><div class="grid">`+Object.entries(PIPES).map(([k,B])=>card(k,B.n,B.desc,B.cost,unlocked(B),B.tier,BUILD.mode==='pipe'&&BUILD.pipeTier===k)).join('')+`</div></div>`;
  for(const [c,n] of cats){const list=Object.entries(BUILDINGS).filter(([k,D])=>D.cat===c&&(k!=='hub'||!hubB()));if(!list.length)continue;h+=`<div class="cat"><h4>${n}</h4><div class="grid">`+(c==='power'?`<button class="bcard ${BUILD.mode==='wire'?'sel':''}" data-a="wireTool"><div class="bi">${UI.icons['item:wire']?`<img src="${UI.icons['item:wire']}">`:''}</div><b>Power Line</b><small><span>1 Wire per 6 m</span></small><p>Run power by hand between poles, generators and machines. Up to 30 m.</p></button>`:'')+list.map(([k,D])=>card(k,D.n,D.desc||(D.machine?'Power '+D.power+' MW':''),D.cost,unlocked(D),D.tier,false)).join('')+`</div></div>`;}
  return h+'</div>';
  function card(k,n,desc,cost,ok,tier,sel,col){const aff=canAfford(cost);return `<button class="bcard ${ok?'':'lock'} ${sel?'sel':''}" ${ok?`data-a="pick" data-v="${k}"`:''}><div class="bi">${UI.icons[k]?`<img src="${UI.icons[k]}">`:''}</div><b>${esc(n)}</b>${ok?`<small>${Object.entries(cost).map(([i,v])=>`<span class="${(S.inv[i]||0)>=v?'':'no'}">${v} ${esc(ITEMS[i].n)}</span>`).join('')}</small>`:`<small class="lk">Unlocks at milestone ${tier}</small>`}${ok&&desc?`<p>${esc(desc)}</p>`:''}</button>`;}},
 inv(){const items=Object.entries(S.inv).filter(([,v])=>v>0).sort((a,b)=>Object.keys(ITEMS).indexOf(a[0])-Object.keys(ITEMS).indexOf(b[0]));
  let h=`<h4>Carrying</h4>`+(items.length?`<div class="inv">${items.map(([k,v])=>`<div class="slot">${swatch(k)}<b>${fmt(v)}</b><span>${esc(ITEMS[k].n)}</span></div>`).join('')}</div>`:'<p class="mut">Empty. Mine ore nodes and harvest plants to get started.</p>');
  if(!UI.atBench)return h+`<h4>Crafting</h4><p class="mut">${hubB()?'Walk up to a workbench to craft. Your HUB has one inside, and you can build more (Build, Special).':'Place your HUB first. It has a workbench inside.'}</p>`;
  h+=`<h4>Workbench</h4><p class="mut">Craft parts by hand. Machines do this automatically once you build them.</p><div class="crafts">`+benchRecipes().map(r=>{const can=Object.entries(r.in).every(([k,v])=>(S.inv[k]||0)>=v);const maxN=Math.min(...Object.entries(r.in).map(([k,v])=>Math.floor((S.inv[k]||0)/v)));
   return `<div class="craft ${can?'':'off'}"><div class="cr">${Object.entries(r.in).map(([k,v])=>itemTag(k,v)).join('<i>+</i>')}<i>→</i>${Object.entries(r.out).map(([k,v])=>itemTag(k,v)).join('')}</div><div class="cb"><button class="btn" data-a="craft" data-v="${r.id}:1" ${can?'':'disabled'}>Craft</button><button class="btn" data-a="craft" data-v="${r.id}:10" ${maxN>=2?'':'disabled'}>×${Math.max(2,Math.min(10,maxN))}</button></div></div>`;}).join('')+'</div>';return h;},
 hub(){const M=curMilestone();let h='';if(M){const hb=hubB(),near=UI.atTerminal||(hb&&Math.hypot(hb.x-PL.x,hb.z-PL.z)<14);const can=near&&Object.keys(M.need).some(k=>hubWants(k)>0&&(S.inv[k]||0)>0);h+=`<div class="msh"><small>Milestone ${S.tier+1} of ${MILESTONES.length}</small><h3>${esc(M.n)}</h3><p>Unlocks: ${esc(M.unlock)}</p></div>`+Object.entries(M.need).map(([k,v])=>{const g=S.hub[k]||0;return `<div class="need">${itemTag(k)}<div class="bar"><i style="width:${Math.min(100,g/v*100)}%"></i></div><em>${fmt(g)} / ${fmt(v)}</em><small>you have ${fmt(S.inv[k]||0)}</small></div>`;}).join('')+`<div class="btns"><button class="btn big ${can?'gold':''}" data-a="deliver" data-v="hub" ${can?'':'disabled'}>Deliver from inventory</button></div><p class="mut">${near?'':'Bring the parts to your HUB terminal to deliver them. '}Tip: belt parts into the HUB's delivery dock to deliver them automatically.</p>`;}
  else h+=`<div class="msh"><h3>All milestones complete</h3><p>Build the Skyhook (Build → Special) and feed it the final shipments.</p></div>`;
  h+=UI.researchView();h+=`<h4>Milestones</h4>`+MILESTONES.map((m,i)=>`<div class="mrow ${i<S.tier?'done':i===S.tier?'cur':''}"><b>${i<S.tier?'✓':i+1}</b><span>${esc(m.n)}<small>${esc(m.unlock)}</small></span></div>`).join('');return h;},
 map(){return `<canvas id="mapc" width="640" height="640"></canvas><p class="mut"><span class="it"><i class="sw" style="background:#ff8a3a"></i>Crash site</span> Ore nodes: <span class="it">${Object.entries(NODE_TYPES).map(([k,n])=>`<i class="sw" style="background:${n.c}"></i>${n.n}`).join(' ')}</span></p>`;},
 stats(){const ks=[...new Set([...Object.keys(FAC.rate),...Object.keys(FAC.rateIn)])].filter(k=>(FAC.rate[k]||0)>.05||(FAC.rateIn[k]||0)>.05);
  return `<p class="mut">Average items per minute across your whole factory (updates every 10 s).</p>`+(ks.length?`<table class="st"><tr><th>Item</th><th>Made</th><th>Used</th><th>Net</th></tr>`+ks.map(k=>{const p=FAC.rate[k]||0,c=FAC.rateIn[k]||0,n=p-c;return `<tr><td>${itemTag(k)}</td><td>${p.toFixed(1)}</td><td>${c.toFixed(1)}</td><td class="${n<-.05?'neg':n>.05?'pos':''}">${n>0?'+':''}${n.toFixed(1)}</td></tr>`;}).join('')+'</table>':'<p>Nothing is being made yet.</p>')+`<h4>Power</h4><p>${Math.round(FAC.power?FAC.power.use:0)} MW used of ${Math.round(FAC.power?FAC.power.cap:0)} MW available${FAC.power&&FAC.power.tripped?' · <b class="neg">a fuse has blown: reset it at a generator</b>':''}</p><canvas class="pgraph" width="600" height="150"></canvas>`;},
 menu(){return `<h4>Settings</h4><div class="set"><span>Look sensitivity</span><input type="range" min="0.3" max="2.5" step="0.1" value="${S.settings.sens}" oninput="this.dispatchEvent(new CustomEvent('ff',{bubbles:true}))" data-s="sens"></div>
  <div class="set"><span>Sound</span><button class="btn" data-a="sound">${S.settings.sound?'On':'Off'}</button></div>
  <div class="set"><span>Auto-wire power<small class="mut" style="display:block">Connect new machines to the nearest pole for you</small></span><button class="btn" data-a="autoWire">${S.settings.autoWire?'On':'Off'}</button></div>
  <div class="set"><span>Music</span><button class="btn" data-a="music">${S.settings.music!==false?'On':'Off'}</button></div>
  <div class="set"><span>Peaceful creatures<small class="mut" style="display:block">Creatures never attack you</small></span><button class="btn" data-a="peace">${S.settings.peaceful?'On':'Off'}</button></div>
  <div class="set"><span>Tutorial</span><button class="btn" data-a="tutRestart">${S.tut>=0?'Running':'Restart'}</button></div>
  <div class="set"><span>Graphics</span><button class="btn" data-a="qual">${{auto:'Auto',low:'Low (faster)',high:'High (sharper)'}[S.settings.quality]}</button></div>
  <h4>Game</h4><div class="btns"><button class="btn" data-a="save">Save now</button><button class="btn red" data-a="reset">Start a new game</button></div>
  <p class="mut">${GAME_NAME} · version ${VERSION}. Saves automatically on this device.</p>
  <h4>Controls</h4><p class="mut">${touchMode?'Left thumb: move. Right thumb: look. Big button: mine, harvest, open, place. Tap a building to open it.':'WASD move · Mouse look · Space jump · Shift run · Click: mine, harvest, place · E open · B build · R rotate · X dismantle · Tab inventory · M map · Right-click or Esc cancels'}</p>`;},
};

UI.bldView=function(b){const D=BUILDINGS[b.k];const [st,cls]=bStatus(b);let h=st?`<div class="status ${cls}">${esc(st)}</div>`:'';
 if(D.machine){const r=RECIPE[b.recipe];if(r)h+=`<div class="prog"><i style="width:${(b.prog/r.t*100).toFixed(0)}%"></i></div>`;
  h+=`<h4>Recipe</h4><div class="recs">`+RECIPES.filter(x=>x.m===D.machine&&(!x.alt||(S.alts||{})[x.id])).map(x=>{const ok=unlocked(x);return `<button class="rec ${b.recipe===x.id?'on':''} ${ok?'':'lock'}" ${ok?`data-a="recipe" data-v="${x.id}"`:''}><b>${esc(recipeName(x))}</b><span>${Object.entries(x.in).map(([k,v])=>`${swatch(k)}${(v*60/x.t).toFixed(v*60/x.t%1?1:0)}`).join(' + ')} → ${Object.entries(x.out).map(([k,v])=>`${swatch(k)}${(v*60/x.t).toFixed(v*60/x.t%1?1:0)}/min`).join('')}</span>${ok?'':'<small>Locked</small>'}</button>`;}).join('')+'</div>';
  if(r){h+=`<h4>Input</h4><div class="bufs">`+Object.keys(r.in).map(k=>`<div class="buf">${itemTag(k,isFluid(k)?(b.inb[k]||0).toFixed(1)+' m³':b.inb[k]||0)}${!isFluid(k)&&(S.inv[k]||0)>0?`<button class="btn sm" data-a="put" data-v="${k}">Add ${fmt(Math.min(S.inv[k],inCap(r.in[k])-(b.inb[k]||0)))}</button>`:''}</div>`).join('')+`</div><h4>Output</h4><div class="bufs">`+Object.keys(r.out).map(k=>`<div class="buf">${itemTag(k,isFluid(k)?(b.out[k]||0).toFixed(1)+' m³':Math.floor(b.out[k]||0))}${!isFluid(k)&&(b.out[k]||0)>=1?`<button class="btn sm gold" data-a="take" data-v="${k}">Take</button>`:''}</div>`).join('')+'</div>';}
  h+=UI.clockView(b)+UI.ampView(b);}
 else if(D.makes){const k=D.makes,nd=b.k==='oilx'?WORLD.nodes[b.node]:null;const rate=D.rate*(nd?PURITY[nd.purity].k:1)*(b.clock||1);h+=`<p>${nd?PURITY[nd.purity].n+' crude oil pool · ':''}<b>${Math.round(rate)} m³/min</b> of ${ITEMS[k].n.toLowerCase()}</p><div class="bufs"><div class="buf">${itemTag(k)}<b>${(b.out[k]||0).toFixed(0)} / 100 m³</b></div></div><p class="mut">Pipe it from the round output connection.</p>`+UI.clockView(b);}
 else if(b.k==='tank'){const k=Object.keys(b.store).find(x=>b.store[x]>.01);h+=k?`<div class="bufs"><div class="buf">${itemTag(k)}<b>${b.store[k].toFixed(0)} / ${D.cap} m³</b></div></div><div class="bar"><i style="width:${b.store[k]/D.cap*100}%"></i></div>`:'<p class="mut">Empty</p>';}
 else if(b.k==='miner'||b.k==='miner2'){const nd=WORLD.nodes[b.node];if(nd)h+=`<p>${PURITY[nd.purity].n} ${NODE_TYPES[nd.type].n} node · <b>${D.rate*PURITY[nd.purity].k}/min</b></p>`;h+=`<div class="bufs">`+Object.keys(b.out).map(k=>`<div class="buf">${itemTag(k,b.out[k])}${b.out[k]>0?`<button class="btn sm gold" data-a="take" data-v="${k}">Take</button>`:''}</div>`).join('')+`</div><p class="mut">Uses ${D.power} MW. Belt its output into a smelter.</p>`+UI.clockView(b);}
 else if(b.k==='storage'){const it=Object.entries(b.store).filter(([,v])=>v>0);const tot=it.reduce((a,[,v])=>a+v,0);h+=`<p>${fmt(tot)} / ${fmt(D.cap)} items</p><div class="inv">${it.map(([k,v])=>`<button class="slot" data-a="takeS" data-v="${k}">${swatch(k)}<b>${fmt(v)}</b><span>${esc(ITEMS[k].n)}</span></button>`).join('')||'<p class="mut">Empty</p>'}</div><div class="btns"><button class="btn gold" data-a="takeAll">Take all</button><button class="btn" data-a="putAll">Store everything</button></div>`;}
 else if(b.k==='pswitch'){h+=`<div class="btns"><button class="btn big ${b.on?'gold':'red'}" data-a="flip">${b.on?'ON · tap to switch off':'OFF · tap to switch on'}</button></div><p class="mut">Power only flows through the switch while it is on. ${wiresOf(b.id)}/${connsOf(b.k)} lines.</p>`+UI.gridView(b);}
 else if(b.k==='battery'){const Dd=BUILDINGS.battery;h+=`<p>Charge <b>${Math.round((b.charge||0)/60)} / ${Math.round(Dd.store/60)} MW·min</b></p><div class="bar"><i style="width:${(b.charge||0)/Dd.store*100}%"></i></div><p class="mut">${(b.flow||0)>.1?'Charging '+Math.round(b.flow)+' MW':(b.flow||0)<-.1?'Discharging '+Math.round(-b.flow)+' MW':'Idle'}</p>`+UI.gridView(b);}
 else if(b.k==='pole'||b.k==='pole2'){h+=`<p>${wiresOf(b.id)} of ${connsOf(b.k)} power lines used.</p>`+UI.gridView(b);}
 else if(D.gen){h+=`<p>Up to ${D.gen} MW · burns ${D.fuels.map(f=>ITEMS[f].n.toLowerCase()).join(', ')}</p><div class="bufs">`+D.fuels.map(k=>`<div class="buf">${itemTag(k,b.fuel[k]||0)}<small class="mut">${Math.round(FUEL[k]/D.gen)} s each</small>${(S.inv[k]||0)>0?`<button class="btn sm gold" data-a="fuel" data-v="${k}">Add all</button>`:''}</div>`).join('')+`</div><p class="mut">A generator only burns what your machines need.</p>`+UI.gridView(b);}
 else if(b.k==='hub'){h+=`<p>Your base: living quarters, a workbench and the milestone terminal are inside. Walk in through the front door.</p><div class="btns"><button class="btn gold big" data-a="tab" data-v="hub">Milestones</button></div>`;}
 else if(b.k==='workbench'){h+=`<p>Walk up to it and press Craft to make parts by hand.</p>`;}
 else if(b.k==='skyhook'){const P=curPhase();h+=P?`<h3>${esc(P.n)}</h3>`+Object.entries(P.need).map(([k,v])=>{const g=S.sky.got[k]||0;return `<div class="need">${itemTag(k)}<div class="bar"><i style="width:${Math.min(100,g/v*100)}%"></i></div><em>${fmt(g)} / ${fmt(v)}</em></div>`;}).join('')+`<div class="btns"><button class="btn gold big" data-a="deliver" data-v="sky">Deliver from inventory</button></div>`:'<h3>Mission complete</h3>';}
 else if(b.k==='splitter'||b.k==='merger'||b.k==='foundation'||D.pass||D.surf)h+=`<p>${esc(D.desc||'')}</p>`;
 return h;};
UI.gridView=b=>{if(b.grid==null)return '<p class="mut">Not connected to a power grid.</p>';const g=(FAC.gridStat||[])[b.grid]||{};
 return `<h4>Power grid</h4>${g.tripped?'<div class="status bad">Fuse blown: everything on this grid has stopped</div><div class="btns"><button class="btn gold big" data-a="fuse">Reset fuse</button></div>':''}<div class="pgrid"><div><b>${Math.round(g.use||0)}</b><small>consumption MW</small></div><div><b>${Math.round(g.cap||0)}</b><small>production capacity MW</small></div><div><b>${Math.round(g.want||0)}</b><small>demand MW</small></div>${g.storeMax?`<div><b>${Math.round((g.store||0)/60)}</b><small>stored MW·min</small></div>`:''}</div><canvas class="pgraph" width="600" height="150"></canvas>`;};
UI.clockView=b=>{const D=BUILDINGS[b.k],c=b.clock||1,mx=maxClock();return `<h4>Clock speed</h4><div class="clock"><button class="btn sm" data-a="clock" data-v="-.25">−25</button><button class="btn sm" data-a="clock" data-v="-.05">−5</button><b>${Math.round(c*100)}%</b><button class="btn sm" data-a="clock" data-v=".05">+5</button><button class="btn sm" data-a="clock" data-v=".25">+25</button></div>
 <p class="mut">${(D.power*Math.pow(c,1.6)).toFixed(1)} MW when running. ${mx>1?'Overclocking up to '+Math.round(mx*100)+'% with your '+(S.inv.power_shard||0)+' power shard(s).':'Underclock to save power. Carry power shards (made from power slugs found in the wild) to overclock up to 250%.'}</p>
 <div class="btns"><button class="btn" data-a="copyB">Copy settings</button>${BUILD.clip&&BUILD.clip.k===b.k?'<button class="btn" data-a="pasteB">Paste settings</button>':''}<button class="btn gold" data-a="another">Build another</button></div>`;};
UI.A={wireTool:()=>BUILD.wire(),fuse:()=>{if(UI.bld)resetFuse(UI.bld);UI.refresh();},flip:()=>{const b=UI.bld;b.on=!b.on;FAC.powerDirty=true;AUDIO.flip();UI.refresh();saveSoon();},autoWire:()=>{S.settings.autoWire=!S.settings.autoWire;UI.refresh();saveSoon();},pause:()=>MENU.pause(),clock:v=>{const b=UI.bld;b.clock=Math.round(clamp((b.clock||1)+(+v),.05,maxClock())*100)/100;AUDIO.click();UI.refresh();saveSoon();},
 copyB:()=>{const b=UI.bld;BUILD.clip={k:b.k,recipe:b.recipe,clock:b.clock||1};UI.toast('Settings copied','good');UI.refresh();},
 pasteB:()=>{const b=UI.bld,c=BUILD.clip;if(!c||c.k!==b.k)return;if(c.recipe&&c.recipe!==b.recipe)UI.A.recipe(c.recipe);b.clock=Math.min(c.clock,maxClock());UI.toast('Settings pasted','good');UI.refresh();saveSoon();},
 another:()=>{const b=UI.bld;const D=BUILDINGS[b.k];const k=b.k;const pre={k,recipe:b.recipe,clock:b.clock||1};UI.closePanel();BUILD.start(k);BUILD.preset=pre;BUILD.rot=b.rot;UI.hint('Placing another '+D.n+(b.recipe?' set to '+recipeName(RECIPE[b.recipe]):''));},tab:v=>{if(UI.panel&&UI.tab===v&&!UI.bld){UI.closePanel();return;}UI.open(v);},close:()=>UI.closePanel(),
 pick:v=>{BUILD.start(v);},nudge:v=>{if(v==='0'){BUILD.dy=0;UI._mk='';return;}BUILD.nudge(+v);},zoop:()=>BUILD.cycleZoop(),tallPole:()=>{if(!unlocked(BUILDINGS.cpoleT)){UI.toast('Tall conveyor poles unlock at milestone 2','info');return;}BUILD.tallPole=!BUILD.tallPole;UI._mk='';},rot:()=>BUILD.rotate(1),cancel:()=>BUILD.cancel(),dismantle:()=>BUILD.mode==='dismantle'?BUILD.cancel():BUILD.dismantle(),
 craft:v=>{const [id,n]=v.split(':');const r=RECIPE[id];const max=Math.min(...Object.entries(r.in).map(([k,c])=>Math.floor((S.inv[k]||0)/c)));const m=craft(r,n==='10'?Math.max(1,Math.min(10,max)):1);if(m)UI.pop('+'+Object.entries(r.out).map(([k,c])=>c*m+' '+ITEMS[k].n).join(' '));UI.refresh();saveSoon();},
 deliver:v=>{const n=deliverFromInv(v);if(n){UI.toast('Delivered '+n+' parts','good');AUDIO.craft();}UI.refresh();saveSoon();},
 recipe:v=>{const b=UI.bld;if(!b)return;if(b.recipe!==v){for(const [k,c] of Object.entries(b.inb))if(c>0)addInv(k,c);for(const [k,c] of Object.entries(b.out))if(c>0)addInv(k,c);b.inb={};b.out={};b.prog=0;b.recipe=v;}AUDIO.click();UI.refresh();saveSoon();},
 take:v=>{const b=UI.bld;const n=b.out[v]||0;if(n){addInv(v,n);b.out[v]=0;UI.pop('+'+n+' '+ITEMS[v].n);}UI.refresh();},

 let fog=mix3([.012,.016,.04],mix3([.66,.76,.90],[.86,.5,.4],ss),dayK);const grey=mix3(fog,[.56,.6,.66].map(c=>c*(.25+.75*dayK)),v.cloud*.7);fog=mix3(grey,[.80,.56,.46].map(c=>c*(.3+.7*dayK)),v.dust*.75);

const UPD={start(){setTimeout(()=>this.check(),4000);setInterval(()=>this.check(),5*60000);},async check(){if(location.protocol!=='https:')return;try{const t=await (await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'})).text();const m=t.match(/FFVER@([\d.]+)@/);if(m&&m[1]!==VERSION&&!document.getElementById('updpill')){const b=document.createElement('button');b.id='updpill';b.textContent='Update '+m[1]+' ready · tap to install';b.onclick=()=>{saveGame();location.reload();};document.body.appendChild(b);}}catch(e){}}};
const GAME={started:false};
const setLoad=(f,m)=>{const b=document.getElementById('lbar');if(b)b.style.width=(f*100)+'%';const l=document.getElementById('lmsg');if(l&&m)l.textContent=m;};
GAME.primary=function(down){AUDIO.init();if(!down){INPUT.act=false;return;}if(UI.panel)return;
 if(BUILD.mode)updateBuildMode();
 if(BUILD.mode==='place')return placeBuilding();if(BUILD.mode==='belt')return beltAction();if(BUILD.mode==='dismantle')return dismantle();if(BUILD.mode==='wire')return wireAction();if(BUILD.mode==='pipe')return pipeAction();
 if(GAME.landing)return;const H=handTarget();if(H&&H.kind==='spot'){START.useSpot(H);return;}if(H&&H.kind==='pod'){UI.pod=H.p;UI.open('pod');UI.pod=H.p;UI.refresh();return;}if(H&&H.kind==='creature'){zap(H.c);INPUT.act=true;TOOL.kick=1;return;}if(H&&H.kind==='building'){UI.open('bld',H.b);return;}INPUT.act=true;};
GAME.secondary=()=>{if(BUILD.mode)BUILD.cancel();};
GAME.tapAt=function(sx,sy){if(UI.panel||BUILD.mode)return;const r=screenRay(sx/innerWidth,sy/innerHeight);const h=rayBuildings(r.o,r.d,30);if(h)UI.open('bld',h.b);};
function onKey(c,e){AUDIO.init();if(c==='Tab'){e.preventDefault();UI.A.tab('inv');return;}
 if(c==='Escape'){if(GAME.mode!=='play')return;if(GAME.paused)MENU.resume();else if(UI.panel)UI.closePanel();else if(BUILD.mode)BUILD.cancel();else MENU.pause();return;}
 if(GAME.mode!=='play'||GAME.paused)return;
 if(UI.panel&&c!=='KeyB'&&c!=='KeyM')return;
 if(c==='KeyB'||c==='KeyQ')UI.A.tab('build');else if(c==='KeyM')UI.A.tab('map');else if(c==='KeyR'){if(BUILD.mode==='place')BUILD.rotate(1);}else if(c==='KeyX')UI.A.dismantle();
 else if(c==='KeyT'&&BUILD.mode==='place')BUILD.nudge(1);else if(c==='KeyG'&&BUILD.mode==='place')BUILD.nudge(-1);else if(c==='KeyF'&&BUILD.mode==='place')BUILD.cycleZoop();
 else if(c==='KeyE'){const H=handTarget();if(H&&(H.kind==='spot'||H.kind==='pod'||H.kind==='building'))GAME.primary(true);}else if(c==='KeyH')UI.A.tab('hub');
 else if(/^Digit[1-5]$/.test(c)&&BUILD.mode==='belt'){const k='belt'+c.slice(5);if(unlocked(BELTS[k])){BUILD.beltTier=k;UI._mk='';}}}
function applyQuality(){const q=S.settings.quality;R.maxDPR=q==='low'?1:q==='high'?2:1.5;R.scale=q==='low'?.8:1;R.far=q==='low'?520:800;R.shadows=q!=='low';resize();}
let lastT=performance.now(),perf={t:0,n:0};
function frame(now){let dt=Math.min(.1,(now-lastT)/1000);lastT=now;R.time+=dt;
 if(GAME.mode==='play'&&!GAME.paused)S.playTime=(S.playTime||0)+dt;
 try{if(GAME.mode==='title')MENU.orbitCam(dt);else if(!GAME.paused)updatePlayer(dt);START.update(dt);if(GAME.freeCam){const f=GAME.freeCam;R.cam=f.cam;R.yaw=f.yaw;R.pitch=f.pitch;}if(GAME.mode==='play'){updateBuildMode();updateHand(dt,INPUT.act&&!BUILD.mode&&!UI.panel&&!GAME.paused);}
  let left=GAME.paused?0:dt;while(left>0){const s=Math.min(.05,left);simStep(s);left-=s;}
  EXP.update(dt);TUT.update(dt);START.hud();fillItemInstances();fillPulses();FX.update(dt);UI.frame(dt);renderFrame();}catch(e){console.error(e);GAME.err=(GAME.err||0)+1;if(GAME.err<3)UI.toast('Error: '+e.message,'bad');}
 // automatic quality: drop resolution on slow devices
 if(S.settings.quality==='auto'){perf.t+=dt;perf.n++;if(perf.t>4){const fps=perf.n/perf.t;perf.t=perf.n=0;if(fps<28&&R.scale>.6){R.scale=Math.max(.6,R.scale-.12);resize();}else if(fps>55&&R.scale<1){R.scale=Math.min(1,R.scale+.08);resize();}}}
 requestAnimationFrame(frame);}
(async function boot(){try{
 nextTip();const tipT=setInterval(nextTip,2600);const fresh=!loadGame();glInit(document.getElementById('gl'));initRenderer();applyQuality();setLoad(.1,'Scanning terrain…');await sleep(20);
 initWorld();setLoad(.6,'Unpacking the HUB…');await sleep(20);initModels();FX.init();R.extra=()=>animObjects().concat(toolObjects());
 UI.init();makeThumbs();initScreens();R.post=drawScreens;initInput();restoreWorld();EXP.init();if(!fresh)catchUp();
 setLoad(1,'Ready');await sleep(250);clearInterval(tipT);const L=document.getElementById('loading');L.style.transition='opacity .6s';L.style.opacity=0;setTimeout(()=>L.remove(),650);UI.hint('');GAME.started=true;MENU.title();let nw=false;try{nw=sessionStorage.getItem('ff_new')==='1';sessionStorage.removeItem('ff_new');}catch(e){}if(window.__AUTOPLAY||(nw&&!S.landed))MENU.play();else setTimeout(()=>MENU.notes(false),600);
 addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});setInterval(saveGame,15000);
 window.FW={S:()=>S,ENV,EXP,CRE,TUT,START,TOOL,hubB,spotPos,openPod,takeCore,zap,HAND,handTarget,newPipe,resetFuse,wireAction,canWire,ITEMS,spliceBelt,curveAt,updateBuildMode,FAC,BUILD,PL,R,WORLD,UI,GAME,addInv,BUILDINGS,RECIPES,placeBuilding,beltAction,newBuilding,newBelt,portWorld,autoWire,ground,MILESTONES,curMilestone,hubDeliver,simStep,saveGame};
 requestAnimationFrame(t=>{lastT=t;frame(t);});window.READY=true;
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});UPD.start();
}catch(e){console.error(e);window.ERR=String(e.stack||e);const l=document.getElementById('lmsg');if(l)l.textContent='Could not start: '+e.message;}})();

})();</script></body></html>
