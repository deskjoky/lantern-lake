<title>Novaforge</title><link rel="manifest" href="manifest.webmanifest?v=2"><link rel="icon" href="icon-192-nf.png"><link rel="apple-touch-icon" href="apple-touch-icon-nf.png"><meta name="theme-color" content="#14161b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{--ink:#eef1f4;--muted:#9aa3ad;--panel:rgba(20,23,28,.82);--line:rgba(255,255,255,.1);--orange:#f08a32;--teal:#3fc4ae;--red:#e0574a;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(240,138,50,.96),rgba(224,96,60,.96));color:#fff;padding:14px 22px;border-radius:20px;text-align:center;max-width:min(560px,86vw);box-shadow:0 10px 30px rgba(0,0,0,.35)}#banner b{display:block;font-size:19px;margin-bottom:4px}#banner span{font-size:13.5px;font-weight:600;opacity:.95}
.card{background:rgba(18,21,26,.78);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#ms{position:absolute;left:calc(10px + var(--safe-l));top:calc(10px + var(--safe-t));width:210px;padding:9px 12px;text-align:left}#ms small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--orange);font-weight:800}#ms b{display:block;font-size:14px;margin-bottom:4px}
.mr{position:relative;display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 0 4px}.mr span{flex:1;color:#d6dbe0}.mr em{font-style:normal;font-weight:800;font-size:11px}.mr i{position:absolute;left:0;bottom:0;height:2px;background:var(--teal);border-radius:2px}.mr u{text-decoration:none;color:#ffd27a;font-size:10px;font-weight:800}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.3);flex:none}
#tr{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;gap:8px;align-items:center}
.pill{background:rgba(18,21,26,.78);padding:8px 12px;border-radius:14px;font-weight:800;font-size:12.5px}.pill.bad{background:rgba(224,87,74,.9)}
.rb{width:44px;height:44px;border-radius:14px;background:rgba(18,21,26,.78);display:grid;place-items:center}.rb svg{width:22px;height:22px}.rb:active{background:var(--orange);color:#1a1006}
.rb.tier{width:auto;padding:0 12px;font-weight:800;font-size:12px}
#pad{position:absolute;right:calc(18px + var(--safe-r));bottom:calc(18px + var(--safe-b));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:12px;align-items:end;justify-items:center}
#modeBtns{grid-column:1/3;display:flex;gap:8px;justify-self:end}
#act{grid-column:2;grid-row:2;position:relative;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc07a,#f08a32 60%,#c8641a);color:#1a1006;font-weight:900;font-size:15px;letter-spacing:.04em;box-shadow:0 8px 22px rgba(240,138,50,.35),inset 0 -5px 0 rgba(0,0,0,.18)}
#act.red{background:radial-gradient(circle at 35% 30%,#ff9a8a,#e0574a 60%,#a83a30)}#act.on{transform:scale(.95)}
#act svg{position:absolute;inset:0;transform:rotate(-90deg)}#act circle{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:289;stroke-dashoffset:289;stroke-linecap:round;opacity:.9}
#jump{grid-column:1;grid-row:2;width:58px;height:58px;border-radius:50%;background:rgba(18,21,26,.7);display:grid;place-items:center;margin-bottom:6px}#jump svg{width:24px;height:24px}
body.pc #jump,body.pc #joyHint{display:none}body.pc #act{display:none}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}#joy i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55)}
#joyHint{position:absolute;left:calc(40px + var(--safe-l));bottom:calc(50px + var(--safe-b));width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:11px;font-weight:800;letter-spacing:.1em}
#sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);height:min(560px,88vh);background:rgba(22,25,31,.95);border-radius:22px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}#sheet .tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}#sheet .tabs::-webkit-scrollbar{display:none}
#sheet .tabs button{padding:8px 13px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}#sheet .tabs button.on{background:var(--orange);color:#1a1006}#sheet .ttl{font-size:17px;padding:4px 6px}
#sheet .x{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);font-size:16px;font-weight:900}
#sheet .body{flex:1;overflow-y:auto;padding:12px 16px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
h4{margin:14px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}h3{margin:4px 0}.mut{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bcard{background:rgba(255,255,255,.05);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}.bcard.sel{border-color:var(--orange)}.bcard.lock{opacity:.4}
.bcard .bi{height:74px;border-radius:10px;background:linear-gradient(160deg,#3a4a5a,#232a33);display:grid;place-items:center;overflow:hidden}.bcard .bi img{width:100%;height:100%;object-fit:contain}
.bcard b{font-size:13px}.bcard small{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;color:#cfd5db}.bcard small .no{color:#ff8a7a}.bcard small.lk{color:var(--muted)}.bcard p{margin:0;font-size:11px;color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}.slot{background:rgba(255,255,255,.06);border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:2px;text-align:left}.slot b{font-size:16px}.slot span{font-size:11px;color:var(--muted)}.slot .sw{width:18px;height:18px}
.crafts{display:flex;flex-direction:column;gap:6px}.craft{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}.craft.off{opacity:.55}.cr{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px}.cr i{color:var(--muted);font-style:normal;font-weight:900}.cb{display:flex;gap:6px}
.it{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;font-size:13px}.btn:disabled{opacity:.35}.btn.gold{background:var(--orange);color:#1a1006}.btn.red{background:var(--red)}.btn.big{padding:12px 18px;font-size:14px}.btn.sm{padding:5px 10px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.msh{background:linear-gradient(135deg,rgba(240,138,50,.18),rgba(63,196,174,.12));border-radius:16px;padding:12px 14px}.msh small{color:var(--orange);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}.msh p{margin:4px 0 0;font-size:12.5px;color:#d6dbe0}
.need{display:grid;grid-template-columns:1fr 1.4fr auto;align-items:center;gap:4px 10px;padding:8px 2px;border-bottom:1px solid var(--line)}.need small{grid-column:1/4;color:var(--muted);font-size:11px}.need em{font-style:normal;font-weight:800}
.bar,.prog{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.bar i,.prog i{display:block;height:100%;background:var(--teal);border-radius:4px}.prog{margin:8px 0}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);opacity:.55}.mrow.cur{opacity:1}.mrow.done{opacity:.8}.mrow b{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}.mrow.done b{background:#3a9a5a}.mrow.cur b{background:var(--orange);color:#1a1006}.mrow span{display:flex;flex-direction:column;font-weight:700}.mrow small{font-weight:500;color:var(--muted);font-size:11.5px}
.status{padding:8px 12px;border-radius:12px;font-weight:800;background:rgba(255,255,255,.08)}.status.good{background:rgba(90,208,106,.2);color:#9af0a8}.status.warn{background:rgba(240,180,50,.18);color:#ffd27a}.status.bad{background:rgba(224,87,74,.22);color:#ffaa9a}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.rec{text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;border:2px solid transparent;display:flex;flex-direction:column;gap:3px}.rec.on{border-color:var(--teal);background:rgba(63,196,174,.12)}.rec.lock{opacity:.35}.rec span{font-size:11.5px;color:#cfd5db;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.rec small{color:var(--muted);font-size:11px}
.bufs{display:flex;flex-direction:column;gap:6px}.buf{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:7px 10px}.buf .it{flex:1}
.st{width:100%;border-collapse:collapse;font-size:13px}.st th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;padding:4px}.st td{padding:6px 4px;border-bottom:1px solid var(--line)}.pos{color:#8af09a}.neg{color:#ff9a8a}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.set input{width:50%}
#mapc{width:100%;max-width:520px;aspect-ratio:1;border-radius:14px;display:block;margin:0 auto;touch-action:none}
@media (max-height:500px){#act{width:84px;height:84px}#ms{width:180px;padding:7px 10px}.mr{font-size:10.5px}#sheet{height:92vh;width:96vw}.rb{width:40px;height:40px}}
@media (orientation:portrait){#ms{width:170px}}
.ic{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.slot .ic{width:44px;height:44px}.mr .ic{width:18px;height:18px}.rec .ic{width:20px;height:20px}.need .ic,.buf .ic,.craft .ic{width:30px;height:30px}
.slot .ic{width:52px;height:52px}.need .ic,.buf .ic,.craft .ic{width:34px;height:34px}
/* ---- loading screen ---- */
#loading{background:radial-gradient(ellipse at 50% 120%,#3a2a4a 0%,#14161b 60%);overflow:hidden}
#loading .lgbg{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 80%,#fff5,transparent),radial-gradient(1.5px 1.5px at 60% 45%,#fff4,transparent);animation:drift 30s linear infinite}
#loading .lgbg::after{content:'';position:absolute;right:-8vw;top:-10vh;width:44vh;height:44vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0c8a8,#b07070 60%,#6a4a5a);opacity:.5;box-shadow:0 0 80px #f0a07a44}
@keyframes drift{to{transform:translateY(-40px)}}
.lgc{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(240,138,50,.45))}.logo .gear{transform-origin:60px 60px;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#loading .lt{font-weight:900;letter-spacing:.32em;font-size:26px;color:#ece6da;text-align:center;line-height:1.1}#loading .lt span{display:block;color:var(--orange);letter-spacing:.5em;font-size:15px;margin-top:4px}
.lbelt{position:relative;width:260px;height:26px;overflow:hidden}.lrail{position:absolute;left:0;right:0;bottom:2px;height:8px;background:repeating-linear-gradient(90deg,#2c3036 0 10px,#3a3f48 10px 12px);border-top:3px solid #d8a43a;border-radius:2px;animation:belt .5s linear infinite}
@keyframes belt{to{background-position:12px 0}}
.litems i{position:absolute;bottom:13px;width:16px;height:9px;border-radius:2px;background:#b8c0c8;box-shadow:inset 0 -2px 0 #8a929c;animation:ride 4s linear infinite}
.litems i:nth-child(2n){background:#e08a4a;box-shadow:inset 0 -2px 0 #b8683a;height:11px;border-radius:5px}.litems i:nth-child(3n){background:#8a4a3a;border-radius:6px 8px 4px 7px;width:13px}
.litems i:nth-child(1){animation-delay:0s}.litems i:nth-child(2){animation-delay:-.5s}.litems i:nth-child(3){animation-delay:-1s}.litems i:nth-child(4){animation-delay:-1.5s}.litems i:nth-child(5){animation-delay:-2s}.litems i:nth-child(6){animation-delay:-2.5s}.litems i:nth-child(7){animation-delay:-3s}.litems i:nth-child(8){animation-delay:-3.5s}
@keyframes ride{from{left:-20px}to{left:270px}}
#loading .lb{width:260px;height:6px;border-radius:3px;background:#2a2e36}#loading .lb i{transition:width .3s;background:linear-gradient(90deg,#f08a32,#ffc07a)}
#ltip{max-width:min(420px,80vw);text-align:center;color:#c8ced6;font-size:12.5px;min-height:34px;opacity:.85}

.prow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

const LAKES=[{x:-135,z:70,r:40},{x:115,z:150,r:32},{x:70,z:-175,r:46},{x:-60,z:-215,r:28}];
function baseHeight(x,z){return rawHeight0(x,z);}
function lakeLevel(L){if(L.level==null){let m=1e9;for(let i=0;i<20;i++){const a=i/20*TAU;m=Math.min(m,rawHeight0(L.x+Math.cos(a)*L.r*1.05,L.z+Math.sin(a)*L.r*1.05));}L.level=m-.6;}return L.level;}
function rawHeight(x,z){let h=rawHeight0(x,z);for(const L of LAKES){const d=Math.hypot(x-L.x,z-L.z);if(d>L.r*1.35)continue;const lv=lakeLevel(L),t=d/L.r;const bowl=lv-.4-5*Math.max(0,1-t*t);const edge=smooth(1,1.35,t);h=lerp(Math.min(h,bowl),h,edge);}return h;}
function lakeAt(x,z){for(const L of LAKES){if(Math.hypot(x-L.x,z-L.z)<L.r*1.2&&ground(x,z)<lakeLevel(L))return L;}return null;}
function rawHeight0(x,z){
 const d=Math.hypot(x,z);
 let h=fbm(x*.0042,z*.0042,5)*34+ridged(x*.009+3,z*.009-7,4)*16-6;
 h+=Math.max(0,fbm(x*.002-11,z*.002+5,3))*60;// big plateaus
 const mesa=smooth(.18,.26,fbm(x*.006+40,z*.006-20,3));h=lerp(h,Math.max(h,22+fbm(x*.03,z*.03,2)*3),mesa*smooth(140,220,d));
 h=lerp(10+fbm(x*.02,z*.02,2)*1.2,h,smooth(46,120,d));// a broad flat landing zone around the HUB
 const e=Math.max(Math.abs(x),Math.abs(z));h+=smooth(WORLD.half-60,WORLD.half,e)*70;// ridges close the map
 return h;}
function buildHeights(){const W=WORLD,n=W.n=Math.round(W.half*2/W.step)+1;W.h=new Float32Array(n*n);
 for(let j=0;j<n;j++)for(let i=0;i<n;i++)W.h[j*n+i]=rawHeight(-W.half+i*W.step,-W.half+j*W.step);}
function ground(x,z){const W=WORLD,n=W.n;let fx=(x+W.half)/W.step,fz=(z+W.half)/W.step;fx=clamp(fx,0,n-1.001);fz=clamp(fz,0,n-1.001);const i=Math.floor(fx),j=Math.floor(fz),u=fx-i,v=fz-j;const H=W.h;
 const a=H[j*n+i],b=H[j*n+i+1],c=H[(j+1)*n+i],d=H[(j+1)*n+i+1];return u+v<1?a+(b-a)*u+(c-a)*v:d+(c-d)*(1-u)+(b-d)*(1-v);}
function groundNormal(x,z){const e=1;const hx=ground(x+e,z)-ground(x-e,z),hz=ground(x,z+e)-ground(x,z-e);return v3.norm([-hx,2*e,-hz]);}

// ===== Fluids: pipes, extractors, tanks =====
FAC.pipes=new Map();
const isFluid=k=>!!(ITEMS[k]&&ITEMS[k].fluid);
const fluidCap=(b,k)=>{const D=BUILDINGS[b.k];if(b.k==='tank')return D.cap;if(D.machine){const r=RECIPE[b.recipe];if(!r)return 0;return Math.max(50,(r.in[k]||r.out[k]||0)*6);}if(D.gen)return 100;if(D.pass)return 20;if(D.makes)return 100;return 0;};
function fluidAccepts(b,k){const D=BUILDINGS[b.k];if(D.machine){const r=RECIPE[b.recipe];if(!r||!r.in[k])return 0;return Math.max(0,fluidCap(b,k)-(b.inb[k]||0));}
 if(D.gen){if(!D.fuels.includes(k))return 0;return Math.max(0,100-(b.fuel[k]||0));}
 if(b.k==='tank'||D.pass){const cur=Object.keys(b.store).find(x=>b.store[x]>.001);if(cur&&cur!==k)return 0;return Math.max(0,fluidCap(b,k)-(b.store[k]||0));}return 0;}
function fluidGive(b,k,n){const D=BUILDINGS[b.k];if(D.machine)b.inb[k]=(b.inb[k]||0)+n;else if(D.gen)b.fuel[k]=(b.fuel[k]||0)+n;else{b.store[k]=(b.store[k]||0)+n;}}
// what a building can push into a pipe right now
function fluidOut(b){const D=BUILDINGS[b.k];if(b.k==='tank'||D.pass){const k=Object.keys(b.store).find(x=>b.store[x]>.001);return k?[k,b.store[k]]:null;}for(const [k,v] of Object.entries(b.out))if(isFluid(k)&&v>.001)return [k,v];return null;}
function fluidTake(b,k,n){const D=BUILDINGS[b.k];if(b.k==='tank'||D.pass){b.store[k]-=n;if(b.store[k]<=.001)delete b.store[k];}else b.out[k]-=n;}
function newPipe(o){const A=FAC.b.get(o.from[0]),B=FAC.b.get(o.to[0]);if(!A||!B)return null;const pa=portWorld(A,o.from[1]),pb=portWorld(B,o.to[1]);
 const c=beltCurve(pa.p,pa.d,pb.p,[-pb.d[0],0,-pb.d[2]]);const pp={id:o.id??S.nextId++,tier:o.tier||'pipe1',from:o.from,to:o.to,c,flow:0,fluid:o.fluid||null,phase:0};
 pp.obj={mesh:pipeMesh(c,pp.tier),model:M4.create(),pipe:pp.id};R.objects.push(pp.obj);A.conn[o.from[1]]=pp.id;B.conn[o.to[1]]=pp.id;FAC.pipes.set(pp.id,pp);return pp;}
function removePipe(pp){const A=FAC.b.get(pp.from[0]),B=FAC.b.get(pp.to[0]);if(A)A.conn[pp.from[1]]=null;if(B)B.conn[pp.to[1]]=null;const i=R.objects.indexOf(pp.obj);if(i>=0)R.objects.splice(i,1);freeMesh(pp.obj.mesh);FAC.pipes.delete(pp.id);}
function updatePipe(pp,dt){const A=FAC.b.get(pp.from[0]),B=FAC.b.get(pp.to[0]);if(!A||!B){pp.flow=0;return;}const o=fluidOut(A);let moved=0;
 if(o){const [k,have]=o;let cap=PIPES[pp.tier].rate/60*dt;const pumped=A.k==='pump'&&A.pf>0;if(B.y-A.y>10&&!pumped)cap*=.25;if(pumped)cap*=1.5;if(B.k==='valve')cap=Math.min(cap,(B.limit??600)/60*dt);if(B.k==='valve'&&B.limit===0)cap=0;moved=Math.min(cap,have,fluidAccepts(B,k));if(moved>0){fluidTake(A,k,moved);fluidGive(B,k,moved);pp.fluid=k;}}
 pp.flow=lerp(pp.flow,moved/dt*60,Math.min(1,dt*3));pp.phase+=pp.flow/60*dt;}
// extractors pump like miners
function updateExtractor(b,dt){const D=BUILDINGS[b.k];b.run=0;const k=D.makes;let rate=D.rate;if(b.k==='oilx'){const nd=WORLD.nodes[b.node];if(!nd)return;rate*=PURITY[nd.purity].k;}
 if(b.pf>0&&(b.out[k]||0)<100){b.run=1;const add=rate/60*dt*b.pf*(b.clock||1);b.out[k]=(b.out[k]||0)+add;b.acc=(b.acc||0)+add;if(b.acc>=1){stat('prod',k,Math.floor(b.acc));b.acc-=Math.floor(b.acc);}}}
// glowing pulses riding the top of each pipe show what's flowing and how fast
function fillPulses(){const I=MODELS.pulseInst;if(!I)return;I.n=0;for(const pp of FAC.pipes.values()){if(pp.flow<1||!pp.fluid)continue;if(!inFrustum(pp.obj.mesh.center,pp.obj.mesh.radius+1))continue;if(Math.hypot(pp.obj.mesh.center[0]-R.cam[0],pp.obj.mesh.center[2]-R.cam[2])>150)continue;
  const c=COL(ITEMS[pp.fluid].c);const gap=1.2;const off=(pp.phase*1.5)%gap;for(let s=off;s<pp.c.len;s+=gap){if(I.n>=I.max)break;const q=curveAt(pp.c,s);const o=I.n*8,a=I.data;a[o]=q.p[0];a[o+1]=q.p[1]+.26;a[o+2]=q.p[2];a[o+3]=.5+Math.min(.6,pp.flow/600);a[o+4]=c[0]*1.6+.15;a[o+5]=c[1]*1.6+.15;a[o+6]=c[2]*1.6+.15;a[o+7]=q.yaw;I.n++;}}}

// ---- standing on and bumping into buildings ----
function bLocal(b,x,z){const c=Math.cos(b.rot),s=Math.sin(b.rot),dx=x-b.x,dz=z-b.z;return [c*dx-s*dz,s*dx+c*dz];}
// height of a building's walkable top at a local point (null = you can't stand there)
function bTop(b,lx,lz){const D=BUILDINGS[b.k];if(D.surf==='ramp')return b.y+D.rise*clamp(lz/D.d+.5,0,1);if(D.surf==='deck')return b.y+(D.top||D.h);if(b.k==='hub')return b.y+.5;if(b.k==='pole'||b.k==='cpole'||b.k==='cpoleT')return null;return b.y+D.h;}
function solidAt(x,z,y){let top=ground(x,z);{const L=lakeAt(x,z);if(L)top=Math.max(top,lakeLevel(L)-1.2);}for(const b of FAC.b.values()){const D=BUILDINGS[b.k];if(Math.abs(b.x-x)>10||Math.abs(b.z-z)>10)continue;const [lx,lz]=bLocal(b,x,z);const mg=D.tops?3.4:0;if(Math.abs(lx)>D.w/2+mg||Math.abs(lz)>D.d/2+mg)continue;if(D.tops){for(const t of D.tops)if(lx>=t[0]&&lx<=t[2]&&lz>=t[1]&&lz<=t[3]){const h=b.y+t[4];if(h<=y+(t[4]<=1?1.15:.6)&&h>top)top=h;}continue;}const h=bTop(b,lx,lz);if(h!=null&&h<=y+.6&&h>top)top=h;}return top;}
function blockedAt(x,z,y){for(const b of FAC.b.values()){const D=BUILDINGS[b.k];if(Math.abs(b.x-x)>10||Math.abs(b.z-z)>10)continue;const [lx,lz]=bLocal(b,x,z);if(D.walls){if(Math.abs(lx)>D.w/2+3.6||Math.abs(lz)>D.d/2+3.6)continue;for(const w of D.walls)if(Math.abs(lx-w[0])<w[2]+.3&&Math.abs(lz-w[1])<w[3]+.3&&y<b.y+w[4]-.5&&y+1.8>b.y+.4)return true;for(const t of D.tops)if(t[4]<=1&&lx>=t[0]-.3&&lx<=t[2]+.3&&lz>=t[1]-.3&&lz<=t[3]+.3&&b.y+t[4]>y+1.15&&y+1.8>b.y-4)return true;continue;}let hw=D.w/2+.3,hd=D.d/2+.3;if(b.k==='pole'||b.k==='cpole'||b.k==='cpoleT'){hw=hd=.45;}
  if(Math.abs(lx)>hw||Math.abs(lz)>hd)continue;
  if(D.surf==='ramp'||D.surf==='deck'){const h=bTop(b,clamp(lx,-D.w/2,D.w/2),clamp(lz,-D.d/2,D.d/2));const under=D.surf==='deck'&&D.top>2?b.y+D.top-.4:b.y;if(y<h-.6&&y+1.8>under)return true;continue;}
  const top=b.y+(b.k==='hub'?.5:D.h);if(y<top-.5&&y+1.8>b.y)return true;}
 for(const f of WORLD.flora)if(f.alive&&f.kind!=='bush'&&Math.abs(f.x-x)<2&&Math.abs(f.z-z)<2&&Math.hypot(f.x-x,f.z-z)<(f.kind==='rock'?1.1:.5)*f.s)return true;
 return false;}
function updatePlayer(dt){if(VEH.driving){R.yaw=PL.yaw;R.pitch=PL.pitch;return;}let mx=INPUT.jx,my=INPUT.jy;const k=INPUT.keys;if(k.KeyW||k.ArrowUp)my=1;if(k.KeyS||k.ArrowDown)my=-1;if(k.KeyA||k.ArrowLeft)mx=-1;if(k.KeyD||k.ArrowRight)mx=1;
 if(UI.panel){mx=my=0;}const run=k.ShiftLeft||Math.hypot(INPUT.jx,INPUT.jy)>.98;const sp=(run?9:5.2)*GEAR.speedMul()*Math.min(1,Math.hypot(mx,my));
 const ang=Math.atan2(mx,my)+PL.yaw;let nx=PL.x,nz=PL.z;if(Math.hypot(mx,my)>.05){nx+=Math.sin(PL.yaw)*my*sp*dt/Math.max(1,Math.hypot(mx,my))+Math.cos(PL.yaw)*-mx*sp*dt/Math.max(1,Math.hypot(mx,my));nz+=Math.cos(PL.yaw)*my*sp*dt/Math.max(1,Math.hypot(mx,my))-Math.sin(PL.yaw)*-mx*sp*dt/Math.max(1,Math.hypot(mx,my));}

 else if(wasGround&&PL.vy<=0&&PL.y-top<.6){PL.y=top;PL.vy=0;PL.ground=true;}// stick to the ground walking downhill instead of hopping

function rayWalls(b,o,d,maxT){const D=BUILDINGS[b.k];const c=Math.cos(b.rot),s=Math.sin(b.rot);const ox=o[0]-b.x,oz=o[2]-b.z;const lo=[c*ox-s*oz,o[1]-b.y,s*ox+c*oz],ld=[c*d[0]-s*d[2],d[1],s*d[0]+c*d[2]];let best=null;

 else if(base){const s=grid?4:.5;x=base.x+Math.round((p[0]-base.x)/s)*s;z=base.z+Math.round((p[2]-base.z)/s)*s;y=base.y+(BUILDINGS[base.k].top||1);}

 {const [w0,d0]=fp(k,t.rot);for(const bp of BP.list()){const [bw,bd]=fp(bp.k,bp.rot);if(Math.abs(t.x-bp.x)<(w0+bw)/2-.05&&Math.abs(t.z-bp.z)<(d0+bd)/2-.05&&Math.abs(t.y-bp.y)<3)return 'A blueprint is in the way';}}

const BELT_THRU=new Set(['wallhole','floorhole']);
function beltBlocked(c,ends){const ids=new Set(ends.map(b=>b&&b.id));const pts=[];for(let s=1.2;s<c.len-1.2;s+=.5)pts.push(curveAt(c,s).p);if(!pts.length)return null;
 let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;for(const p of pts){mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mnz=Math.min(mnz,p[2]);mxz=Math.max(mxz,p[2]);}
 for(const b of FAC.b.values()){if(ids.has(b.id)||BELT_THRU.has(b.k))continue;const D=BUILDINGS[b.k];const r=Math.max(D.w,D.d)/2+1;if(b.x<mnx-r||b.x>mxx+r||b.z<mnz-r||b.z>mxz+r)continue;
  const top=b.y+(D.surf==='deck'?(D.top||D.h):b.k==='hub'?4.1:D.h);const c2=Math.cos(b.rot),s2=Math.sin(b.rot);
  for(const p of pts){if(p[1]+.15<b.y||p[1]-.2>top)continue;if(D.surf==='deck'&&p[1]>=top-.25)continue;const dx=p[0]-b.x,dz=p[2]-b.z;const lx=c2*dx-s2*dz,lz=s2*dx+c2*dz;if(Math.abs(lx)<D.w/2-.15&&Math.abs(lz)<D.d/2-.15)return 'the '+D.n;}}
 for(const bl of FAC.belts.values()){if(ids.has(bl.from[0])||ids.has(bl.to[0]))continue;const q=bl.c.pts;for(let j=0;j<q.length;j+=2){const a=q[j];if(a[0]<mnx-1||a[0]>mxx+1||a[2]<mnz-1||a[2]>mxz+1)continue;for(const p of pts)if(Math.abs(p[1]-a[1])<.7&&Math.hypot(p[0]-a[0],p[2]-a[2])<.8)return 'another belt';}}
 for(const f of WORLD.flora){if(!f.alive||(f.kind!=='rock'&&f.kind!=='bulb'&&f.kind!=='spire'))continue;if(f.x<mnx-3||f.x>mxx+3||f.z<mnz-3||f.z>mxz+3)continue;const rr=(f.kind==='rock'?.9:.45)*f.s,hh=f.y+(f.kind==='rock'?.9*f.s:5*f.s);for(const p of pts)if(p[1]<hh&&Math.hypot(p[0]-f.x,p[2]-f.z)<rr)return f.kind==='rock'?'a rock':'a tree';}
 return null;}

UI.drawMap=function(){const c=$('#mapc');if(!c)return;const x=c.getContext('2d'),W=WORLD,N=c.width,sc=N/(W.half*2);
 if(!UI._mapImg){const im=x.createImageData(N,N);for(let j=0;j<N;j++)for(let i=0;i<N;i++){const wx=-W.half+i/sc,wz=-W.half+j/sc,h=ground(wx,wz),n=groundNormal(wx,wz);const col=terrainColor(wx,wz,h,n[1]);const sh=.75+n[0]*.5+(h-10)*.004;const o=(j*N+i)*4;
   im.data[o]=Math.pow(col[0],1/2.2)*255*sh;im.data[o+1]=Math.pow(col[1],1/2.2)*255*sh;im.data[o+2]=Math.pow(col[2],1/2.2)*255*sh;im.data[o+3]=255;}UI._mapImg=im;}
 x.putImageData(UI._mapImg,0,0);const P=(wx,wz)=>[(wx+W.half)*sc,(wz+W.half)*sc];
 x.lineWidth=2.5;for(const bl of FAC.belts.values()){x.strokeStyle=BELTS[bl.tier].col;x.beginPath();bl.c.pts.forEach((p,i)=>{const q=P(p[0],p[2]);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]);});x.stroke();}
 for(const b of FAC.b.values()){const [w,d]=fp(b.k,b.rot);const q=P(b.x,b.z);x.fillStyle=b.k==='hub'?'#f08a32':b.k==='foundation'?'#bbb':'#f4f4f4';x.fillRect(q[0]-w*sc/2,q[1]-d*sc/2,Math.max(2,w*sc),Math.max(2,d*sc));}
 for(const nd of W.nodes){const q=P(nd.x,nd.z);x.fillStyle=NODE_TYPES[nd.type].c;x.strokeStyle='#111';x.lineWidth=1.5;x.beginPath();x.arc(q[0],q[1],3+nd.purity*1.5,0,TAU);x.fill();x.stroke();}
 for(const p of (W.pods||[])){const q=P(p.x,p.z);x.fillStyle=S.pods[p.id]?'#777':'#ff8a3a';x.strokeStyle='#111';x.lineWidth=1.5;x.beginPath();x.moveTo(q[0],q[1]-6);x.lineTo(q[0]+6,q[1]);x.lineTo(q[0],q[1]+6);x.lineTo(q[0]-6,q[1]);x.closePath();x.fill();x.stroke();}
 for(const c of (W.cores||[]))if(S.cores[c.id]){const q=P(c.x,c.z);x.fillStyle='#c890ff';x.beginPath();x.arc(q[0],q[1],3,0,TAU);x.fill();}

 {v:'0.1.3',t:'Controller check',items:['Settings now has a live Controller check that shows whether the game can see your controller and which buttons you press.']},

 {v:'0.1.1',t:'Controller support',items:['Play with a controller: Backbone, Xbox, PlayStation and other standard gamepads.','Left stick move, right stick look, L3 sprint. RT mine/place/use, X interact, A jump (hold in the air for the jetpack). Y build menu, LT dismantle, RB quick wheel, LB switch tool.','While building: LB/RB rotate, D-pad up/down raise/lower, left for a row, right for power lines.','Menus: D-pad or stick moves a highlight, A selects, B goes back, LB/RB switch tabs. The full list is in Settings.','Fixed: picking the Constructor started the pipe tool instead of placing it.']},
 {v:'0.1.0',t:'Fresh numbering and build fixes',items:['Version numbers restarted at 0.1.0: the game is still early, so the numbers now say so. Everything you have built is kept.','Conveyor belts can no longer pass through buildings, other belts, trees or rocks. The preview turns red and tells you what is in the way. Use Wall and Floor Conveyor Holes to go through walls and floors.','The in and out arrows on building holograms are now much smaller.']},
 {v:'0.0.21',t:'Power switches',items:['Every generator has a button to turn it off, plus one to turn off every generator on its grid at once.','Tap a power pole to turn it off: power stops passing through it.']},
 {v:'0.0.20',t:'Polish pass',items:['Machine status screens now sit on a little stand beside each machine, like a boat sonar, so nothing blocks them.','Rotate button while laying conveyor belts and pipes: it turns the next pole or lift you drop.','See-through arrows on building holograms and blueprints show which openings take items in (teal) and send them out (orange).','Belts now join right at the conveyor pole with no gap, and items flow straight from one belt onto the next.']},
 {v:'0.0.19',t:'Longer power lines',items:['Power lines now reach 45 m (up from 30 m), and auto-wire reaches further too.']},
 {v:'0.0.18',t:'Fuse fix',items:['Fixed the fuse blowing over and over (with a constant banging sound) when a machine was not connected to any running generator. Now it simply waits for power.','The same message no longer stacks up on screen.']},
 {v:'0.0.17',t:'Wild world and the quick wheel',items:['Quick wheel: tap the new crosshair button (or C) for a radial menu of your favourite builds and tools. In the Build menu, tap ＋ Quick wheel to add any building.','Power lines: tap the ⚡ button (or pick Power Line on the quick wheel), tap a generator, then a pole, then a machine. Each line reaches 45 m.','Five regions to discover: Spore Meadows, Rust Desert, Crystal Fields, Ashlands and Bloom Forest.','Caves with glowing crystals, and Mercer Spheres hidden in caves and hazard zones. Research them in the MAM.','New creatures: Spitters shoot glowing goo from range, Stingers lurk around caves, and harmless Flying Crabs drift overhead.']},
 {v:'0.0.16',t:'Build it your way',items:['New pieces: walls with windows and doors, half and 8 m foundations, flat and sloped roofs, beams, pillars, lamp posts, floodlight towers and signs you can write on.','Lamps and floodlights really light up the area at night.','Paint: open any machine and pick from 10 colour schemes (milestone 2).','Factory blueprints: Build → Blueprints → Blueprint Designer. Tap two corners to copy an area (buildings, belts, power lines, recipes and paint), then stamp copies anywhere. Short on parts? It is placed as fill-in holograms.','Golden Pioneer Statue in the AWESOME Shop.']},
 {v:'0.0.15',t:'Research, the Sink and the late game',items:['MAM (milestone 1): research pocket upgrades, health, medicine, slug refinement, a long-range scanner and stronger resonance cores. Hard drives can be analysed there too.','AWESOME Sink (milestone 3): belt spare parts in to earn points and FICSIT Coupons. AWESOME Shop: spend coupons on power shards, ammo, inventory slots, paint colours and more.','New machines: Packager (put fluids in canisters to move them by belt or vehicle), Blender (Turbofuel and Batteries), Particle Accelerator (Dark Matter for the final Skyhook phase).','New power: Geothermal Generators on geysers (200 MW, no fuel) and the Nuclear Power Plant (2,500 MW from uranium found in radiation zones).','Resource wells and their extractor for water or oil.','The scanner can find geysers, wells and uranium as you progress.']},
 {v:'0.0.14',t:'Vehicles, trains and drones',items:['Tractor and Truck (Build → Logistics): walk up and tap Drive. Tap ● Rec, drive a loop past Truck Stations, stop recording, then tap Auto: it drives the route on its own, loading or unloading at each station. Stations refuel it.','Railways: build Train Stations, then lay track from a station end (Build → Logistics → Railway). Build a train at a station and add stops; it loads and unloads at each.','Drone Ports: set another drone port as the destination and its drone flies 400 items per trip.','Rain no longer falls through roofs: your HUB and buildings stay dry inside.','Scanner pings now last 15 seconds and disappear once you reach them.']},
 {v:'0.0.13',t:'Real rain',items:['Rain now falls in the 3D world around you, with splashes on the ground, instead of being drawn on your screen.','Fixed buttons sometimes ignoring taps until you restarted the game. Buttons no longer refresh while your finger is on them, and the game now resets itself if touch input gets stuck.']},
 {v:'0.0.12',t:'Mobile pace',items:['New Game pace setting (Settings → Game pace). Mobile is the default: building costs are halved, workbench crafting is twice as fast, hand mining is 1.5× faster, and milestones need about half the parts.','Classic uses Satisfactory\'s original numbers. Machine recipes are the same in both, so your factory ratios stay true.']},
 {v:'0.0.11',t:'Smarter logistics',items:['Smart Splitter: set each output to an item, Any, None or Overflow.','Programmable Splitter: each output can take up to 4 items.','Overflow: an output that only gets items when the others are backed up.','Industrial Storage: 4,800 items, two inputs and two outputs.','Pipeline Pump: pushes fluid uphill (pipes climbing over 10 m are slow without one) and speeds up flow.','Valve: limit or shut off fluid flow.','Wall and Floor Conveyor Holes for running belts through walls and floors.']},
 {v:'0.0.10',t:'Gear up',items:['New hand tool modelled on Satisfactory: a work glove gripping a yellow-and-black chisel.','Inventory now has stacks and slots (18 to start, +6 at milestones 2, 4 and 6). If your pockets are full, extra items drop in a crate you can pick up.','Equipment slots: hand, head, body, back and legs. Make gear at the workbench.','Chainsaw clears trees and bushes around you in one go. Rifle and ammo. Nobelisk explosives: throw, then tap again to detonate.','Blade Runners: run faster and jump higher. Parachute: float down safely. Hover Pack: fly near your power grid. Your jetpack is now an item in your back slot.','Toxic gas clouds and radiation zones: use a gas mask or hazmat suit with filters.','Glowberries from bushes and Medicinal Inhalers heal you. A heal button appears when you are hurt.','New ⚡ button (or L) to run power lines by hand. Z switches your hand tool.']},
 {v:'0.0.9',t:'Living machines',items:['Machines now move while they work: drills spin and bob, the constructor stamps parts with sparks, assembler and manufacturer robot arms swing, the oil pumpjack rocks, fans and turbines spin, splitters show their router turning.','Smoke and fire: the biomass burner has a visible fire in its firebox and on top, the coal generator has a huge smokestack that puffs smoke, smelters and foundries smoke and throw embers, the refinery burns a flare.','Every machine has its own sound: furnace roar, fire crackle, drill grind, turbine whine, pumping water, refinery bubbling, press slams, coal generator chugging.','More detail on every building.','Your hand tool is now a gloved hand holding a chisel. Mining is a steady chisel tapping with a stone-chipping sound.','Recipes and building costs now match Satisfactory, and workbench crafting time follows each recipe (harder parts take longer).']},
 {v:'0.0.8',t:'Plan, scan and build',items:['Blueprints: place any unlocked building even without the parts. It appears as a blue hologram; walk up and press Fill to add materials until it is built.','To-do list: tap 📌 on a building, workbench recipe or milestone. It shows what you have, what you need, and the raw resources still to gather.','The milestone card is now a small button at the top left, next to the To-do button. Tap either to open it.','Resource scanner (new radar button, or V): scan for iron, copper and limestone. Coal, oil, aurite and more unlock with milestones.','New map: zoom, drag, labels for your HUB and drop pod, and waypoints you can tap to place. Waypoints and your HUB show on screen with distances.','Workbench: crafting now takes time like a real bench (bigger parts take longer) at a steady pace, with anvil hammering sounds.','New hand tool: an energy chisel.','Every ore node has its own look: rusty iron slabs, copper with green patina and crystals, layered limestone, glowing coal, golden aurite spires.','Fewer loose rocks, and the ones left can be broken for limestone.','New games: nodes come in same-type patches spread apart, so each factory has room to grow.']},
 {v:'0.0.7',t:'New menus and save slots',items:['Every menu is redesigned with pictures: build menu, inventory, workbench, HUB terminal, research, machines, storage, production stats, settings and help.','Build menu: pick a category, tap a building to see its picture, stats and cost, then tap Build.','Workbench: hold the Craft button to keep crafting, or craft ×1, ×5 or all at once.','HUB terminal: see every milestone, what it costs and the pictures of what it unlocks.','Main menu has a Continue button and 3 save slots with Load game.','Starting a new game is now 3 steps: pick a slot, name it (and confirm if it overwrites a save), then hold to launch.','Your hand tool now has a spinning drill: it winds up, strikes and throws sparks when you mine, with new mining sounds.']},
 {v:'0.0.6',t:'HUB stairs',items:['The HUB now sits on a solid foundation with stairs up to the front door, so you walk up onto it instead of sinking into the floor.','New app icon files so phones pick up the Novaforge icon.']},
 {v:'0.0.5',t:'Update notes',items:['Patch notes now pop up after every update so you know you have the newest version.','Updates download more reliably on phones and home-screen apps.']},
 {v:'0.0.4',t:'Novaforge',items:['The game has a new name: Novaforge.','New app icon, logo and loading screen.']},
 {v:'0.0.3',t:'Planetfall fix',items:['New game now wipes your save properly and drops you onto the planet in a drop pod.','New "Start a new game?" screen.']},
 {v:'0.0.2',t:'Planetfall',items:['Start with nothing but your hand tool: ride a drop pod down and place your HUB wherever you like.','Brand new walk-in HUB with living quarters, a bed, a workbench and the milestone terminal.','You can see your hand tool, and it fires a beam when you mine.','A step-by-step tutorial with a marker that shows you where to go.','Day and night with stars and a headlamp, plus rain, overcast skies and dust storms.','Crash sites with hard drives that unlock alternate recipes.','Resonance cores: alien artifacts that double a machine\'s output.','Spinehog creatures (zap them) and glowing jellyfish. Peaceful mode in Settings.','Jetpack (hold jump in the air) and ziplines along power lines.','Ambient music, rain, wind and machine sounds.','Fixed the camera jitter when you start walking.']},
 {v:'0.0.1',t:'Oil and water',items:['Water and oil extractors, pipelines, refinery, fluid buffer and fuel generator.','Plastic, rubber, fuel, computers and heavy frames.']},

// ===== Exploration: day and night, weather, crash sites, artifacts, creatures, jetpack, zipline =====
const ENV={DAY:1320,wxv:{fog:1,light:1,rain:0,dust:0,cloud:0},dayK:1};
const WX={clear:{fog:1,light:1,rain:0,dust:0,cloud:0,n:'Clear'},cloudy:{fog:1.5,light:.72,rain:0,dust:0,cloud:.6,n:'Overcast'},rain:{fog:2.3,light:.55,rain:1,dust:0,cloud:1,n:'Rain'},dust:{fog:3.2,light:.62,rain:0,dust:1,cloud:.4,n:'Dust storm'}};
const MOON_DIR=v3.norm([-.42,.78,-.3]);
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function sunDirAt(tod){const a=tod*TAU;return v3.norm([Math.cos(a)*.78,Math.sin(a),.34]);}
ENV.update=function(dt,play){if(S.tod==null)S.tod=.07;if(!S.wx)S.wx={k:'clear',t:240};
 const night=Math.sin(S.tod*TAU)<0;if(play)S.tod=(S.tod+dt/ENV.DAY*(night?1.9:1))%1;
 if(play){S.wx.t-=dt;if(S.wx.t<=0){const r=Math.random();S.wx.k=S.wx.k!=='clear'?'clear':r<.45?'cloudy':r<.8?'rain':'dust';S.wx.t=S.wx.k==='clear'?240+Math.random()*300:120+Math.random()*160;if(S.wx.k!=='clear')UI.toast(WX[S.wx.k].n+' rolling in','info');}}
 const W=WX[S.wx.k],v=ENV.wxv,k=Math.min(1,dt*.15);for(const q of ['fog','light','rain','dust','cloud'])v[q]+=(W[q]-v[q])*k;
 const sun=sunDirAt(S.tod);ENV.sun=sun;const dayK=smooth(-.14,.16,sun[1]);ENV.dayK=dayK;const ss=smooth(.38,.04,sun[1])*dayK;
 const Ld=v3.norm([sun[0],Math.max(sun[1],.2),sun[2]]);R.sun=dayK>.5?Ld:MOON_DIR;
 const dayCol=mix3([1.55,1.38,1.15],[1.55,.92,.62],ss);let sc=mix3([.07,.09,.18],dayCol,dayK);const L=v.light;R.sunCol=sc.map(c=>c*L);
 R.sky=mix3([.035,.045,.09],[.42,.58,.85],dayK).map(c=>c*(.75+.25*L));R.gnd=mix3([.02,.02,.035],[.30,.24,.30],dayK);
 let fog=mix3([.012,.016,.04],mix3([.66,.76,.90],[.86,.5,.4],ss),dayK);const grey=mix3(fog,[.56,.6,.66].map(c=>c*(.25+.75*dayK)),v.cloud*.7);fog=mix3(grey,[.80,.56,.46].map(c=>c*(.3+.7*dayK)),v.dust*.75);
 R.fog=[fog[0],fog[1],fog[2],.0024*v.fog*(GAME.mode==='title'?.8:1)];
 R.top=mix3(mix3([.003,.005,.016],mix3([.16,.30,.62],[.22,.16,.4],ss),dayK),fog,Math.max(v.cloud*.75,v.dust*.85));R.night=(1-dayK)*(1-v.cloud*.85);R.sunD=sun;
 R.lamp=play?clamp((1-dayK)*.95+(1-L)*.35,0,1):0;
 EXP.rain(dt,v.rain);AMB.update(v.rain,v.dust);};

const EXP={drops:[]};
EXP.rain=function(dt,k){let c=EXP.rc;if(!c){c=EXP.rc=document.createElement('canvas');c.id='rain';c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3';document.body.appendChild(c);}
 const on=k>.03&&GAME.mode==='play';c.style.display=on?'':'none';if(!on)return;const W=innerWidth,H=innerHeight;if(c.width!==W||c.height!==H){c.width=W;c.height=H;}

// ---------- BLUEPRINTS ----------
const BP={};
BP.ok=k=>k!=='hub'&&!(BUILDINGS[k]&&BUILDINGS[k].vehicle)&&!!BUILDINGS[k]&&unlocked(BUILDINGS[k])&&Object.keys(BUILDINGS[k].cost||{}).length>0;
BP.list=()=>S.bps||(S.bps=[]);
BP.place=function(t){const k=BUILD.k;const bp={id:'bp'+(S.nextId++),k,x:t.x,y:t.y,z:t.z,rot:t.rot,node:t.node?t.node.id:null,got:{},recipe:BUILD.preset&&BUILD.preset.k===k?BUILD.preset.recipe:null};BP.list().push(bp);
 FX.puff(t.x,t.y,t.z,COL('#7ad8ff',1.2));AUDIO.tone(660,.18,{type:'sine',vol:.06,slide:1.4});UI.toast('Blueprint placed: bring the parts and fill it in','info');saveSoon();return null;};
BP.need=bp=>{const out={};for(const [k,v] of Object.entries(BUILDINGS[bp.k].cost)){const r=v-(bp.got[k]||0);if(r>0)out[k]=r;}return out;};
BP.frac=bp=>{const c=BUILDINGS[bp.k].cost;let a=0,b=0;for(const [k,v] of Object.entries(c)){a+=Math.min(v,bp.got[k]||0);b+=v;}return b?a/b:1;};
// move whatever you carry into the blueprint; finish it when it is full
BP.fill=function(bp){let n=0;for(const [k,r] of Object.entries(BP.need(bp))){const m=Math.min(r,S.inv[k]||0);if(m>0){addInv(k,-m);bp.got[k]=(bp.got[k]||0)+m;n+=m;}}
 if(n){AUDIO.craft();UI.pop('+'+n+' parts into the blueprint');}if(!Object.keys(BP.need(bp)).length)BP.finish(bp);saveSoon();return n;};
BP.finish=function(bp){const D=BUILDINGS[bp.k];S.bps=BP.list().filter(x=>x!==bp);if(bp.node!=null&&[...FAC.b.values()].some(b=>b.node===bp.node)){for(const [k,v] of Object.entries(bp.got))addInv(k,v);UI.toast('That node already has a miner: parts returned','warn');return;}
 const b=newBuilding({k:bp.k,x:bp.x,y:bp.y,z:bp.z,rot:bp.rot,node:bp.node});

SCAN.go=function(s){const all=[];if(s.k==='pod'){for(const p of WORLD.pods)if(!S.pods[p.id])all.push([p.x,p.y+1.5,p.z]);}else if(s.k==='slug'){for(const f of WORLD.flora)if(f.kind==='slug'&&f.alive)all.push([f.x,f.y+.6,f.z]);}else if(s.k==='res_core'){for(const c of WORLD.cores)if(!S.cores[c.id])all.push([c.x,c.y+2,c.z]);}else for(const nd of WORLD.nodes)if(nd.type===s.k)all.push([nd.x,nd.y+1.5,nd.z,nd.purity]);

 UI.toast(list.length?'Scanner: '+list.length+' '+SCAN.name(s).toLowerCase()+' found nearby':'Scanner: nothing found','info');};

MSND.loop=function(name){const c=AUDIO.ctx;if(MSND.loops[name])return MSND.loops[name];const [type,freq,ft,base,lfo]=LOOPS[name];let src;
 if(type==='noise'){const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),a=nb.getChannelData(0);let last=0;for(let i=0;i<a.length;i++){const w=Math.random()*2-1;last=name==='fire'?(Math.random()<.002?w*4:w*.6):w;a[i]=last;}src=c.createBufferSource();src.buffer=nb;src.loop=true;}
 else{src=c.createOscillator();src.type=type==='saw'?'sawtooth':'triangle';src.frequency.value=freq;}
 const f=c.createBiquadFilter();f.type=ft;f.frequency.value=freq;if(ft==='bandpass')f.Q.value=1.2;const g=c.createGain();g.gain.value=0;const pan=c.createStereoPanner?c.createStereoPanner():null;
 let node=src.connect(f);if(lfo){const lg=c.createGain();lg.gain.value=0;const o=c.createOscillator();o.frequency.value=lfo;const og=c.createGain();og.gain.value=.5;o.connect(og).connect(lg.gain);node=node.connect(lg);o.start();const dc=c.createConstantSource?c.createConstantSource():null;if(dc){dc.offset.value=.5;dc.connect(lg.gain);dc.start();}}
 node=node.connect(g);if(pan)node.connect(pan).connect(c.destination);else node.connect(c.destination);src.start();return MSND.loops[name]={g,pan,base};};
MSND.panFor=(x,z)=>{const a=Math.atan2(x-PL.x,z-PL.z)-PL.yaw;return clamp(-Math.sin(a),-1,1)*.8;};

 if(play)for(const b of FAC.b.values()){const L=SND_OF[b.k];if(!L||!(b.run>0))continue;const d=Math.hypot(b.x-PL.x,b.z-PL.z);if(d>55)continue;const w=Math.pow(1-d/55,2);for(const n of L){const a=acc[n]||(acc[n]={w:0,px:0});a.w+=w;a.px+=MSND.panFor(b.x,b.z)*w;}}
 for(const n of Object.keys(LOOPS)){const a=acc[n];if(!a&&!MSND.loops[n])continue;const L=MSND.loop(n);const v=a?Math.min(1.4,a.w)*L.base:0;L.g.gain.setTargetAtTime(v,t,.25);if(L.pan&&a)L.pan.pan.setTargetAtTime(clamp(a.px/a.w,-1,1),t,.2);}};
// one-shot machine sounds placed in the world
MSND.shot=function(kind,b){if(!AUDIO.ctx||!S.settings.sound||GAME.mode!=='play')return;const d=Math.hypot(b.x-PL.x,b.z-PL.z);if(d>40)return;const v=Math.pow(1-d/40,1.6);if(v<.03)return;const now=performance.now();if(now-(MSND.last[kind]||0)<70)return;MSND.last[kind]=now;
 const c=AUDIO.ctx,t=c.currentTime,out=c.createGain();out.gain.value=v;const pan=c.createStereoPanner?c.createStereoPanner():null;if(pan){pan.pan.value=MSND.panFor(b.x,b.z);out.connect(pan).connect(c.destination);}else out.connect(c.destination);
 const tone=(f,dur,type,vol,slide,when=0)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t+when);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+when+dur);g.gain.setValueAtTime(vol,t+when);g.gain.exponentialRampToValueAtTime(.0001,t+when+dur);o.connect(g).connect(out);o.start(t+when);o.stop(t+when+dur+.05);};
 const noise=(dur,freq,type,vol,when=0)=>{const n=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource();s.buffer=n;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(out);s.start(t+when);};
 if(kind==='slam'){tone(70,.25,'triangle',.35,.5);noise(.12,2400,'bandpass',.3);noise(.5,5000,'highpass',.06,.05);}
 else if(kind==='chug'){tone(55,.3,'sine',.4,.7);noise(.35,400,'lowpass',.25);noise(.4,4500,'highpass',.05,.12);}

 else if(kind==='pop'){noise(.05,2500,'bandpass',.3);}

function partMatrix(b,p,ph,run){const [k,x,y,z,kind,sp=1,amp=0,off=0]=p;const c=Math.cos(b.rot),s=Math.sin(b.rot);let lx=x,ly=y,lz=z,ry=0,rx=0,rz=0,sx=1,sy=1,sz=1;const a=ph*sp+off;
 if(kind==='spin')ry=a;else if(kind==='spinx')rx=a;else if(kind==='pump')ly+=Math.sin(a)*amp;else if(kind==='rock')rx=Math.sin(a)*amp;else if(kind==='swing'){ry=Math.sin(a)*amp;ly+=Math.max(0,Math.sin(a*2))*.08;}
 else if(kind==='slam'){const q=(a/TAU)%1;ly-=(q<.12?q/.12:1-(q-.12)/.88)*amp;}else if(kind==='climb')ly+=Math.sin(a)*amp;
 else if(kind==='glow'||kind==='glowflat'){const f=run?.75+.25*Math.sin(R.time*13+b.id)*Math.sin(R.time*7.3):.15;sx=sy=sz=f;if(kind==='glowflat'){sy=.3;}}
 else if(kind==='flame'||kind==='flametop'||kind==='flaretop'){const f=run?1:0;const fl=(.8+.25*Math.sin(R.time*17+b.id)+.15*Math.sin(R.time*29))*f;sx=sz=(kind==='flame'?.7:kind==='flaretop'?.9:1)*Math.max(.001,fl);sy=Math.max(.001,fl*(kind==='flame'?.65:1.1));ry=R.time*2;}
 return T(b.x+c*lx+s*lz,b.y+ly,b.z-s*lx+c*lz,b.rot+ry,rx,rz,sx,sy,sz);}

function animObjects2(){const out=[];const dt=Math.min(.05,R.time-(PFX._t||R.time));PFX._t=R.time;const cx=R.cam[0],cz=R.cam[2];
 for(const b of FAC.b.values()){const P=PARTS[b.k];const dd=Math.hypot(b.x-cx,b.z-cz);const run=b.k==='hub'||b.k==='skyhook'||window.__forceRun?1:(b.k==='splitter'||b.k==='merger')?(b.buf&&b.buf.length?1:0):(b.run>0?1:0);
  b.spd=lerp(b.spd||0,run,Math.min(1,dt*2.5));const prev=b.ph||0;b.ph=prev+dt*b.spd;
  if(P&&dd<160)for(const p of P){const m=PM[p[0]];if(!m)continue;if((p[4]==='flame'||p[4]==='flametop'||p[4]==='flaretop')&&b.spd<.05)continue;out.push({mesh:m,model:partMatrix(b,p,b.ph,run)});}
  // rhythmic sounds tied to the motion
  if(run&&dd<40){const cyc=(sp,off=0)=>Math.floor((prev*sp+off)/TAU)!==Math.floor((b.ph*sp+off)/TAU);
   if(b.k==='constructor'&&cyc(1.15)){MSND.shot('slam',b);const c=Math.cos(b.rot),s=Math.sin(b.rot);for(let i=0;i<6;i++)PFX.emit('spark',[b.x+s*1.9,b.y+1.8,b.z+c*1.9]);}
   if(b.k==='coalgen'&&cyc(4.4/2))MSND.shot('chug',b);if(b.k==='oilx'&&cyc(1.7))MSND.shot('thump',b);if((b.k==='assembler'||b.k==='manufacturer')&&cyc(2.8))MSND.shot('clank',b);
   if((b.k==='miner'||b.k==='miner2')&&cyc(3.2))MSND.shot('thunk',b);if(b.k==='refinery'&&Math.random()<dt*2)MSND.shot('bubble',b);if(b.k==='burner'&&Math.random()<dt*3)MSND.shot('pop',b);}
  // particles
  const E=EMIT[b.k];if(E&&run&&dd<110){const c=Math.cos(b.rot),s=Math.sin(b.rot);const far=dd>60?.4:1;for(const e of E){if(Math.random()<e[4]*dt*far){const p=[b.x+c*e[1]+s*e[3],b.y+e[2],b.z-s*e[1]+c*e[3]];if(e[0]==='dust'&&b.node!=null&&WORLD.nodes[b.node]){p.push(COL(NODE_TYPES[WORLD.nodes[b.node].type].c));}PFX.emit(e[0],p,e[5]);}}}}
 PFX.update(dt);MSND.update();
 // keep power lines and other effects from the original
 return out.concat(_oldAnim());}

 else{const any=outs.filter(i=>ruleAny(ruleOf(b,i)));if(any.length&&tryList(any))return;}

const TR={drones:new Map(),veh:[],trains:[],railObjs:new Map(),curves:new Map(),paths:new Map()};
const railC=r=>{let c=TR.curves.get(r.id);if(!c){c=railCurve(r);if(c)TR.curves.set(r.id,c);}return c;};
function droneFor(b){let d=TR.drones.get(b.id);if(!d){d={home:b.id,x:b.x,y:b.y+1.2,z:b.z,st:'idle',cargo:{},t:0};TR.drones.set(b.id,d);}return d;}
function updateDrones(dt){for(const b of FAC.b.values()){if(b.k!=='droneport')continue;const d=droneFor(b);const dest=b.dest!=null?FAC.b.get(b.dest):null;if(dest)dest.isDest=true;
  const H=[b.x,b.y+1.2,b.z];const cnt=o=>Object.values(o).reduce((a,c)=>a+c,0);const fly=(tx,ty,tz,sp)=>{const dx=tx-d.x,dy=ty-d.y,dz=tz-d.z,L=Math.hypot(dx,dy,dz);const st=sp*dt;if(L<=st){d.x=tx;d.y=ty;d.z=tz;return true;}d.x+=dx/L*st;d.y+=dy/L*st;d.z+=dz/L*st;d.yaw=Math.atan2(dx,dz);return false;};
  if(d.st==='idle'){Object.assign(d,{x:H[0],y:H[1],z:H[2]});if(dest&&b.pf>0&&cnt(b.store)>0){d.t+=dt;if(d.t>2){d.t=0;let room=400;for(const [k,v] of Object.entries(b.store)){const m=Math.min(v,room);if(m<=0)break;d.cargo[k]=(d.cargo[k]||0)+m;b.store[k]-=m;if(!b.store[k])delete b.store[k];room-=m;}d.st='up';MSND.shot('thunk',b);}}}
  else if(d.st==='up'){if(fly(H[0],H[1]+30,H[2],10))d.st='go';}
  else if(d.st==='go'){if(!dest){d.st='back';continue;}if(fly(dest.x,dest.y+31,dest.z,45))d.st='down';}
  else if(d.st==='down'){if(fly(dest.x,dest.y+1.2,dest.z,10)){const cap=BUILDINGS.droneport.cap;for(const [k,v] of Object.entries(d.cargo)){const room=cap-cnt(dest.store);const m=Math.min(v,room);if(m>0){dest.store[k]=(dest.store[k]||0)+m;d.cargo[k]-=m;}if(!d.cargo[k])delete d.cargo[k];}d.st='back';d.t=0;}}
  else if(d.st==='back'){if(d.y<(dest?dest.y:b.y)+30){d.y+=10*dt;}else if(fly(H[0],H[1]+30,H[2],45))d.st='land';}
  else if(d.st==='land'){if(fly(H[0],H[1],H[2],10))d.st='idle';}}
 for(const [id,d] of TR.drones)if(!FAC.b.has(id))TR.drones.delete(id);}

function vehSpawn(k,t){const v={id:'v'+(S.nextId++),k,x:t.x,y:t.y,z:t.z,yaw:t.rot,spd:0,fuel:{},cargo:{},route:[],auto:false,ri:0,wait:0};S.vehicles=S.vehicles||[];S.vehicles.push(v);FX.puff(t.x,t.y,t.z);return v;}
const VEH={driving:null,rec:false};
function vehUpdate(dt){const L=S.vehicles||[];for(const v of L){const D=BUILDINGS[v.k];const fuelOK=()=>{const k=Object.keys(v.fuel).find(x=>v.fuel[x]>0);if(!k)return false;v.burn=(v.burn||0)+dt*(v.k==='truck'?1.2:.6);if(v.burn>=FUEL[k]/60){v.burn=0;v.fuel[k]--;if(!v.fuel[k])delete v.fuel[k];}return true;};
  let thr=0,steer=0;if(VEH.driving===v){thr=INPUT.jy||(INPUT.keys.KeyW?1:INPUT.keys.KeyS?-1:0);steer=-(INPUT.jx||(INPUT.keys.KeyA?-1:INPUT.keys.KeyD?1:0));if(VEH.rec){const last=v.route[v.route.length-1];if(!last||Math.hypot(last[0]-v.x,last[1]-v.z)>3)v.route.push([v.x,v.z]);}}
  else if(v.auto&&v.route.length>2){if(v.wait>0){v.wait-=dt;}else{const tg=v.route[v.ri%v.route.length];const dx=tg[0]-v.x,dz=tg[1]-v.z;if(Math.hypot(dx,dz)<3.5){v.ri=(v.ri+1)%v.route.length;
     for(const b of FAC.b.values())if(b.k==='truckst'&&Math.hypot(b.x-v.x,b.z-v.z)<7&&v.lastSt!==b.id){v.lastSt=b.id;v.wait=4;vehDock(v,b);break;}}
    let da=Math.atan2(dx,dz)-v.yaw;da=((da+Math.PI)%TAU+TAU)%TAU-Math.PI;steer=clamp(da*2,-1,1);thr=Math.abs(da)>1.2?.3:.85;}}
  const max=v.k==='truck'?16:12;const go=thr!==0&&fuelOK();v.spd=lerp(v.spd,go?thr*max:0,Math.min(1,dt*(go?1.2:2.5)));v.yaw+=steer*dt*1.4*clamp(v.spd/6,-1,1);
  const nx=v.x+Math.sin(v.yaw)*v.spd*dt,nz=v.z+Math.cos(v.yaw)*v.spd*dt;if(!blockedAt(nx,nz,v.y)&&Math.abs(nx)<WORLD.half-10&&Math.abs(nz)<WORLD.half-10){v.x=nx;v.z=nz;}else v.spd*=-.2;v.y=lerp(v.y,solidAt(v.x,v.z,v.y+1.5),Math.min(1,dt*10));
  if(Math.abs(v.spd)>1&&Math.random()<dt*4)PFX.emit('dust',[v.x-Math.sin(v.yaw)*2,v.y+.2,v.z-Math.cos(v.yaw)*2],.8);}
 if(VEH.driving){const v=VEH.driving;PL.x=v.x;PL.z=v.z;PL.y=v.y+1.2;PL.vy=0;const back=v.k==='truck'?11:8;const cy=PL.yaw;GAME.freeCam={cam:[v.x-Math.sin(cy)*back,v.y+4.5,v.z-Math.cos(cy)*back],yaw:cy,pitch:PL.pitch-.2};if(Math.abs(v.spd)>2)PL.yaw=lerp(PL.yaw,v.yaw,Math.min(1,dt*1.5));}}
function vehDock(v,b){const cap=BUILDINGS[v.k].cargo,scap=BUILDINGS.truckst.cap;const cnt=o=>Object.values(o).reduce((a,c)=>a+c,0);
 if(b.mode==='unload'){for(const [k,n] of Object.entries(v.cargo)){const m=Math.min(n,scap-cnt(b.store));if(m>0){b.store[k]=(b.store[k]||0)+m;v.cargo[k]-=m;}if(!v.cargo[k])delete v.cargo[k];}}
 else{for(const [k,n] of Object.entries(b.store)){const m=Math.min(n,cap-cnt(v.cargo));if(m<=0)break;v.cargo[k]=(v.cargo[k]||0)+m;b.store[k]-=m;if(!b.store[k])delete b.store[k];}}
 // stations also refuel vehicles from any fuel stored there
 for(const k of Object.keys(FUEL))if(b.store[k]>0&&!['leaves'].includes(k)){const m=Math.min(b.store[k],50-(v.fuel[k]||0));if(m>0){v.fuel[k]=(v.fuel[k]||0)+m;b.store[k]-=m;if(!b.store[k])delete b.store[k];}}
 MSND.shot('thunk',b);}
function rayVeh(o,d){let best=null;for(const v of (S.vehicles||[])){const w=[v.x-o[0],v.y+1.2-o[1],v.z-o[2]];const t=v3.dot(w,d);if(t<0||t>8)continue;const q=[o[0]+d[0]*t-v.x,o[1]+d[1]*t-v.y-1.2,o[2]+d[2]*t-v.z];if(Math.hypot(...q)<(v.k==='truck'?3:2.2)&&(!best||t<best.t))best={t,v};}return best;}

function stationNodes(b){if(b.rn&&b.rn.every(id=>RN().find(n=>n.id===id)))return b.rn;const c=Math.cos(b.rot),s=Math.sin(b.rot);const mk=(lz,dir)=>{const n={id:'n'+(S.nextId++),x:b.x+c*-2.2+s*lz,y:b.y+1.3,z:b.z-s*-2.2+c*lz,dx:s*dir,dz:c*dir,st:b.id};RN().push(n);return n.id;};b.rn=[mk(-8,-1),mk(8,1)];RL().push({id:'r'+(S.nextId++),a:b.rn[0],b:b.rn[1],inner:1});return b.rn;}
function railCurve(r){const A=RN().find(n=>n.id===r.a),B=RN().find(n=>n.id===r.b);if(!A||!B)return null;if(r.inner)return beltCurve([A.x,A.y,A.z],[-A.dx,0,-A.dz],[B.x,B.y,B.z],[-B.dx,0,-B.dz]);return beltCurve([A.x,A.y,A.z],[A.dx,0,A.dz],[B.x,B.y,B.z],[-B.dx,0,-B.dz]);}

function railTarget(){const {o,d}=aimRay();let best=null;for(const n of RN()){if(RL().filter(r=>!r.inner&&(r.a===n.id||r.b===n.id)).length&&!n.st&&RL().filter(r=>r.a===n.id||r.b===n.id).length>=2)continue;const w=[n.x-o[0],n.y-o[1],n.z-o[2]];const t=v3.dot(w,d);if(t<0||t>40)continue;const q=[o[0]+d[0]*t-n.x,o[1]+d[1]*t-n.y,o[2]+d[2]*t-n.z];if(Math.hypot(...q)<2.5&&(!best||t<best.t))best={t,n};}
 if(best)return {node:best.n,p:[best.n.x,best.n.y,best.n.z]};const g=rayGround(o,d,40);return g?{p:[g.p[0],g.p[1]+.3,g.p[2]]}:null;}
function railCost(L){const n=Math.max(1,Math.ceil(L/RAIL.per));const c={};for(const [k,v] of Object.entries(RAIL.cost))c[k]=v*n;return c;}
BUILD.railAction=function(){const t=railTarget();if(!t)return;if(!BUILD.railA){if(!t.node){UI.toast('Start from a station end or a track end','warn');return;}BUILD.railA=t.node;UI.hint('Now tap where the track goes');AUDIO.click();return;}

 if(!B){const dx=t.p[0]-A.x,dz=t.p[2]-A.z,l=Math.hypot(dx,dz);B={id:'n'+(S.nextId++),x:t.p[0],y:t.p[1],z:t.p[2],dx:dx/l,dz:dz/l};RN().push(B);}

function railNeighbors(id){const out=[];for(const r of RL()){if(r.a===id)out.push([r.b,r]);else if(r.b===id)out.push([r.a,r]);}return out;}
function railPath(fromSt,toSt){const A=FAC.b.get(fromSt),B=FAC.b.get(toSt);if(!A||!B)return null;const sa=stationNodes(A),sb=stationNodes(B);const goal=new Set(sb);const prev=new Map(sa.map(n=>[n,null]));const q=sa.slice();
 while(q.length){const id=q.shift();if(goal.has(id)&&!sa.includes(id))break;for(const [nb,r] of railNeighbors(id))if(!prev.has(nb)&&!(r.inner&&sa.includes(id)&&sa.includes(nb))){prev.set(nb,[id,r]);q.push(nb);}}
 let end=[...goal].find(g=>prev.has(g));if(!end)return null;const segs=[];let cur=end;while(prev.get(cur)){const [p,r]=prev.get(cur);segs.unshift({r,fwd:r.a===p});cur=p;}
 const pts=[];for(const sgm of segs){const c=railC(sgm.r);if(!c)return null;const P=sgm.fwd?c.pts:c.pts.slice().reverse();for(const p of P)if(!pts.length||Math.hypot(p[0]-pts[pts.length-1][0],p[2]-pts[pts.length-1][2])>.3)pts.push(p);}
 const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1],pts[i][2]-pts[i-1][2]));return {pts,cum,len:cum[cum.length-1]};}
function pathAt(P,s){s=clamp(s,0,P.len);let lo=0,hi=P.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(P.cum[m]<s)lo=m;else hi=m;}const a=P.pts[lo],b=P.pts[hi],seg=P.cum[hi]-P.cum[lo]||1,t=(s-P.cum[lo])/seg;return {p:[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)],yaw:Math.atan2(b[0]-a[0],b[2]-a[2])};}
function trainUpdate(dt){for(const tr of (S.trains||[])){if(!tr.stops||tr.stops.length<2){continue;}if(tr.wait>0){tr.wait-=dt;continue;}
  let P=TR.paths.get(tr.id);if(!P){if(!tr.docked){const cur=FAC.b.get(tr.stops[tr.si%tr.stops.length]);if(cur)trainDock(tr,cur);tr.docked=true;tr.wait=4;continue;}tr.docked=false;const a=tr.stops[tr.si%tr.stops.length],b=tr.stops[(tr.si+1)%tr.stops.length];P=railPath(a,b);tr.s=0;tr.spd=0;if(!P){tr.blocked=true;continue;}tr.blocked=false;TR.paths.set(tr.id,P);}
  const left=P.len-tr.s;const max=28;tr.spd=left<40?Math.max(3,Math.min(tr.spd,left*.7)):Math.min(max,tr.spd+dt*5);tr.s+=tr.spd*dt;
  if(tr.s>=P.len){tr.si=(tr.si+1)%tr.stops.length;TR.paths.delete(tr.id);tr.wait=6;const st=FAC.b.get(tr.stops[tr.si]);if(st)trainDock(tr,st);tr.docked=true;MSND.shot('chug',st||{x:0,z:0});}}}
function trainDock(tr,b){const cap=1600*(tr.cars||2),cnt=o=>Object.values(o).reduce((a,c)=>a+c,0);if(b.mode==='unload'){for(const [k,n] of Object.entries(tr.cargo)){const m=Math.min(n,BUILDINGS.trainst.cap-cnt(b.store));if(m>0){b.store[k]=(b.store[k]||0)+m;tr.cargo[k]-=m;}if(!tr.cargo[k])delete tr.cargo[k];}}
 else{for(const [k,n] of Object.entries(b.store)){const m=Math.min(n,cap-cnt(tr.cargo));if(m<=0)break;tr.cargo[k]=(tr.cargo[k]||0)+m;b.store[k]-=m;if(!b.store[k])delete b.store[k];}}}
function trainPose(tr){const P=TR.paths.get(tr.id);if(P)return k=>pathAt(P,tr.s-k);const st=FAC.b.get(tr.stops?tr.stops[tr.si%tr.stops.length]:tr.home)||FAC.b.get(tr.home);if(!st)return null;const n=stationNodes(st);const A=RN().find(x=>x.id===n[0]),B=RN().find(x=>x.id===n[1]);
 return k=>{const t=clamp(1-k/16,0,1);return {p:[lerp(A.x,B.x,t),A.y,lerp(A.z,B.z,t)],yaw:Math.atan2(B.x-A.x,B.z-A.z)};};}
