['Improved','Jeans now have a belt, rivets, back pockets and a stacked hem over leather work boots with laces'],
['Improved','Hats rebuilt too: stitched bucket hat, six-panel ball cap, braided captain\'s hat, woven straw, knit beanie with a pom-pom and a felt ranger hat'],
['Fixed','Fixed the shaking when driving boats fast, especially on the Gulf']]},
{v:'0.1.8',date:'October 2026',title:'Hook, line and sinker',items:[
['New','Hooks. Bait now has to go on a hook, sold in packs at the tackle shop next to the line. Small hooks for panfish, big circle hooks for monsters. A hook that\'s too big gets ignored by small fish, and one that\'s too small can straighten out on a big one. You lose a hook when your line snaps. Everyone starts with a few packs. Pick your hook in the tackle box'],
['Improved','Boat windshields and windows are see-through glass, and driving from a console in first person puts your eyes up over the windshield'],
['New','Live bait: put a small fish you just caught on as live bait (🪝 on the catch card, H on a keyboard). Only predators over three times its size will take it, bites are slower to come, and the hook has to suit the fish you\'re after'],
]},
{v:'0.1.7',date:'October 2026',title:'Company on the water',items:[
['New','Voice chat in online rooms. The small 🎙 button cycles: mute yourself, mute everyone, back on (B on a keyboard). Turn voice off completely in Settings'],
['New','Quick text chat: tap 💬 (T on a keyboard) to type a message. Messages pop up at the top of everyone\'s screen'],
['Improved','Every boat from the jon boat up seats at least two. The marsh skiff is rebuilt with a T-top, a cooler seat behind the console, a padded stern bench for passengers and a raised bow casting deck. Passengers on the flats skiff, bay boat and center console get proper seats of their own'],
['Improved','Kayak and canoe paddling looks real: the kayak paddle rolls and sweeps blade by blade; the canoe uses a single-blade J-stroke that switches sides'],
['Improved','A strike is now loud and unmistakable, with a strong vibration on phones that support it. The reel button trembles when something nibbles'],
['Improved','Bites take longer to come'],
['New','Walk around with your catch in hand until you decide what to do with it. Small fish are held up in one hand'],
['New','Keeping a fish now plays a silly animation. Turn it off in Settings if it\'s not your style'],
['Fixed','First-person view on a moving boat no longer jitters'],
]},
{v:'0.1.6',date:'October 2026',title:'Smoother sailing',items:[
['Improved','Big frame-rate gains: towns, docks and shop interiors are only drawn when they can be seen, and the ocean surface is split into tiles'],
['New','Auto resolution (Settings → Graphics, on by default) lowers the resolution a little when the frame rate dips and sharpens back up when it recovers'],
['Improved','While running fast, water reflections and shadows skip tiny details nobody can see at speed'],
['New','Full computer controls: click the game to capture the mouse, then just move it to look around. WASD to move and drive, Space to jump, hold left click to cast and reel, mouse wheel to zoom'],
['New','Every on-screen button has a key: E talk, shop, board or take the helm · Q step off · X jump in · Z switch seats · G fill up · Y call a tow · F twitch or bow · R reel in · 1-3 reel speed · L tackle · M map · N sonar · U quests · J journal · C cooler · K checkout · P photo mode · V view · Esc menu · Enter confirms. Key hints show on the buttons'],
['New','Pop-ups work from the keyboard too. On the catch card E or Enter keeps the fish, R releases it, B cuts bait and S shares. Talking to people: E continues and the numbers pick a choice. Yes/no questions: Enter for yes, Esc for no'],
]},
{v:'0.1.5',date:'October 2026',title:'Patience pays',items:[
['Improved','Fish no longer bite the instant your bait lands. Bites take anywhere from a few seconds to a long wait, and a quiet spot can still turn on later in the cast'],
['Improved','Offshore, every fish feeds at its own depth: mahi, sailfish and kings near the surface; snapper and grouper down on the reef; hammerheads and bluefin in the middle; swordfish deep in The Abyss by day, rising at night'],
['New','On the Gulf the bait-depth slider goes down to 200 ft for floats and drifted live baits, and your line depth shows while you wait'],
['Improved','Fuel lasts much longer, and bigger boats carry bigger tanks. Tank size is listed at the dealer'],
['Improved','Each map has its own player leaderboard'],
['Improved','Every fish now lives where it really would: big gamefish only in deep water, reef fish on the reefs, panfish in the shallows. The journal shows both the depth a fish feeds at and the water depth you will find it in. The biggest of each species come from the deeper end of its range'],
['Improved','Fights are tougher and different every time. Fish can be runners, bulldogs that dive deep, circlers or jumpers. Big fish, especially offshore, fight much longer, take line even on heavy tackle, and can find their second wind more than once'],
['Improved','Boats look finished: moulded cockpit walls, capped gunwales, padded bolsters, flush rod holders, scuppers and side storage pockets. The open stern on some hulls is now a proper transom'],
['New','Tap the sonar to shrink it to a small button. Tap it again to bring it back'],
['Improved','A fish held in your hands lies still and kicks now and then, instead of swimming in the air'],
['Improved','Whales and dolphins are rarer, so seeing one feels special. Dolphins no longer follow your boat'],
]},
{v:'0.1.4',date:'October 2026',title:'Into the deep',items:[
['New','The Gulf ocean is half again as big and far deeper, with The Abyss canyon and the Far Blue out past the shelf'],
['New','Deep-water giants: shortfin mako, great hammerhead, swordfish, Atlantic bluefin tuna and a new legend lurking in The Abyss'],
['New','Not just fish: catch squid, octopus, blue crabs, spiny lobster and stingrays on the Gulf, plus crayfish and snapping turtles on the lake'],
['New','New baits and lures for the big ones: live squid, live bonito, stingray wing, bonito chunks, a deep-drop glow rig, cedar plugs, spreader bars and a glow squid jig'],
['New','Whales surface, blow and breach offshore, and dolphin pods pass by out in deep water'],
['New','Birds overhead on both maps: geese in V formation and ospreys that dive for fish on the lake; pelicans that crash-dive for bait, gulls that follow your boat and frigatebirds on the Gulf'],
['New','Better gear unlocks as you level up. Each map has its own level requirements'],
['Improved','Hooked fish leap clear of the water, and billfish and tarpon tail-walk. The camera swings round to catch the jump'],
['Improved','Moving between the helm and the fishing seat now means standing up and walking round the console instead of sliding through it'],
['Improved','Every fish looks more lifelike, with real scales, wet highlights, a silver sheen and see-through fins'],
['Improved','More detailed boats: moulded consoles with grab rails, compass and throttle, upholstered seats, deck hatches, lifting strakes, spray rails, registration numbers, trim tabs, transducers, antennas and anchors'],
]},
{v:'0.1.3',date:'October 2026',title:'Fair play',items:[
['New','New anti-cheat protections and moderation tools have been implemented to help keep the game fair.'],
]},
{v:'0.1.2',date:'October 2026',title:'A fresh start on the Gulf',items:[
['Improved','The Gulf Coast plays like a brand-new game: its own money, level, tackle, clothes, cooler, stats, journal and achievements'],
['Improved','Nothing from the lake carries over to the Gulf, and everything at the lake is waiting when you drive back'],
['Fixed','If your Gulf save picked up a copy of your lake progress, it has been reset to a fresh start. Your lake progress is untouched'],
['Improved','The leaderboard tracks your Lantern Lake career'],
]},
{v:'0.1.1',date:'October 2026',title:'Gulf Coast fixes',items:[
['Fixed','You can now walk the whole marina pier out to the fuel dock (it used to drop you in the water)'],
['Fixed','Removed channel markers that were sitting inside the marina'],
['Improved','The Gulf is a fresh start: it has its own money, level, gear and cooler, separate from the lake'],
['Boats','You start on the Gulf with a flats skiff, so you have a motor from day one'],
['New','The Gulf Coast unlocks at level 15'],
['Improved','Boat dealers show their boats spaced out on two shelves instead of piled on top of each other'],
]},
{v:'0.1.0',date:'October 2026',title:'The Gulf Coast',items:[
['New','A second map: the Gulf Coast. Drive there from the map screen (or the main menu) and back whenever you like'],
['New','Each map is its own career with its own money, level, gear, boats and quests'],
['New','Pelican Point Marina: a big dock out over the water with a bait & tackle shop, fish house, boat dealer, outfitter and taxidermist'],
['New','A bay with grass flats, mangrove keys, oyster bars and a mangrove creek, a barrier island with a fishing pier and a lighthouse, two passes out to the Gulf, reefs, a sunken wreck, an old gas platform and the bluewater edge'],
['New','41 saltwater species, from pinfish and redfish to tarpon, mahi, tuna, sailfish and blue marlin, plus 5 new legends'],
['New','Saltwater tackle: live shrimp, crabs, cut bait, jigs, spoons and trolling lures, plus heavy rods, big-game reels and heavy line'],
['New','Trolling: cast a trolling lure, then push the stick forward to cruise slowly while it works behind the boat'],
['Boats','New Gulf boats: flats skiff, bay boat and a 28 ft center console'],
['Boats','Two big boats you can walk around on: the Gulf Star head boat and a 42 ft sportfisher with a salon and flybridge'],
['Boats','Walk the deck, climb the stairs, fish from any rail, then head to the wheel to drive'],
['Online','Friends can board your big boat, walk around it with you, and anyone aboard can take the wheel'],
['New','A quest line for the Gulf, dolphins in the bay and pelicans overhead'],
['Improved','Freshwater bait barely works in salt water (and the other way round), so stock up at the local shop'],
]},
{v:'0.0.4',date:'October 2026',title:'Cloud saves & fuel',items:[
['New','Cloud saves: sign in with Google in Settings and your progress follows you to any device'],
['New','Transfer codes: no account needed, make a code and type it on another device to move your save'],
['New','Tap the map to drop a 📍 waypoint, and tap it again to remove it. It shows on the mini map and out on the water'],
['New','Fuel: boats burn gas as you drive. Fill up at the pump on the village dock'],
['New','Out of gas? Call a tow and you\'ll be brought back to the marina'],
['New','Fish can get a second wind and make one last run right before you land them'],
['Improved','You can pay anywhere in a shop now, not just at the counter'],
['Improved','If you try to leave a shop with items in your cart, you\'ll be asked to pay or put them back'],
['Improved','Smoother boat wakes: the foam trail stays attached to the boat instead of stepping behind it'],
]},
{v:'0.0.3',date:'October 2026',title:'Tidier boat buttons',items:[
['Improved','The seat switch button is smaller'],
['Improved','"Step ashore" only shows when you\'re close enough to land or a dock'],
['Improved','The aiming circle hides while you\'re in the driver\'s seat'],
['New','You can see a hooked fish fighting when it comes up near the surface'],
['New','A small speed gauge (mph) next to the mini map while you drive a boat or vehicle'],
]},
{v:'0.0.2',date:'October 2026',title:'Seats & shop fixes',items:[
['Boats','New "Fishing seat" / "Driver\'s seat" button when your boat is stopped'],
['Boats','The cast button only appears once you\'re in the fishing seat'],
['New','Shops switch to first person when you walk in'],
['Fixed','Shop roofs: added proper ceilings with beams and lights, so there are no more holes'],
['Fixed','Water no longer shows up inside boats'],
['Fixed','Outboard motors were missing their tops'],
]},
{v:'0.0.1',date:'October 2026',title:'The Big One',items:[
['New','Main menu with patch notes, leaderboard, message board and settings'],
['New','Character creator: choose a man or woman, figure, height, skin, hair, facial hair, eyes and clothes'],
['New','First-person view (tap the 👁 button or press V)'],
['New','Swimming: jump off your boat anywhere, swim, and climb back aboard'],
['New','Vehicles: buy a bicycle, golf cart or ATV at Bea\'s Marina'],
['New','Walk-in shops with full interiors: browse the shelves, fill your cart and pay at the counter'],
['New','Ride in a friend\'s boat online and fish from their seats'],
['New','Message board: post ideas and vote on other players\' ideas'],
['New','Tap a name on the leaderboard to see that angler\'s full stats'],
['New','Fast travel to town, the village dock or your cabin from the map'],
['New','Cooler full? Swap your new catch with a fish already in the cooler'],
['New','Tap a fish in your cooler to see its details and hold it up'],
['New','Lots more tackle and bait: new lures, live baits, rods, reels and lines'],
['Boats','Boats rise up and plane out as they speed up'],
['Boats','Boats push real wakes and waves across the water'],
['Boats','Real seats: your angler moves to the fishing seat to fish and back to the driver\'s seat to drive'],
['Boats','Rebuilt the back of the John boat'],
['Improved','Far more realistic fish models'],
['Improved','More natural walking, running and idle animations'],
['Improved','Rebuilt the boathouse by the dock, your cabin and every shop in town'],
['Improved','Boats now bump into AI boats and other players\' boats instead of passing through'],
['Improved','The cast button only shows when you\'re close enough to the water to cast'],
['Improved','You have to jump off the dock to go for a swim, so no more falling in by accident'],
['Fixed','Pushing the movement stick against a running fish now works, with a clear "turn it" meter'],
['Fixed','Creating a room now shows what went wrong instead of doing nothing'],
['Removed','The extra map button (tap the mini map instead)'],
]},
];
