['New','The red zone on the tension bar now shows where your drag starts to slip, and the line readout warns when the drag is singing or the spool is running low'],
['Changed','The engine on/off key is gone. The engine simply runs while you are aboard and still burns a little fuel at idle. Bumping into things no longer stalls it']]},
{v:'0.3.7',date:'October 2026',title:'Line out',items:[
['Fixed','Moving away from your lure now lets line peel off the reel, so the distance grows like it shrinks when you move toward it. The lure gets tugged along a little by the drag, and is towed behind once you run out of extra line']]},
{v:'0.3.6',date:'October 2026',title:'Steady frames',items:[
['Fixed','A camera glitch could make the game skip drawing frames (a stutter or freeze on the boat). The game now recovers on the same frame and keeps drawing'],

{v:'0.3.5',date:'October 2026',title:'Crash reports',items:[
['New','Crash reports: if the game crashes, freezes or closes on its own, the next time you open it a report is saved and sent automatically, so the problem can be tracked down and fixed'],
['New','Each report says what was happening (map, boat, multiplayer room, how smooth the game was running) and the most likely cause in plain words'],
['New','See your own reports in Settings → Crash reports, with Copy and Send now buttons']]},
{v:'0.3.4',date:'October 2026',title:'Hard knocks',items:[
['New','Hitting something hard stalls the engine. Restart it from the driver\'s seat'],
['Fixed','In multiplayer, everyone now sees your outboard swing as you steer, and your trolling motor and fish finder show on your boat for friends too'],
['Improved','Crash protection: if a phone runs low on graphics memory the game saves, drops the graphics one step and reloads by itself instead of freezing'],

{v:'0.3.3',date:'October 2026',title:'Paddle straight',items:[

{v:'0.3.2',date:'October 2026',title:'Hands on the key',items:[

['Improved','No Quit game button on phones and tablets, where you just swipe the app away']]},
{v:'0.3.0',date:'October 2026',title:'Shipshape',items:[

{v:'0.2.7',date:'October 2026',title:'Pause',items:[

{v:'0.1.5',date:'October 2026',title:'Patience pays',items:[
['Improved','Fish no longer bite the instant your bait lands. Bites take anywhere from a few seconds to a long wait, and a quiet spot can still turn on later in the cast'],

['Improved','Fuel lasts much longer, and bigger boats carry bigger tanks. Tank size is listed at the dealer'],
['Improved','Each map has its own player leaderboard'],
['Improved','Every fish now lives where it really would: big gamefish only in deep water, reef fish on the reefs, panfish in the shallows. The journal shows both the depth a fish feeds at and the water depth you will find it in. The biggest of each species come from the deeper end of its range'],
['Improved','Fights are tougher and different every time. Fish can be runners, bulldogs that dive deep, circlers or jumpers. Big fish, especially offshore, fight much longer, take line even on heavy tackle, and can find their second wind more than once'],
['Improved','Boats look finished: moulded cockpit walls, capped gunwales, padded bolsters, flush rod holders, scuppers and side storage pockets. The open stern on some hulls is now a proper transom'],
['New','Tap the sonar to shrink it to a small button. Tap it again to bring it back'],
['Improved','A fish held in your hands lies still and kicks now and then, instead of swimming in the air'],
['Improved','Whales and dolphins are rarer, so seeing one feels special. Dolphins no longer follow your boat'],
]},
{v:'0.1.4',date:'October 2026',title:'Into the deep',items:[
['New','The Gulf ocean is half again as big and far deeper, with The Abyss canyon and the Far Blue out past the shelf'],
['New','Deep-water giants: shortfin mako, great hammerhead, swordfish, Atlantic bluefin tuna and a new legend lurking in The Abyss'],

{v:'0.1.3',date:'October 2026',title:'Fair play',items:[
