{v:'0.1.9',date:'October 2026',title:'Dressed for the water',items:[

{v:'0.1.8',date:'October 2026',title:'Hook, line and sinker',items:[

{v:'0.1.7',date:'October 2026',title:'Company on the water',items:[

{v:'0.1.5',date:'October 2026',title:'Patience pays',items:[
['Improved','Fish no longer bite the instant your bait lands. Bites take anywhere from a few seconds to a long wait, and a quiet spot can still turn on later in the cast'],

['Improved','A fish held in your hands lies still and kicks now and then, instead of swimming in the air'],

]},
{v:'0.1.4',date:'October 2026',title:'Into the deep',items:[
['New','The Gulf ocean is half again as big and far deeper, with The Abyss canyon and the Far Blue out past the shelf'],

{v:'0.1.3',date:'October 2026',title:'Fair play',items:[
['New','New anti-cheat protections and moderation tools have been implemented to help keep the game fair.'],

{v:'0.1.2',date:'October 2026',title:'A fresh start on the Gulf',items:[
