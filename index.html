<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lantern Lake">
<meta name="description" content="Lantern Lake — a 3D open-world fishing adventure. Explore a living lake, master real techniques, chase legends.">
<title>Lantern Lake</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark;--ink:#f6eedc;--muted:#b4bdb3;--dim:#7f8a83;--gold:#f2b84b;--gold2:#ffd98a;--teal:#47c3b2;--red:#ec6a50;--green:#7bd389;--blue:#6fb6ff;--glass:rgba(12,20,24,.72);--glass2:rgba(18,28,32,.9);--line:rgba(255,236,200,.14);--r:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1214;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.h{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:.2px}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui>*{pointer-events:auto}
.hide{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.25)}
/* ---- HUD ---- */
#hudTL{position:absolute;left:calc(10px + var(--safe-l));top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(58vw,330px)}
#stat{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 7px;pointer-events:auto}
#lvl{position:relative;width:40px;height:40px;flex:none}
#lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
#lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--gold2)}
#money{font-weight:800;font-size:17px;color:var(--gold2);letter-spacing:.3px}
#clock{font-size:12px;color:var(--muted);white-space:nowrap}
#zoneTag{font-size:12px;padding:5px 10px;border-radius:999px;align-self:flex-start;color:var(--ink);opacity:.95}
#quest{padding:8px 11px;font-size:12px;line-height:1.35;pointer-events:auto;cursor:pointer}
#quest b{display:block;color:var(--gold2);font-size:12.5px;margin-bottom:1px}
#quest .qd{color:var(--muted)}
#quest .arrow{display:inline-block;margin-right:6px;color:var(--gold);transition:transform .2s}
#hudTR{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:108px;height:108px;border-radius:50%;overflow:hidden;position:relative;border:2px solid rgba(255,230,180,.35);box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
#mini canvas{width:100%;height:100%;display:block}
#mini .n{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--gold2);text-shadow:0 1px 2px #000}
.trBtns{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px}
.ibtn:active{transform:scale(.94)}
/* action cluster */
#act{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(16px + var(--safe-b));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:end;justify-items:end;gap:10px}
#primary{grid-column:2;grid-row:2;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a1,#f2b84b 55%,#c98a24);color:#2a1d08;font-weight:900;font-size:15px;letter-spacing:.8px;box-shadow:0 8px 24px rgba(242,184,75,.35),inset 0 -4px 0 rgba(0,0,0,.18);display:grid;place-items:center;text-align:center;line-height:1.05;position:relative;touch-action:none}
#primary small{display:block;font-size:10px;font-weight:700;opacity:.75;letter-spacing:.3px}
#primary.pressed{transform:scale(.95);filter:brightness(1.08)}
#primary.strike{background:radial-gradient(circle at 35% 30%,#ffb3a1,#ec6a50 55%,#b33a24);color:#fff;animation:pulse .35s infinite alternate}
#primary.reel{background:radial-gradient(circle at 35% 30%,#a9f0e4,#47c3b2 55%,#1f8a7c);color:#062420}
#primary.bow{background:radial-gradient(circle at 35% 30%,#d8c6ff,#9b7cf0 55%,#6343c0);color:#fff;animation:pulse .3s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#side{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
#ctx{grid-column:1/3;grid-row:1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{min-height:44px;padding:0 15px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.4px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.pill.gold{background:linear-gradient(180deg,#ffe3a1,#f2b84b);color:#2a1d08;border:0}
.pill.teal{background:linear-gradient(180deg,#8fe6da,#47c3b2);color:#062420;border:0}
.pill:active{transform:scale(.95)}
#lureChip{min-height:44px;padding:4px 12px 4px 6px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:12px;max-width:190px}
#lureChip .dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:16px;flex:none}
#lureChip b{display:block;font-size:12.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
#lureChip small{color:var(--muted)}
#speedSeg{display:flex;border-radius:999px;overflow:hidden;padding:3px;gap:3px}
#speedSeg button{min-width:44px;height:38px;border-radius:999px;font-size:11px;font-weight:800;color:var(--muted)}
#speedSeg button.on{background:var(--teal);color:#062420}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,240,210,.25);background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.02));pointer-events:none;z-index:3}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,240,210,.35);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#joyHint{position:absolute;left:calc(26px + var(--safe-l));bottom:calc(26px + var(--safe-b));width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,240,210,.18);display:grid;place-items:center;font-size:11px;color:rgba(255,240,210,.45);text-align:center;pointer-events:none;line-height:1.3}
/* fishing hud */
#power{position:absolute;right:calc(124px + var(--safe-r));bottom:calc(28px + var(--safe-b));width:22px;height:170px;border-radius:12px;padding:3px;pointer-events:none}
#power .bar{position:relative;width:100%;height:100%;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
#power .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#47c3b2,#f6eedc)}
#power .lz{position:absolute;left:-2px;right:-2px;background:rgba(255,210,100,.45);border:2px solid #ffd98a;border-radius:4px;box-shadow:0 0 12px #ffd98a}
#fishPanel{position:absolute;left:calc(var(--safe-l) + 300px);right:calc(var(--safe-r) + 136px);margin:0 auto;max-width:440px;top:calc(10px + var(--safe-t));padding:10px 14px;pointer-events:none;text-align:center}
#fishPanel .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:4px 0}
#fishPanel .row b{color:var(--ink);font-size:12px;min-width:62px;text-align:left}
.meter{flex:1;height:12px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .08s linear}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(236,106,80,.28)}
#fpStatus{font-weight:800;font-size:13.5px;color:var(--ink);margin-bottom:4px}
#fpDir{font-size:20px;font-weight:900;color:var(--gold2);height:24px}
#flash{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-family:'Fraunces',Georgia,serif;font-size:clamp(28px,7vw,52px);font-weight:700;text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s}
#flash.on{opacity:1;animation:pop .35s}
#flash.gold{color:var(--gold2)}#flash.good{color:#bff2cf}#flash.bad{color:#ffb4a4}#flash.warn{color:#ffe0a0}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7)}to{transform:translate(-50%,-50%) scale(1)}}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,460px)}
.toast{padding:9px 15px;border-radius:12px;font-size:13px;font-weight:700;animation:tin .25s;max-width:100%;text-align:center}
.toast.money{color:var(--gold2)}.toast.warn{color:#ffd9a0}.toast.good{color:#bff2cf}.toast.quest{color:#cfe8ff}.toast.ach{color:var(--gold2)}.toast.gold{color:var(--gold2)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#banner{position:absolute;left:50%;top:max(14%,calc(70px + var(--safe-t)));transform:translateX(-50%);text-align:center;pointer-events:none;width:min(90vw,560px);padding:18px 24px;opacity:0;transition:opacity .4s}
#banner.on{opacity:1}
#banner .t{font-family:'Fraunces',Georgia,serif;font-size:clamp(26px,5vw,40px);color:var(--gold2);font-weight:700}
#banner .s{color:var(--ink);margin-top:6px;font-size:14px;line-height:1.4}
/* labels */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;background:rgba(12,20,24,.62);border:1px solid var(--line);color:var(--ink);transition:opacity .2s}
.lbl.npc{background:rgba(242,184,75,.85);color:#2a1d08;border:0}
.lbl.q{background:rgba(111,182,255,.9);color:#06223a;border:0}
.lbl.lan{background:rgba(127,243,255,.85);color:#07343a;border:0}
#aim{position:absolute;width:34px;height:34px;margin:-17px;border:2px solid rgba(255,220,150,.9);border-radius:50%;pointer-events:none;box-shadow:0 0 12px rgba(255,210,120,.5)}
#aim.lucky{border-color:#7ff3ff;box-shadow:0 0 14px #7ff3ff}
/* sonar */
#sonar{position:absolute;left:calc(10px + var(--safe-l));top:50%;transform:translateY(-50%);width:170px;padding:6px;pointer-events:none}
#sonar canvas{width:100%;height:96px;border-radius:9px;display:block;background:#04121a}
#sonar small{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:3px 2px 0}
#tourn{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + var(--safe-t));padding:8px 12px;min-width:220px;font-size:12px}
#tourn .tt{display:flex;justify-content:space-between;font-weight:800;color:var(--gold2);margin-bottom:4px}
#tourn .r{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}#tourn .r.me{color:var(--ink);font-weight:800}
/* sheets & modals */
.sheet{position:absolute;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);width:min(560px,calc(100vw - 20px));padding:16px 18px;animation:sup .25s;z-index:5}
@keyframes sup{from{transform:translate(-50%,30px);opacity:0}}
#dialog .who{font-family:'Fraunces',Georgia,serif;font-size:20px;color:var(--gold2)}
#dialog .who small{font-family:'Nunito',sans-serif;font-size:12px;color:var(--muted);margin-left:8px}
#dialog p{margin:8px 0 12px;font-size:14.5px;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:12px;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,#ffe3a1,#f2b84b);color:#2a1d08;border:0}
.btn.teal{background:linear-gradient(180deg,#8fe6da,#47c3b2);color:#062420;border:0}
.btn.red{background:rgba(236,106,80,.2);border-color:rgba(236,106,80,.5);color:#ffc3b5}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.97)}
#reveal{width:min(520px,calc(100vw - 20px));text-align:left}
#reveal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#reveal .nm{font-family:'Fraunces',Georgia,serif;font-size:26px;line-height:1.1}
#reveal .rar{font-size:12px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
#reveal .stars{color:var(--gold2);font-size:15px;letter-spacing:2px}
#reveal .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
#reveal .stats div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px;text-align:center}
#reveal .stats b{display:block;font-size:16px}#reveal .stats small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10.5px;font-weight:900;padding:4px 8px;border-radius:999px;background:rgba(242,184,75,.18);color:var(--gold2);letter-spacing:.6px}
.badge.b{background:rgba(111,182,255,.18);color:#bfe0ff}.badge.g{background:rgba(123,211,137,.18);color:#bff2cf}
#reveal .fact{font-size:13px;color:var(--muted);line-height:1.45;margin:2px 0 12px;font-style:italic}
#modal{position:absolute;inset:0;background:rgba(5,10,12,.55);display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));z-index:8}
#modal .box{width:min(980px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden;background:var(--glass2)}
#modal header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#modal header .ttl{font-family:'Fraunces',Georgia,serif;font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal header .cash{font-weight:900;color:var(--gold2);font-size:15px}
#modal nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#modal nav::-webkit-scrollbar{display:none}
#modal nav button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);background:rgba(255,255,255,.04)}
#modal nav button.on{background:var(--gold);color:#2a1d08}
#modal .body{flex:1;overflow-y:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:6px;position:relative}
.card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.card.locked{opacity:.55}
.card h4{margin:0;font-size:15px;font-family:'Fraunces',Georgia,serif;font-weight:600}
.card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.card .price{font-weight:900;color:var(--gold2)}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.card .tag{position:absolute;top:9px;right:9px;font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;background:rgba(123,211,137,.2);color:#bff2cf}
.card img{width:100%;height:auto;border-radius:9px;background:linear-gradient(180deg,rgba(80,140,150,.18),rgba(20,50,60,.25))}
.fishcard img{aspect-ratio:2/1;object-fit:contain}
.sect{font-family:'Fraunces',Georgia,serif;font-size:18px;color:var(--gold2);margin:16px 2px 8px}
.sect:first-child{margin-top:2px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:7px;font-size:13px}
.row2 .l{flex:1;min-width:0}.row2 .l b{display:block;font-size:14px}.row2 .l small{color:var(--muted)}
.prog{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#47c3b2,#f2b84b);border-radius:5px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:inline-block}
.swatch.on{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold2)}
input[type=range]{width:100%;accent-color:var(--gold)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.setrow label{flex:1}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{min-height:36px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.06);font-weight:800;font-size:12px;color:var(--muted)}.seg button.on{background:var(--teal);color:#062420}
#mapWrap{position:relative;width:100%;aspect-ratio:1/1;max-width:640px;margin:0 auto;border-radius:14px;overflow:hidden;touch-action:none}
#mapWrap canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:10px 2px;justify-content:center}
/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,rgba(0,0,0,0),rgba(0,0,0,.55));z-index:10;text-align:center;padding:20px}
#title .logo{font-family:'Fraunces',Georgia,serif;font-size:clamp(46px,11vw,96px);font-weight:700;line-height:.95;color:#fff4dc;text-shadow:0 6px 40px rgba(0,0,0,.55),0 0 60px rgba(255,200,110,.35)}
#title .logo span{color:var(--gold2)}
#title .sub{margin:12px 0 26px;font-size:clamp(13px,2.4vw,17px);color:#eadfc8;text-shadow:0 2px 10px #000;letter-spacing:.4px}
#title .btns{flex-direction:column;align-items:center;gap:10px}
#title .btn{min-width:230px;min-height:52px;font-size:16px;backdrop-filter:blur(8px)}
#title .foot{position:absolute;bottom:calc(14px + var(--safe-b));font-size:11.5px;color:rgba(255,240,220,.6);text-shadow:0 1px 4px #000;padding:0 16px}
#loading{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#1d3a3a,#0a1416);color:var(--ink);gap:16px;text-align:center;padding:20px}
#loading .logo{font-family:'Fraunces',Georgia,serif;font-size:clamp(40px,9vw,70px);font-weight:700;color:#fff4dc}
#loading .logo span{color:var(--gold2)}
#loading .lb{width:min(320px,70vw);height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#loading .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#47c3b2,#f2b84b);transition:width .2s}
#loading small{color:var(--muted);font-size:13px}
#fps{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font:11px monospace;color:#cfe;opacity:.7;pointer-events:none}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);font-size:11px;font-weight:800}
@media (orientation:portrait){#toasts{top:calc(176px + var(--safe-t))}#banner{top:calc(186px + var(--safe-t));padding:12px 16px}#banner .t{font-size:24px}#banner .s{font-size:13px}#flash{top:42%}#primary{width:88px;height:88px}#fishPanel{top:calc(132px + var(--safe-t));left:12px;right:12px}#tourn{top:calc(132px + var(--safe-t))}#hudTL{max-width:calc(100vw - 150px)}#sonar{top:auto;bottom:calc(210px + var(--safe-b));transform:none;width:150px}}

const WEATHERS={

 sunCol:[1,1,1],skyCol:[.3,.4,.6],gndCol:[.2,.2,.15],zenith:[.2,.4,.8],horizon:[.6,.7,.9],fogCol:[.6,.7,.8],fogDensity:.0011,cloudOff:[0,0],windDir:[.8,.6],nextWeatherAt:9.5};
const KEYS=[ // elevation sin, sunCol, skyAmb, gnd, zenith, horizon
 [-1.0,[.16,.2,.34],[.03,.042,.08],[.012,.015,.022],[.006,.011,.032],[.03,.046,.09]],
 [-.25,[.17,.21,.36],[.034,.046,.086],[.014,.017,.026],[.008,.014,.04],[.036,.054,.104]],
 [-.08,[.7,.32,.22],[.10,.10,.18],[.06,.05,.06],[.05,.07,.18],[.55,.26,.20]],
 [.03,[1.6,.62,.30],[.28,.25,.32],[.16,.12,.10],[.14,.22,.45],[1.05,.55,.32]],
 [.16,[2.4,1.45,.80],[.36,.40,.52],[.22,.19,.14],[.13,.28,.62],[.85,.72,.62]],
 [.45,[2.9,2.65,2.25],[.30,.40,.60],[.17,.15,.11],[.07,.22,.62],[.50,.65,.85]],
 [1.0,[3.0,2.85,2.55],[.32,.43,.64],[.18,.16,.12],[.05,.20,.60],[.47,.63,.85]],

function interpKeys(e){let i=0;while(i<KEYS.length-2&&e>KEYS[i+1][0])i++;const a=KEYS[i],b=KEYS[i+1],t=smooth(a[0],b[0],e);return [1,2,3,4,5].map(k=>mixc(a[k],b[k],t));}
function sunFromHour(h){// sunrise 5:45, sunset 20:15

function updateEnv(dt,gameMinutes){
 ENV.hour=(gameMinutes/60)%24;ENV.day=Math.floor(gameMinutes/1440)+1;
 // weather transitions
 const cur=WEATHERS[ENV.weather],nx=WEATHERS[ENV.next];ENV.blend=Math.min(1,ENV.blend+dt/40);
 for(const k of ['cloud','dark','rain','wind','fog','sun','wave','storm'])ENV.w[k]=lerp(cur[k],nx[k],smooth(0,1,ENV.blend));
 if(ENV.blend>=1&&ENV.weather!==ENV.next)ENV.weather=ENV.next;
 const s=sunFromHour(ENV.hour);ENV.sunDir=s;ENV.sunElev=s[1];ENV.moonDir=v3.norm([-s[0]*.8+.2,-s[1]*.9+.15,-s[2]*.8]);
 const [sc,sky,gnd,zen,hor]=interpKeys(s[1]);
 const w=ENV.w,grey=lum=>[lum,lum,lum];
 const dim=lerp(1,w.sun,1);
 ENV.night=smooth(.05,-.25,s[1]);
 const key=s[1]>-.06?s:ENV.moonDir;ENV.keyDir=v3.norm([key[0],Math.max(key[1],.08),key[2]]);

 const cloudAmb=1+w.cloud*.35-w.dark*.45;
 ENV.skyCol=mixc(sky,grey((sky[0]+sky[1]+sky[2])/3),w.cloud*.6).map(v=>v*cloudAmb);
 ENV.gndCol=gnd.map(v=>v*(1-w.dark*.3));
 ENV.zenith=mixc(zen,grey((hor[0]+hor[1]+hor[2])/3*.75),w.cloud*.8).map(v=>v*(1-w.dark*.55));
 ENV.horizon=mixc(hor,grey((hor[0]+hor[1]+hor[2])/3*.85),w.cloud*.7).map(v=>v*(1-w.dark*.45));
 ENV.fogCol=mixc(ENV.horizon,ENV.skyCol.map(v=>v*1.3),.35);
 if(w.fog>2)ENV.fogCol=mixc(ENV.fogCol,grey((ENV.skyCol[0]+ENV.skyCol[1]+ENV.skyCol[2])/3*1.6),.5);
 ENV.fogDensity=.0008*w.fog*(1+ENV.night*.2);
 const wa=Math.sin(gameMinutes*.002)*.8+1.2;ENV.windDir=[Math.cos(wa),Math.sin(wa)];

}
function rollWeather(){const opts=WEATHER_NEXT[ENV.weather]||['clear'];ENV.next=opts[Math.floor(Math.random()*opts.length)];ENV.blend=ENV.next===ENV.weather?1:0;}
function setWeatherNow(k){ENV.weather=ENV.next=k;ENV.blend=1;}
function timeLabel(h=ENV.hour){const hh=Math.floor(h),mm=Math.floor((h-hh)*60);const ap=hh<12?'AM':'PM';const h12=((hh+11)%12)+1;return h12+':'+String(mm).padStart(2,'0')+' '+ap;}
function timeBand(h=ENV.hour){return h>=4.5&&h<7?'Dawn':h>=7&&h<11?'Morning':h>=11&&h<16?'Midday':h>=16&&h<18.5?'Afternoon':h>=18.5&&h<21?'Dusk':'Night';}
function waveY(x,z,t){const a=ENV.waveAmp||0;return (Math.sin(x*.21+t*1.1)*.5+Math.sin(z*.17-t*.9)*.35+Math.sin((x+z)*.33+t*1.7)*.15)*a;}

function buildTextures(){

 // water normal map (tileable, sum of integer-frequency waves)

 for(let k=0;k<48;k++){let fx=Math.round((rnd()-.5)*18),fy=Math.round((rnd()-.5)*18);if(!fx&&!fy)fx=1;const f=Math.hypot(fx,fy);waves.push([fx,fy,rnd()*TAU,1/Math.pow(f,1.15)]);}

function buildTerrainMeshes(){

   // skirts along edges with stride
   const ring=[];for(let i=0;i<=Q;i+=st)ring.push([i,0]);for(let j=st;j<=Q;j+=st)ring.push([Q,j]);for(let i=Q-st;i>=0;i-=st)ring.push([i,Q]);for(let j=Q-st;j>=st;j-=st)ring.push([0,j]);ring.push([0,0]);

const xpFor=l=>Math.round(80*Math.pow(l-1,1.65));

function addXP(n,why){const before=levelOf();S.xp+=Math.round(n);const after=levelOf();if(after>before){for(let l=before+1;l<=after;l++){const p=PERKS.find(p=>p[0]===l);UI.banner('Level '+l+'!',p?('New perk: '+p[1]+' — '+p[2]):'Keep exploring the lake',l);}AUDIO.levelUp();}checkAch();}
function addMoney(n){S.money+=Math.round(n);if(n>0)S.stats.earned+=Math.round(n);UI.money(n);checkAch();}

function fishValue(f,lb,withDemand=true){return Math.max(1,Math.round(f.v*Math.pow(lb,.8)*(1+(f.r-1)*.28)*(withDemand?demandFor(f.id):1)*(1+perk('price'))));}
function fishXP(f,lb){return Math.round(6+f.v*.35*Math.pow(lb,.45)*(1+(f.r-1)*.45));}
function coolerCap(){const b=BOATS.find(b=>b.id===S.boat.type);return Math.max(6,(b?b.cooler:4))+S.boat.up.livewell*4;}

const AUDIO={ctx:null,on:false,t:0,nextBird:2,nextLoon:20,nextFrog:3,nextNote:0,chord:0,engine:null,reelAcc:0};
AUDIO.init=function(){if(AUDIO.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();AUDIO.ctx=ctx;
 const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.connect(ctx.destination);
 AUDIO.master=ctx.createGain();AUDIO.master.gain.value=.9;AUDIO.master.connect(comp);

 const sr=ctx.sampleRate,len=sr*2,wb=ctx.createBuffer(1,len,sr),bb=ctx.createBuffer(1,len,sr),w=wb.getChannelData(0),b=bb.getChannelData(0);let last=0;for(let i=0;i<len;i++){w[i]=Math.random()*2-1;last=(last+.02*w[i])/1.02;b[i]=last*3.5;}

 const loop=(buf,filterType,freq,q=1)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;const f=ctx.createBiquadFilter();f.type=filterType;f.frequency.value=freq;f.Q.value=q;const g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AUDIO.amb);s.start();return {s,f,g};};

 // crickets

 // engine
 const e1=ctx.createOscillator();e1.type='sawtooth';const e2=ctx.createOscillator();e2.type='square';const ef=ctx.createBiquadFilter();ef.type='lowpass';ef.frequency.value=600;const eg=ctx.createGain();eg.gain.value=0;e1.connect(ef);e2.connect(ef);ef.connect(eg);eg.connect(AUDIO.sfx);e1.start();e2.start();AUDIO.engine={e1,e2,ef,eg};
 // drag scream
 AUDIO.drag=(()=>{const s=ctx.createBufferSource();s.buffer=wb;s.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=3200;f.Q.value=6;const g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AUDIO.sfx);s.start();return {g,f};})();

AUDIO.applyVolumes=function(){if(!AUDIO.ctx)return;const s=S?S.settings:{sfx:.8,amb:.7,music:.35};AUDIO.sfx.gain.value=s.sfx;AUDIO.amb.gain.value=s.amb;AUDIO.music.gain.value=s.music*.55;};
AUDIO.resume=function(){if(AUDIO.ctx&&AUDIO.ctx.state==='suspended')AUDIO.ctx.resume();};
function env(g,t,a,d,peak=1){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(freq,dur,{type='sine',vol=.2,a=.01,bus='sfx',slide=0,detune=0,when=0}={}){if(!AUDIO.on)return;const c=AUDIO.ctx,t=c.currentTime+when;const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);o.detune.value=detune;const g=c.createGain();env(g,t,a,dur,vol);o.connect(g);g.connect(AUDIO[bus]);o.start(t);o.stop(t+a+dur+.05);}
function noise(dur,{freq=1000,type='lowpass',vol=.3,a=.005,q=1,bus='sfx',slide=0,when=0,brown=false}={}){if(!AUDIO.on)return;const c=AUDIO.ctx,t=c.currentTime+when;const s=c.createBufferSource();s.buffer=brown?AUDIO.brown:AUDIO.white;const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);f.Q.value=q;const g=c.createGain();env(g,t,a,dur,vol);s.connect(f);f.connect(g);g.connect(AUDIO[bus]);s.start(t,Math.random());s.stop(t+a+dur+.05);}

function readMove(){let x=INPUT.jx,y=INPUT.jy;const k=INPUT.keys;if(k.KeyW||k.ArrowUp)y=1;if(k.KeyS||k.ArrowDown)y=-1;if(k.KeyA||k.ArrowLeft)x=-1;if(k.KeyD||k.ArrowRight)x=1;const run=INPUT.run||k.ShiftLeft||k.ShiftRight;return {x,y,run,mag:Math.min(1,Math.hypot(x,y))};}
// ---- walkable surfaces ----
function deckAt(x,z){for(const d of STRUCT.decks)if(x>=d.x0&&x<=d.x1&&z>=d.z0&&z<=d.z1)return d;return null;}
function obbPush(px,pz,r,c){const cs=Math.cos(-c.rot),sn=Math.sin(-c.rot);const dx=px-c.x,dz=pz-c.z;const lx=cs*dx+sn*dz,lz=-sn*dx+cs*dz;const hw=c.w/2,hd=c.d/2;const cx=clamp(lx,-hw,hw),cz=clamp(lz,-hd,hd);let ox=lx-cx,oz=lz-cz,d=Math.hypot(ox,oz);
 if(d>=r)return null;if(d<1e-4){// inside: push out along smallest axis
  const px1=hw-Math.abs(lx),pz1=hd-Math.abs(lz);if(px1<pz1){ox=Math.sign(lx)||1;oz=0;d=0;const nl=[Math.sign(lx)*(hw+r),lz];return back(nl);}else{const nl=[lx,Math.sign(lz)*(hd+r)];return back(nl);}}
 const k=r/d;const nl=[cx+ox*k,cz+oz*k];return back(nl);
 function back([a,b]){const c2=Math.cos(c.rot),s2=Math.sin(c.rot);return [c.x+c2*a+s2*b,c.z-s2*a+c2*b];}}
function cabinLocal(x,z){const C=STRUCT.cabin;if(!C)return null;const c=Math.cos(-C.rot),s=Math.sin(-C.rot),dx=x-C.x,dz=z-C.z;return [c*dx+s*dz,-s*dx+c*dz];}
function cabinCollide(x,z,r){const C=STRUCT.cabin,L=cabinLocal(x,z);if(!L||Math.abs(L[0])>C.w/2+2||Math.abs(L[1])>C.d/2+2)return [x,z];let [lx,lz]=L;const hw=C.w/2,hd=C.d/2,t=.35;
 const walls=[[-hw,-hd,hw,-hd],[-hw,hd,-.75,hd],[.75,hd,hw,hd],[-hw,-hd,-hw,hd],[hw,-hd,hw,hd]];
 for(const [x0,z0,x1,z1] of walls){const dx=x1-x0,dz=z1-z0,tt=clamp(((lx-x0)*dx+(lz-z0)*dz)/(dx*dx+dz*dz),0,1),qx=x0+dx*tt,qz=z0+dz*tt,ox=lx-qx,oz=lz-qz,d=Math.hypot(ox,oz);if(d<r+t){const k=(r+t)/(d||1);lx=qx+ox*k;lz=qz+oz*k;}}
 const c=Math.cos(C.rot),s=Math.sin(C.rot);return [C.x+c*lx+s*lz,C.z-s*lx+c*lz];}
function walkableAt(x,z){const d=deckAt(x,z);if(d)return {y:d.y,deck:true};const h=terrainHeight(x,z),wl=waterLevelAt(x,z);if(wl-h>.55)return null;const n=terrainNormal(x,z);if(n[1]<.5)return null;if(Math.hypot(x,z)>740)return null;return {y:Math.max(h,wl-.55>h?h:h),wade:wl-h>0};}
function resolveWalk(x,z,r=.35){for(const c of STRUCT.colliders){if(c.h===0)continue;if(Math.abs(x-c.x)>c.w+c.d||Math.abs(z-c.z)>c.w+c.d)continue;const p=obbPush(x,z,r,c);if(p){x=p[0];z=p[1];}}for(const n of NPC.list){if(n.hidden)continue;const d=Math.hypot(x-n.x,z-n.z);if(d<.7&&d>0){x=n.x+(x-n.x)/d*.7;z=n.z+(z-n.z)/d*.7;}}[x,z]=cabinCollide(x,z,r);return [x,z];}
function updateWalk(dt){
 const m=readMove(),busy=FISHING.busy();let sp=0;
 if(m.mag>.08&&!busy&&!UI.modal){const ang=CAM.yaw+Math.PI-Math.atan2(m.x,m.y);const want=(m.run?6.6:3.6)*Math.min(1,m.mag*1.2)*(PL.air>.02?1.05:1);sp=want;const dx=Math.sin(ang)*sp*dt,dz=Math.cos(ang)*sp*dt;
  let nx=PL.x+dx,nz=PL.z+dz;let w=walkableAt(nx,nz);if(!w){if(walkableAt(nx,PL.z)){nz=PL.z;w=1;}else if(walkableAt(PL.x,nz)){nx=PL.x;w=1;}else{nx=PL.x;nz=PL.z;}}

 const w=walkableAt(PL.x,PL.z);const ty=w?w.y:terrainHeight(PL.x,PL.z);PL.onDeck=!!(w&&w.deck);PL.gy=PL.gy??ty;PL.gy=lerp(PL.gy,ty,Math.min(1,dt*15));if(Math.abs(PL.gy-ty)>2)PL.gy=ty;

function boatDef(){return BOATS.find(b=>b.id===BOAT.type)||BOATS[0];}

function boatHitTest(x,z,rot){const m=ACT.boats[BOAT.type],len=m.len/2,d=boatDef();const pts=[[0,len],[0,-len],[.6,len*.6],[-.6,len*.6],[.6,-len*.6],[-.6,-len*.6]];for(const [lx,lz] of pts){const px=x+Math.cos(rot)*lx+Math.sin(rot)*lz,pz=z-Math.sin(rot)*lx+Math.cos(rot)*lz;if(-terrainHeight(px,pz)<d.draft+.15)return true;if(deckAt(px,pz))return true;for(const c of STRUCT.colliders)if(c.boat&&obbPush(px,pz,.2,c))return true;}return false;}
function updateBoat(dt){

 BOAT.speed+=(target-BOAT.speed)*Math.min(1,dt*(thr===0?.7:accel));

 else{S.stats.distance+=Math.hypot(nx-BOAT.x,nz-BOAT.z);BOAT.x=nx;BOAT.z=nz;}

  let best=null;for(let a=0;a<12;a++){const ax=BOAT.x+Math.cos(a/12*TAU)*1.5,az=BOAT.z+Math.sin(a/12*TAU)*1.5;if(!boatHitTest(ax,az,BOAT.rot)){best=[ax,az];break;}}if(best){BOAT.x=lerp(BOAT.x,best[0],dt*2);BOAT.z=lerp(BOAT.z,best[1],dt*2);}}

 const sl=(waveY(BOAT.x+Math.sin(BOAT.rot)*2,BOAT.z+Math.cos(BOAT.rot)*2,t)-waveY(BOAT.x-Math.sin(BOAT.rot)*2,BOAT.z-Math.cos(BOAT.rot)*2,t))/4;

 if(d.paddle&&Math.abs(thr)+Math.abs(steer)>.05){BOAT.paddlePhase+=dt*4.2;if(Math.sin(BOAT.paddlePhase)>.98&&!BOAT._pd){BOAT._pd=1;AUDIO.paddle();const side=Math.cos(BOAT.paddlePhase*.5)>0?1:-1;splash(BOAT.x+Math.cos(BOAT.rot)*side*.9,0,BOAT.z-Math.sin(BOAT.rot)*side*.9,.2);}else if(Math.sin(BOAT.paddlePhase)<.9)BOAT._pd=0;}

  if(sp>8&&Math.random()<dt*sp)for(const s of [-1,1])spawn({x:BOAT.x+Math.sin(BOAT.rot)*len*.6+Math.cos(BOAT.rot)*s,y:.3,z:BOAT.z+Math.cos(BOAT.rot)*len*.6-Math.sin(BOAT.rot)*s,vx:Math.cos(BOAT.rot)*s*3,vy:1.5,vz:-Math.sin(BOAT.rot)*s*3,g:-9.8,life:.6,size:.12,col:[.9,.95,.97,.7],water:true});}

function boardBoat(){if(PL.mode==='boat')return;PL.mode='boat';S.player.mode='boat';AUDIO.door();CAM.tDist=Math.max(CAM.tDist,ACT.boats[BOAT.type].len*1.5+4);UI.toast('Aboard the '+boatDef().n+'. Use the stick to drive.','info');if(S.quest.main===4)UI.hint('boat');}
function findLanding(){let best=null;for(let r=1.5;r<=8;r+=.75)for(let a=0;a<24;a++){const x=BOAT.x+Math.cos(a/24*TAU)*r,z=BOAT.z+Math.sin(a/24*TAU)*r;const w=walkableAt(x,z);if(w&&(w.deck||terrainHeight(x,z)>-.2)){const [rx,rz]=resolveWalk(x,z);if(Math.hypot(rx-x,rz-z)<.1)return {x,z,y:w.y};}}return best;}

UI.settingsView=function(){const s=S.settings;const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${String(s[k])===String(v)?'on':''}" data-a="set" data-v="${k}:${v}">${l}</button>`).join('')}</div>`;const sl=(k,lab)=>`<div class="setrow"><label>${lab}</label><input type="range" min="0" max="1" step="0.05" value="${s[k]}" data-set="${k}" style="max-width:200px"></div>`;

 <div class="sect">Controls</div><div class="setrow"><label>Camera sensitivity</label><input type="range" min="0.4" max="2" step="0.05" value="${s.sens}" data-set="sens" style="max-width:200px"></div><div class="setrow"><label>Invert vertical look</label>${seg('invert',[[false,'Off'],[true,'On']])}</div><div class="setrow"><label>Units</label>${seg('units',[['lb','lb / in'],['kg','kg / cm']])}</div><div class="setrow"><label>Tips</label>${seg('hints',[[true,'On'],[false,'Off']])}</div><div class="setrow"><label>Day length</label>${seg('timeScale',[[.5,'48 min'],[1,'24 min'],[2,'12 min']])}</div>
 <div class="sect">Game</div><div class="btns"><button class="btn gold" data-a="photo">📷 Photo mode</button><button class="btn" data-a="fullscreen">⛶ Fullscreen</button><button class="btn" data-a="saveNow">💾 Save now</button><button class="btn" data-a="toTitle">⌂ Title screen</button><button class="btn red" data-a="reset">Reset progress</button></div><p style="color:var(--muted);font-size:12px;margin-top:12px">Progress saves automatically${CLOUD.status==='on'?' to your account, so it follows you across devices':' in this browser'}.</p>`;};
UI.helpView=function(){return `<div class="sect">How to fish</div>
 <div class="row2"><div class="l"><b>1 · Cast</b><small>Look at the water, hold <b>CAST</b> and release. Releasing inside the gold band gives a <b>lucky cast</b>: better odds of rare and big fish.</small></div></div>
 <div class="row2"><div class="l"><b>2 · Work the lure</b><small>Each lure has a technique (shown on the lure chip). Watch the <b>Action</b> meter: the fuller it stays, the faster fish commit. Steady retrieve = hold REEL at the right speed. Stop & go = reel, then pause. Twitch = tap TWITCH, then wait. Lift & drop = tap LIFT and let it fall. Bait = cast and wait.</small></div></div>
 <div class="row2"><div class="l"><b>3 · Strike</b><small>When the float plunges or the line jolts, hit <b>STRIKE!</b> quickly — about half a second is perfect.</small></div></div>
 <div class="row2"><div class="l"><b>4 · Fight</b><small>Hold <b>REEL</b> to gain line, release to let the drag work. Keep tension out of the red. When it runs, push the stick the <b>opposite</b> way to tire it faster. If it jumps, tap <b>BOW</b>.</small></div></div>
 <div class="row2"><div class="l"><b>Reading the lake</b><small>Every species has favorite spots, depths, hours, weather and lures — check the Journal. Fishing the same spot over and over spooks fish; move around. A fish finder shows depth and fish arches.</small></div></div>
 <div class="sect">Controls</div><div class="row2"><div class="l"><b>Touch</b><small>Left side: drag to move / drive. Right side: drag to look, pinch to zoom. Big button: cast, reel, strike.</small></div></div>
 <div class="row2"><div class="l"><b>Keyboard</b><small><span class="kbd">WASD</span> move · <span class="kbd">Shift</span> run · mouse drag look · wheel zoom · <span class="kbd">Space</span> cast / reel / strike · <span class="kbd">F</span> twitch / bow · <span class="kbd">E</span> interact · <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span> reel speed · <span class="kbd">R</span> reel in · <span class="kbd">L</span> lures · <span class="kbd">M</span> map · <span class="kbd">Esc</span> menu</small></div></div>`;};
UI.mv=null;
UI.mapHi=function(){if(!UI.mapImgHi)UI.mapImgHi=UI.renderMapImage(1024);return UI.mapImgHi;};
UI.initBigMap=function(){const wrap=$('#mapWrap');if(!wrap)return;const cv=wrap.querySelector('canvas');UI.mapHi();
 const fit=()=>{const r=wrap.getBoundingClientRect();return Math.min(r.width,r.height)/1500;};
 if(!UI.mv)UI.mv={cx:PL.x*.25,cz:PL.z*.25,scale:0};
 const mv=UI.mv;mv.fit=fit();if(!mv.scale)mv.scale=mv.fit;
 const ptrs=new Map();let last=null;
 const clampV=()=>{const r=wrap.getBoundingClientRect();mv.fit=fit();mv.scale=clamp(mv.scale,mv.fit*.9,mv.fit*8);const hw=r.width/2/mv.scale,hh=r.height/2/mv.scale;mv.cx=clamp(mv.cx,-800+Math.min(hw,800),800-Math.min(hw,800));mv.cz=clamp(mv.cz,-800+Math.min(hh,800),800-Math.min(hh,800));};
 const zoomAt=(k,sx,sy)=>{const r=wrap.getBoundingClientRect();const wx=mv.cx+(sx-r.width/2)/mv.scale,wz=mv.cz+(sy-r.height/2)/mv.scale;mv.scale*=k;clampV();mv.cx=wx-(sx-r.width/2)/mv.scale;mv.cz=wz-(sy-r.height/2)/mv.scale;clampV();UI.drawBigMap();};
 UI.mapZoomAt=zoomAt;UI.mapClamp=clampV;
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);last=null;
  const now=performance.now();if(ptrs.size===1&&now-(UI._mapTap||0)<300){const r=wrap.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top);}UI._mapTap=now;};
 cv.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){mv.cx-=(e.clientX-prev[0])/mv.scale;mv.cz-=(e.clientY-prev[1])/mv.scale;clampV();UI.drawBigMap();}
  else if(ptrs.size===2){const [a,b2]=[...ptrs.values()];const d=Math.hypot(a[0]-b2[0],a[1]-b2[1]),mx=(a[0]+b2[0])/2,my=(a[1]+b2[1])/2;if(last){const r=wrap.getBoundingClientRect();mv.cx-=(mx-last.mx)/mv.scale;mv.cz-=(my-last.my)/mv.scale;zoomAt(d/Math.max(1,last.d),mx-r.left,my-r.top);}last={d,mx,my};}};
 const up=e=>{ptrs.delete(e.pointerId);last=null;};cv.onpointerup=up;cv.onpointercancel=up;
 cv.onwheel=e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0018),e.clientX-r.left,e.clientY-r.top);};
 clampV();UI.drawBigMap();
 if(UI._mapRO)UI._mapRO.disconnect();if(window.ResizeObserver){UI._mapRO=new ResizeObserver(()=>{clampV();UI.drawBigMap();});UI._mapRO.observe(wrap);}};
UI.drawBigMap=function(){const wrap=$('#mapWrap');if(!wrap||!UI.mv)return;const cv=wrap.querySelector('canvas'),r=wrap.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
 const W=Math.max(2,Math.round(r.width*dpr)),H=Math.max(2,Math.round(r.height*dpr));if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
 const c=cv.getContext('2d'),mv=UI.mv,sc=mv.scale*dpr;c.setTransform(1,0,0,1,0,0);c.fillStyle='#24302a';c.fillRect(0,0,W,H);
 const P=(x,z)=>[(x-mv.cx)*sc+W/2,(z-mv.cz)*sc+H/2];
 const [ix,iy]=P(-800,-800);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(UI.mapHi(),ix,iy,1600*sc,1600*sc);
 const zoom=mv.scale/mv.fit;c.textAlign='center';c.textBaseline='middle';
 const label=(t,x,y,font,fill,stroke='rgba(0,0,0,.6)')=>{c.font=font;c.lineWidth=3*dpr;c.strokeStyle=stroke;c.strokeText(t,x,y);c.fillStyle=fill;c.fillText(t,x,y);};
 // paths when zoomed in
 if(zoom>2.2){c.strokeStyle='rgba(120,90,55,.75)';c.lineWidth=Math.max(1,1.6*sc);c.setLineDash([4*dpr,3*dpr]);for(const pth of PATHS){c.beginPath();pth.forEach(([x,z],i)=>{const [a,b2]=P(x,z);i?c.lineTo(a,b2):c.moveTo(a,b2);});c.stroke();}c.setLineDash([]);}
 // zone labels
 const fz=Math.round(clamp(11+zoom*1.6,12,20)*dpr);
 for(const z of ZONES){if(z.secret&&!S.zones.includes(z.id))continue;const [x,y]=P(z.x,z.z);if(x<-200||y<-50||x>W+200||y>H+50)continue;const known=S.zones.includes(z.id);if(!known&&zoom<2.5){c.fillStyle='rgba(255,245,225,.55)';c.beginPath();c.arc(x,y,3*dpr,0,TAU);c.fill();continue;}
  if(zoom>2.5){c.strokeStyle=known?'rgba(255,240,200,.35)':'rgba(255,240,200,.15)';c.lineWidth=1.5*dpr;c.setLineDash([6*dpr,5*dpr]);c.beginPath();c.arc(x,y,z.r*sc,0,TAU);c.stroke();c.setLineDash([]);}
  label(known?z.name:'? Unexplored',x,y,`600 ${fz}px Fraunces, Georgia, serif`,known?'rgba(255,245,225,.95)':'rgba(255,245,225,.5)');}
 // buildings & landmarks
 const fb=Math.round(clamp(9+zoom*1.3,11,16)*dpr);
 for(const b of STRUCT.buildings){const [x,y]=P(b.x,b.z);c.fillStyle='#f2b84b';c.strokeStyle='#2a1d08';c.lineWidth=1.5*dpr;c.beginPath();c.arc(x,y,(zoom>3?6:4.5)*dpr,0,TAU);c.fill();c.stroke();if(zoom>3.2)label(b.name,x,y-14*dpr,`800 ${fb}px Nunito, sans-serif`,'#ffe7b0');}
 const [vx,vy]=P(POI.village.x,POI.village.z);if(zoom<=3.2)label('Lantern Cove Village',vx,vy+24*dpr,`800 ${fb}px Nunito, sans-serif`,'#fff');
 if(zoom>2)for(const [k,n] of [['lighthouse','Lighthouse'],['lookout','Fire lookout'],['camp','Campsite'],['mill','Old mill'],['overlook','Falls overlook'],['wreck','Wreck of the Marigold']]){const p2=POI[k];const [x,y]=P(p2.x,p2.z);label('◆ '+n,x,y+16*dpr,`700 ${fb}px Nunito, sans-serif`,'#e8e2d0');}
 if(S.quest.main>=6)for(const l of STRUCT.lanterns){const [x,y]=P(l.x,l.z);const lit=S.lanterns.includes(l.id);c.fillStyle=lit?'#7ff3ff':'#c58bff';c.shadowColor=lit?'#7ff3ff':'transparent';c.shadowBlur=lit?14*dpr:0;c.beginPath();c.arc(x,y,7*dpr,0,TAU);c.fill();c.shadowBlur=0;if(zoom>2.5)label(l.name,x,y+16*dpr,`700 ${fb}px Nunito, sans-serif`,lit?'#bff8ff':'#e0c8ff');}
 const q=curQuest(),qt=q.target&&q.target();if(qt){const [x,y]=P(qt[0],qt[1]);c.strokeStyle='#6fb6ff';c.lineWidth=3*dpr;c.beginPath();c.arc(x,y,13*dpr,0,TAU);c.stroke();c.fillStyle='#6fb6ff';c.beginPath();c.arc(x,y,4*dpr,0,TAU);c.fill();}
 if(PL.mode!=='boat'){const [bx,by]=P(BOAT.x,BOAT.z);c.fillStyle='#e0703a';c.strokeStyle='#fff';c.lineWidth=2*dpr;c.beginPath();c.arc(bx,by,6*dpr,0,TAU);c.fill();c.stroke();}

function updateFX(dt){

 for(let i=FX.parts.length-1;i>=0;i--){const p=FX.parts[i];p.age+=dt;if(p.age>=p.life){FX.parts.splice(i,1);continue;}
  p.vy+=p.g*dt;const dr=Math.exp(-p.drag*dt);p.vx*=dr;p.vy*=p.drag?dr:1;p.vz*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.water&&p.y<0&&p.vy<0){p.life=Math.min(p.life,p.age+.05);}
  if(p.update)p.update(p,dt);

  buf.pos[k*3]=p.x;buf.pos[k*3+1]=p.y;buf.pos[k*3+2]=p.z;buf.size[k]=p.size+p.grow*t;
  const a=p.col[3]*(p.fadeIn?Math.min(1,t*6):1)*(1-Math.pow(t,1.5)*p.fade);buf.col.set([p.col[0],p.col[1],p.col[2],a],k*4);}
 // rain streaks (lines)
 FX.lineN=0;const rain=ENV.rain;
 if(rain>.02){const n=Math.floor(FX.rain.length*rain),L=FX.lineBuf;const wx=ENV.windDir[0]*ENV.windStrength*2,wz=ENV.windDir[1]*ENV.windStrength*2;

   const x=cam[0]+d[0],z=cam[2]+d[2],y=cam[1]+d[1]-10;if(y<0&&Math.random()<.04)spawn({x,y:.02,z,life:.35,size:.12,grow:.25,col:[.8,.85,.9,.35]});
   const o=FX.lineN*6;L[o]=x;L[o+1]=y;L[o+2]=z;L[o+3]=x-wx*.06;L[o+4]=y+.55*d[3];L[o+5]=z-wz*.06;FX.lineN++;}}
}
function drawFX(){

 gl.depthMask(true);gl.disable(gl.BLEND);

const TOURN={active:false,t:0,dur:300,format:'heavy',rivals:[],me:[],prize:[750,350,150],fee:60};
const TFORMATS={heavy:{n:'Big Fish Derby',d:'Heaviest single fish wins.'},bag:{n:'Bag Limit Classic',d:'Best total weight of your 3 heaviest fish.'},species:{n:'Species Hunt',d:'Most different species wins (weight breaks ties).'}};
TOURN.formatToday=()=>['heavy','bag','species'][ENV.day%3];
TOURN.start=function(){if(TOURN.active)return;if(!spend(TOURN.fee))return;TOURN.active=true;TOURN.t=0;TOURN.format=TOURN.formatToday();TOURN.me=[];const names=['Rosa Vance','Eli Park','Mara Quill','Cole Hart','Dex Moreno','Nell Fisher'];TOURN.rivals=names.map((n,i)=>({n,skill:.65+i*.09+Math.random()*.1,catches:[],next:15+Math.random()*40}));UI.toast('🏁 '+TFORMATS[TOURN.format].n+' has begun! 5 minutes on the clock.','quest');AUDIO.quest();UI.modalClose();};
TOURN.score=list=>{if(TOURN.format==='heavy')return Math.max(0,...list.map(c=>c.lb));if(TOURN.format==='bag')return [...list].sort((a,b)=>b.lb-a.lb).slice(0,3).reduce((s,c)=>s+c.lb,0);const sp=new Set(list.map(c=>c.f));return sp.size+Math.max(0,...list.map(c=>c.lb))*.001;};
TOURN.fmt=v=>TOURN.format==='species'?Math.floor(v)+' species':fmtW(v);
TOURN.onCatch=(f,lb)=>{if(!TOURN.active)return;TOURN.me.push({f:f.id,lb});UI.toast('Tournament catch: '+fmtW(lb)+' '+f.n,'quest');};
TOURN.update=function(dt){if(!TOURN.active)return;TOURN.t+=dt;for(const r of TOURN.rivals){r.next-=dt;if(r.next<0){r.next=(28+Math.random()*50)/r.skill;const pool=FISH.filter(x=>!x.legend&&!x.only);let f=pool[Math.floor(Math.random()*pool.length)];for(let k=0;k<3&&f.r>1;k++)if(Math.random()<.55)f=pool[Math.floor(Math.random()*pool.length)];const lb=+(f.min+(f.max-f.min)*Math.pow(Math.random(),3.4/r.skill)*.6).toFixed(2);r.catches.push({f:f.id,lb});}}
 if(TOURN.t>=TOURN.dur)TOURN.finish();};
TOURN.standings=function(){const rows=TOURN.rivals.map(r=>({n:r.n,s:TOURN.score(r.catches)}));rows.push({n:'You',s:TOURN.score(TOURN.me),me:true});rows.sort((a,b)=>b.s-a.s);return rows;};
TOURN.finish=function(){TOURN.active=false;const rows=TOURN.standings();const rank=rows.findIndex(r=>r.me)+1;S.stats.tourns++;let prize=0;if(rank<=3&&TOURN.score(TOURN.me)>0){prize=TOURN.prize[rank-1];addMoney(prize);if(rank===1){S.stats.tournWins++;addXP(300);}else addXP(120);}
 UI.tournResult(rows,rank,prize);checkAch();saveGame();};

 for(let i=S0.length-1;i>=0;i--){const s=S0[i];if(Math.hypot(s.x-cx,s.z-cz)>70)S0.splice(i,1);}

}

function playerPose(){const c=PLCHAR,s=F.state,t=R.time;const hat=OUTFIT.hats[S.outfit.hat]||OUTFIT.hats[0],sh=OUTFIT.shirts[S.outfit.shirt]||OUTFIT.shirts[0];
 c.hat=S.outfit.hat;c.hatCol=COL(hat[1]).slice(0,3);c.shirtCol=COL(sh[1]).slice(0,3);c.pantsCol=COL('#3a4458').slice(0,3);c.vest=S.outfit.shirt===2?COL('#6a7a4a').slice(0,3):null;c.skinC=c.skinC||SRGB([.96,.8,.68]);c.shirtStyle=S.outfit.shirt;c.hair=S.outfit.hair??0;c.hairCol=COL(['#3a2414','#141010','#8a5a2a','#c89a50','#6a2a18','#8a8a86'][S.outfit.hairCol??0]).slice(0,3);c.beard=!!S.outfit.beard;
 const a={t,walk:0,phase:PL.walkPhase,sit:0};
 if(PL.mode==='walk'){a.walk=clamp(PL.speed/3.6,0,1.5);c.x=PL.x;c.y=PL.y;c.z=PL.z;c.rot=PL.rot;if(PL.air>.02){a.walk=0;a.crouch=.9;a.larm=[-2.4,-.25,-.3];a.rarm=[-2.4,.25,-.3];a.lean=.06;}}
 else{const m=ACT.boats[BOAT.type];const cs=Math.cos(BOAT.rot),sn=Math.sin(BOAT.rot);const sx=m.seatX||0,sz=m.seatZ||0;c.x=BOAT.x+cs*sx+sn*sz;c.z=BOAT.z-sn*sx+cs*sz;c.y=BOAT.y+(m.float||0)+(m.seatY||0)+(m.deckY||0)-.37+(BOAT.pitch*-sz)-(boatDef().paddle?.12:0);c.rot=BOAT.rot;a.sit=1;
  if(boatDef().paddle&&s==='idle'){const p=BOAT.paddlePhase,mv=Math.abs(BOAT.speed)>.1;a.rarm=[-1.1+(mv?Math.sin(p)*.35:0),-.25,-.9];a.larm=[-1.1-(mv?Math.sin(p)*.35:0),.25,-.9];a.twist=mv?Math.sin(p)*.25:0;}
  else if(!boatDef().paddle&&s==='idle'){a.rarm=[-.9,-.1,-.6];a.larm=[-.7,.1,-.5];}}
 // face the cast direction while fishing
 if(s!=='idle'&&s!=='landed'){const fy=Math.atan2(-Math.sin(CAM.yaw),-Math.cos(CAM.yaw));let face=fy;if(s==='fight')face=Math.atan2(F.fight.fx-PL.x,F.fight.fz-PL.z);else if((s==='water'||s==='bite'||s==='snag')&&F.lure)face=Math.atan2(F.lure.x-PL.x,F.lure.z-PL.z);
  if(PL.mode==='walk'){PL.rot+=wrapAngle(face-PL.rot)*.15;c.rot=PL.rot;}else{a.twist=clamp(wrapAngle(face-BOAT.rot),-1.2,1.2)*.8;}}
 const reelArm=F.reel?[-1.15+Math.sin(t*14)*.18,.35,-1.05+Math.cos(t*14)*.18]:[-1.15,.35,-1.05];
 if(s==='charge'){a.rarm=[-2.5-F.power*.4,-.15,-.5];a.larm=[-1.3,.3,-.9];a.lean=-.08;}
 else if(s==='flight'){a.rarm=[-1.2,-.15,-.3];a.larm=[-1,.3,-.8];a.lean=.1;}
 else if(s==='water'||s==='bite'||s==='snag'){a.rarm=[-1.05,-.12,-.55];a.larm=reelArm;}
 else if(s==='fight'){a.rarm=[-1.55,-.12,-.75];a.larm=reelArm;a.lean=-.2;}
 else if(s==='landed'){a.rarm=[-.62,-.18,-1.25];a.larm=[-.62,.18,-1.25];a.lean=-.04;a.headPitch=.25;}
 c.anim=a;c.refl=true;}
